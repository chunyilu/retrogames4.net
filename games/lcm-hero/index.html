<script>
(() => {
  'use strict';

  const canvas = document.getElementById('lcmCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1024;
  const H = 720;

  // =========================================================================
  // RETRO CHIPTUNE AUDIO SYNTHESIZER (Web Audio API)
  // =========================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
    }
    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) this.ctx = new AudioCtx();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    playNotes(notes, type = 'square', gainVal = 0.14) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      let t = this.ctx.currentTime;
      for (const [freq, dur] of notes) {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(gainVal, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + dur);
        t += dur * 0.9;
      }
    }
    play(name) {
      if (name === 'step') this.playNotes([[240, 0.04]], 'sine', 0.08);
      else if (name === 'encounter') this.playNotes([[330, 0.06], [440, 0.06], [554, 0.08], [660, 0.12]], 'square', 0.15);
      else if (name === 'win') this.playNotes([[523.25, 0.08], [659.25, 0.08], [783.99, 0.08], [1046.5, 0.22]], 'square', 0.16);
      else if (name === 'deflect') this.playNotes([[300, 0.08], [180, 0.12], [120, 0.18]], 'sawtooth', 0.18);
      else if (name === 'fairy') this.playNotes([[587.33, 0.07], [783.99, 0.07], [987.77, 0.09], [1174.66, 0.18]], 'sine', 0.16);
      else if (name === 'buy') this.playNotes([[660, 0.06], [880, 0.12]], 'triangle', 0.16);
      else if (name === 'cutscene') this.playNotes([[440, 0.10], [554.37, 0.10], [659.25, 0.10], [880, 0.28]], 'triangle', 0.16);
    }
  }
  const sound = new SoundEngine();

  // =========================================================================
  // SCORE SUBMISSION TO RETROGAMES4.NET BACKEND
  // =========================================================================
  function recordLcmHeroScore(starPoints) {
    if (!starPoints || starPoints <= 0) return;
    try {
      const storedUser = localStorage.getItem('retrogames4User');
      if (!storedUser) return;
      const user = JSON.parse(storedUser);
      const userId = user.id || user.userId || user._id;
      if (!userId) return;

      const API_BASE_URL = window.API_BASE_URL || 'https://retrogames-service.onrender.com';
      fetch(`${API_BASE_URL}/scores`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: userId,
          userId: userId,
          game_id: 'lcm-hero',
          gameId: 'lcm-hero',
          score: Number(starPoints),
          email: user.email || ''
        })
      }).then(res => res.json()).then(data => {
        const cachedKey = `retrogames4_scores_${userId}`;
        let cached = [];
        try { cached = JSON.parse(localStorage.getItem(cachedKey) || '[]'); } catch (e) { cached = []; }
        cached.unshift({
          id: (data && data.id) || Date.now(),
          user_id: userId,
          userId: userId,
          game_id: 'lcm-hero',
          gameId: 'lcm-hero',
          score: Number(starPoints),
          created_at: new Date().toISOString()
        });
        localStorage.setItem(cachedKey, JSON.stringify(cached));
      }).catch(err => console.warn('Could not record LCM Hero score:', err));
    } catch (e) {
      console.warn('Error in recordLcmHeroScore:', e);
    }
  }

  // =========================================================================
  // ARITHMETIC ENGINE & SHORT DIVISION (短除法) SOLVER
  // =========================================================================
  const ProblemType = {
    PRIME_PAIR: 'prime_pair',
    OVERLAPPING: 'overlapping',
    CONTAINED: 'contained',
    THREE_RUSH: 'three_number_rush'
  };

  function gcd(a, b) {
    while (b !== 0) {
      const t = b;
      b = a % b;
      a = t;
    }
    return a;
  }

  function computeLcm(nums) {
    return nums.reduce((acc, n) => (acc * n) / gcd(acc, n), nums[0]);
  }

  function buildShortDivision(numbers) {
    let current = [...numbers];
    const steps = [];
    const divisorsUsed = [];
    const primes = [2, 3, 5, 7, 11, 13, 17, 19];

    while (true) {
      let found = null;
      for (const p of primes) {
        if (current.every(x => x % p === 0)) {
          found = p;
          break;
        }
      }
      if (found === null && current.length >= 3) {
        for (const p of primes) {
          if (current.filter(x => x % p === 0).length >= 2) {
            found = p;
            break;
          }
        }
      }
      if (found === null) break;

      const before = [...current];
      const nextRow = [];
      const divNums = [];
      for (const x of current) {
        if (x % found === 0) {
          nextRow.push(x / found);
          divNums.push(x);
        } else {
          nextRow.push(x);
        }
      }
      steps.push({
        divisor: found,
        input: before,
        output: nextRow,
        explanation: `Divide ${divNums.join(', ')} by shared prime factor ${found} → [${nextRow.join(', ')}]`
      });
      divisorsUsed.push(found);
      current = nextRow;
    }

    const remainders = [...current];
    let allFactors = [...divisorsUsed, ...remainders.filter(r => r !== 1 || divisorsUsed.length === 0)];
    if (allFactors.length === 0) allFactors = [1];
    return { steps, remainders, allFactors };
  }

  const POOLS = {
    [ProblemType.PRIME_PAIR]: [[2, 3], [2, 5], [3, 5], [2, 7], [3, 7], [4, 5], [3, 8], [4, 9], [5, 6], [5, 7]],
    [ProblemType.OVERLAPPING]: [[4, 6], [6, 8], [6, 9], [6, 10], [8, 10], [8, 12], [9, 12], [10, 15], [12, 15]],
    [ProblemType.CONTAINED]: [[2, 4], [2, 6], [3, 6], [3, 9], [4, 8], [4, 12], [5, 10], [5, 15], [6, 12], [7, 14]],
    [ProblemType.THREE_RUSH]: [[2, 3, 4], [3, 4, 6], [2, 3, 6], [2, 4, 6], [2, 5, 10], [3, 5, 15], [2, 3, 5], [4, 6, 8]]
  };

  const CONCEPT_HINTS = {
    [ProblemType.PRIME_PAIR]: 'Prime / Coprime Pair: These numbers share NO factor > 1! Multiply directly: a × b = LCM.',
    [ProblemType.OVERLAPPING]: 'Overlapping Factors: They share a common prime factor! Use Short Division (短除法) so you do not multiply the shared factor twice.',
    [ProblemType.CONTAINED]: 'Contained Multiples: Notice the larger number is already a multiple of the smaller number — so the larger number IS the LCM!',
    [ProblemType.THREE_RUSH]: 'Three-Number Rush: Find the smallest number divisible by ALL THREE shield numbers using Short Division step-by-step!'
  };

  // =========================================================================
  // ADAPTIVE EDGE AI MODEL (Offline Latency & Mastery Tracker)
  // =========================================================================
  class AdaptiveEdgeAI {
    constructor() {
      this.records = {};
      Object.values(ProblemType).forEach(pt => {
        this.records[pt] = { attempts: 0, correct: 0, incorrect: 0, slow: 0, latencies: [], weight: 1.0 };
      });
      this.eventLog = ['Edge AI initialized: monitoring combat response latency & shield mastery.'];
    }
    recordAttempt(pt, nums, isCorrect, latencySec) {
      const rec = this.records[pt];
      rec.attempts++;
      rec.latencies.push(Math.max(0.1, latencySec));
      if (rec.latencies.length > 8) rec.latencies.shift();

      const isSlow = latencySec > 15.0;
      let note = '';
      if (isCorrect) {
        rec.correct++;
        if (isSlow) {
          rec.slow++;
          rec.weight = Math.min(4.0, rec.weight + 0.75);
          note = `AI Notice: Solved [${nums.join(', ')}] in ${latencySec.toFixed(1)}s (>15s). Boosting '${pt}' practice weight to ${rec.weight.toFixed(2)}x.`;
        } else {
          rec.weight = Math.max(1.0, rec.weight - 0.35);
          note = `AI Notice: Fast mastery on [${nums.join(', ')}] (${latencySec.toFixed(1)}s)! Weight: ${rec.weight.toFixed(2)}x.`;
        }
      } else {
        rec.incorrect++;
        if (isSlow) rec.slow++;
        rec.weight = Math.min(4.5, rec.weight + 1.1);
        note = `AI Notice: Struggle detected on [${nums.join(', ')}] (${pt}). Boosting targeted spawn weight to ${rec.weight.toFixed(2)}x.`;
      }
      this.eventLog.unshift(note);
      if (this.eventLog.length > 8) this.eventLog.pop();
    }
  }

  function createProblem(pt) {
    const pool = POOLS[pt] || POOLS[ProblemType.PRIME_PAIR];
    const numbers = pool[Math.floor(Math.random() * pool.length)];
    const lcmVal = computeLcm(numbers);
    const rawProduct = numbers.reduce((a, b) => a * b, 1);

    const commonTrap = rawProduct > lcmVal ? rawProduct : lcmVal * 2;
    const candidates = [
      commonTrap,
      lcmVal * 2,
      lcmVal * 3,
      numbers.reduce((a, b) => a + b, 0),
      Math.max(...numbers) * 2,
      Math.min(...numbers) * 3,
      lcmVal + 2,
      Math.max(2, lcmVal - 2)
    ];
    const distractors = [commonTrap];
    for (const c of candidates) {
      if (c > 0 && c !== lcmVal && !distractors.includes(c) && distractors.length < 3) {
        distractors.push(c);
      }
    }
    let fb = lcmVal + 1;
    while (distractors.length < 3) {
      if (fb !== lcmVal && !distractors.includes(fb)) distractors.push(fb);
      fb++;
    }
    const spellCards = [lcmVal, ...distractors.slice(0, 3)].sort((a, b) => a - b);
    const sd = buildShortDivision(numbers);
    const multiples = {};
    for (const n of numbers) {
      const cnt = Math.max(5, Math.min(9, Math.floor(lcmVal / n) + 2));
      multiples[n] = Array.from({ length: cnt }, (_, i) => n * (i + 1));
    }

    return {
      numbers,
      problemType: pt,
      lcm: lcmVal,
      spellCards,
      steps: sd.steps,
      remainders: sd.remainders,
      allFactors: sd.allFactors,
      multiples,
      conceptHint: CONCEPT_HINTS[pt],
      evaluate(val) {
        const ns = numbers.join(', ');
        if (val === lcmVal) {
          return { ok: true, msg: `Direct Hit! ${lcmVal} is the Least Common Multiple of [${ns}]!` };
        }
        const isCommon = numbers.every(n => val > 0 && val % n === 0);
        if (isCommon && val > lcmVal) {
          return { ok: false, msg: `Shield Deflected! ${val} IS a common multiple of [${ns}], but NOT the LEAST (smallest) one!` };
        }
        const nonDiv = numbers.filter(n => val % n !== 0);
        return { ok: false, msg: `Shield Deflected! ${val} is not divisible by ${nonDiv.join(' and ')}!` };
      }
    };
  }

  // =========================================================================
  // ZONES, SHOP & GAME STATE
  // =========================================================================
  const ZONES = {
    1: {
      name: '1. Whispering Woods',
      subtitle: 'Prime Pair Sanctuary',
      shieldLabel: 'Prime Pair (e.g., [3, 5])',
      pt: ProblemType.PRIME_PAIR,
      monsters: [['Emerald Slime', 'slime'], ['Forest Slime', 'slime'], ['King Slime', 'slime']],
      gift: 'Starlight Crest of Primes',
      tierName: 'Prime Knight',
      colors: { floorA: '#2e623a', floorB: '#285834', wall: '#1c3824', accent: '#78eb8c' }
    },
    2: {
      name: '2. Shadow Caves',
      subtitle: 'Caverns of Overlapping Factors',
      shieldLabel: 'Overlapping Factors (e.g., [4, 6])',
      pt: ProblemType.OVERLAPPING,
      monsters: [['Echo Bat', 'bat'], ['Crystal Golem', 'golem'], ['Obsidian Warden', 'golem']],
      gift: 'Lantern of Common Divisors',
      tierName: 'Factor Paladin',
      colors: { floorA: '#303452', floorB: '#2a2e4a', wall: '#1a1c30', accent: '#aa8cff' }
    },
    3: {
      name: '3. Misty Barrens',
      subtitle: 'Plains of Contained Multiples',
      shieldLabel: 'Contained Multiples (e.g., [3, 6])',
      pt: ProblemType.CONTAINED,
      monsters: [['Mist Phantom', 'knight'], ['Mirage Lancer', 'knight'], ['Gatekeeper General', 'knight']],
      gift: 'The Legendary Holy Sword',
      tierName: 'Holy Arithmancer',
      colors: { floorA: '#5c4a3a', floorB: '#524234', wall: '#342822', accent: '#ffd76e' }
    },
    4: {
      name: '4. Demon Castle',
      subtitle: 'Citadel of the Three-Number Rush',
      shieldLabel: 'Three-Number Rush (e.g., [3, 4, 6])',
      pt: ProblemType.THREE_RUSH,
      monsters: [['Chaos Gargoyle', 'golem'], ['Abyssal Executioner', 'knight'], ['Demon King Malphas', 'demon_king']],
      gift: 'Crown of Eternal Harmony',
      tierName: 'Grand Champion of LCM',
      colors: { floorA: '#44222e', floorB: '#3a1c28', wall: '#241018', accent: '#ff5f69' }
    }
  };

  const SHOP_ITEMS = [
    { id: 'sword1', name: 'The Multiplier Sword', cost: 50, desc: 'Golden blade! +25% Star Points & +10 Gold per win.', purchased: false },
    { id: 'shield1', name: 'The Prime Number Shield', cost: 60, desc: 'Sacred emerald shield! +3 Max HP and heals +3 HP.', purchased: false },
    { id: 'sword2', name: 'Arcane Multiplier Greatsword', cost: 120, desc: 'Twin energy runes! +50% Star Points & +20 Gold per win.', purchased: false },
    { id: 'shield2', name: 'Aegis of Eratosthenes', cost: 130, desc: 'Platinum prime barrier! +4 Max HP & full heal.', purchased: false },
    { id: 'charm', name: 'Fairy Tutor Lantern', cost: 75, desc: 'Auto-summons the Short Division Fairy after just 1 mistake!', purchased: false },
    { id: 'potion', name: 'Numerist Healing Potion', cost: 25, desc: 'Restores +3 HP immediately (repeatable).', purchased: false }
  ];

  const ai = new AdaptiveEdgeAI();
  const hero = {
    hp: 5,
    maxHp: 5,
    starPoints: 0,
    gold: 40,
    tier: 1,
    tierTitle: 'Apprentice Numerist',
    swordLevel: 0,
    shieldLevel: 0,
    hasFairyCharm: false,
    x: 2,
    y: 5,
    streak: 0
  };

  let scene = 'TITLE'; // TITLE, EXPLORE, COMBAT, FAIRY, SHOP, AI, CUTSCENE, VICTORY, GAMEOVER
  let currentZone = 1;
  let zonesCleared = 0;
  let monsters = [];
  let activeMonster = null;
  let consecutiveWrong = 0;
  let combatFeedback = '';
  let selectedCard = 0;
  let questionStartMs = 0;
  let fairyTab = 'short_division'; // 'short_division' or 'multiples'
  let statusBanner = 'Use Arrow Keys / WASD or click tiles to explore! Walk into monsters to battle.';
  let particles = [];
  let clickableRects = [];

  function spawnBurst(x, y, color, count = 24) {
    for (let i = 0; i < count; i++) {
      const a = (Math.PI * 2 * i) / count + Math.random() * 0.3;
      const spd = 2 + Math.random() * 4;
      particles.push({ x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd - 1.5, color, life: 35 });
    }
  }

  function loadZone(z) {
    currentZone = z;
    hero.x = 2;
    hero.y = 5;
    const zCfg = ZONES[z];
    const positions = [[6, 3], [9, 6], [12, 4]];
    monsters = zCfg.monsters.map(([mName, species], idx) => ({
      id: idx,
      name: mName,
      species,
      x: positions[idx][0],
      y: positions[idx][1],
      isBoss: idx === 2,
      defeated: false,
      problem: createProblem(zCfg.pt)
    }));
    statusBanner = `Entered ${zCfg.name}: ${zCfg.shieldLabel}`;
  }

  loadZone(1);

  function getProgress() {
    const defeatedInZone = monsters.filter(m => m.defeated).length;
    return Math.min(1, (zonesCleared + defeatedInZone / 3) / 4);
  }

  // =========================================================================
  // GAME LOGIC & ACTIONS
  // =========================================================================
  function moveHero(dx, dy) {
    if (scene !== 'EXPLORE') return;
    const nx = hero.x + dx;
    const ny = hero.y + dy;
    if (nx < 1 || nx >= 15 || ny < 1 || ny >= 9) return;

    // Check Shop tile (2, 2)
    if (nx === 2 && ny === 2) {
      hero.x = nx;
      hero.y = ny;
      scene = 'SHOP';
      sound.play('buy');
      return;
    }

    // Check Signpost tile (4, 2)
    if (nx === 4 && ny === 2) {
      hero.x = nx;
      hero.y = ny;
      statusBanner = `Signpost: ${CONCEPT_HINTS[ZONES[currentZone].pt]}`;
      sound.play('step');
      return;
    }

    // Check Monster encounter
    const m = monsters.find(mon => !mon.defeated && mon.x === nx && mon.y === ny);
    if (m) {
      activeMonster = m;
      consecutiveWrong = 0;
      selectedCard = 0;
      combatFeedback = `Wild ${m.name} appeared with Mathematical Shield [${m.problem.numbers.join(', ')}]!`;
      questionStartMs = performance.now();
      scene = 'COMBAT';
      sound.play('encounter');
      return;
    }

    // Check Portal tile (14, 5)
    if (nx === 14 && ny === 5) {
      const allDefeated = monsters.every(mon => mon.defeated);
      if (!allDefeated) {
        statusBanner = 'Castle Gate Locked! Defeat all 3 zone monsters to open the portal.';
        sound.play('deflect');
        return;
      }
      hero.x = nx;
      hero.y = ny;
      zonesCleared = Math.max(zonesCleared, currentZone);
      const starBonus = 150 * currentZone;
      const goldBonus = 45 * currentZone;
      hero.starPoints += starBonus;
      hero.gold += goldBonus;
      hero.tierTitle = ZONES[currentZone].tierName;
      recordLcmHeroScore(hero.starPoints);
      spawnBurst(W / 2, H / 2, '#ffe600', 36);
      sound.play('cutscene');
      scene = 'CUTSCENE';
      return;
    }

    hero.x = nx;
    hero.y = ny;
    sound.play('step');
  }

  function castSpellCard(idx) {
    if (scene !== 'COMBAT' || !activeMonster) return;
    if (activeMonster.defeated) {
      scene = 'EXPLORE';
      activeMonster = null;
      return;
    }
    const prob = activeMonster.problem;
    const chosen = prob.spellCards[idx];
    const latency = (performance.now() - questionStartMs) / 1000;
    const res = prob.evaluate(chosen);
    ai.recordAttempt(prob.problemType, prob.numbers, res.ok, latency);

    if (res.ok) {
      activeMonster.defeated = true;
      hero.streak++;
      const mult = 1 + hero.swordLevel * 0.25;
      const stars = Math.round((activeMonster.isBoss ? 150 : 100) * mult);
      const gold = (activeMonster.isBoss ? 40 : 25) + hero.swordLevel * 10;
      hero.starPoints += stars;
      hero.gold += gold;
      combatFeedback = `${res.msg} (+${stars} ⭐, +${gold} 🪙) — Press ENTER or Click to continue!`;
      recordLcmHeroScore(hero.starPoints);
      spawnBurst(730, 290, '#00f3ff', 32);
      sound.play('win');
    } else {
      consecutiveWrong++;
      hero.streak = 0;
      hero.hp = Math.max(0, hero.hp - 1);
      combatFeedback = `${res.msg} Monster counters for -1 HP!`;
      spawnBurst(260, 340, '#ff007f', 20);

      if (hero.hp <= 0) {
        recordLcmHeroScore(hero.starPoints);
        sound.play('deflect');
        scene = 'GAMEOVER';
        return;
      }

      const threshold = hero.hasFairyCharm ? 1 : 2;
      if (consecutiveWrong >= threshold) {
        fairyTab = 'short_division';
        scene = 'FAIRY';
        sound.play('fairy');
      } else {
        sound.play('deflect');
      }
    }
  }

  function buyItem(idx) {
    const item = SHOP_ITEMS[idx];
    if (!item) return;
    if (item.purchased && item.id !== 'potion') {
      statusBanner = `${item.name} is already equipped!`;
      return;
    }
    if (hero.gold < item.cost) {
      statusBanner = `Not enough Gold! Need ${item.cost} 🪙.`;
      sound.play('deflect');
      return;
    }
    hero.gold -= item.cost;
    if (item.id !== 'potion') item.purchased = true;
    if (item.id === 'sword1') hero.swordLevel = Math.max(hero.swordLevel, 1);
    if (item.id === 'sword2') hero.swordLevel = Math.max(hero.swordLevel, 2);
    if (item.id === 'shield1') { hero.maxHp += 3; hero.hp = Math.min(hero.maxHp, hero.hp + 3); hero.shieldLevel = 1; }
    if (item.id === 'shield2') { hero.maxHp += 4; hero.hp = hero.maxHp; hero.shieldLevel = 2; }
    if (item.id === 'charm') hero.hasFairyCharm = true;
    if (item.id === 'potion') hero.hp = Math.min(hero.maxHp, hero.hp + 3);
    statusBanner = `Purchased ${item.name}!`;
    sound.play('buy');
  }

      ctx.fillStyle = '#ffffff';
      ctx.font = '9px "Press Start 2P"';
      ctx.fillText(`Attempts: ${rec.attempts} | Accuracy: ${acc}% | Avg Latency: ${avgLat}s | Slow (>15s): ${rec.slow}`, 130, y + 22);
      y += 62;
    });

    ctx.fillStyle = '#78eb8c';
    ctx.font = '9px "Press Start 2P"';
    ctx.fillText(`Latest AI Log: ${ai.eventLog[0] || ''}`, 130, 465);

    const cx = W / 2 - 120, cy = H - 130, cw = 240, ch = 40;
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(cx, cy, cw, ch);
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText('CLOSE [ESC]', W / 2, cy + 25);
    addClickRect('close_ai', cx, cy, cw, ch, () => { scene = 'EXPLORE'; });
  }

  function drawCutscene() {
    const zCfg = ZONES[currentZone];
    ctx.fillStyle = '#0d1021';
    ctx.fillRect(0, 92, W, H - 92);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffe600';
    ctx.font = '20px "Press Start 2P"';
    ctx.fillText(`👑 STAGE ${currentZone} CLEARED! PRINCESS TOWER GIFT 👑`, W / 2, 185);

    ctx.fillStyle = '#00f3ff';
    ctx.font = '13px "Press Start 2P"';
    ctx.fillText(`Princess Aria bestows: ✨ ${zCfg.gift} ✨`, W / 2, 260);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Promoted to Hero Tier: ${zCfg.tierName}!`, W / 2, 315);

    const bx = W / 2 - 170, by = 430, bw = 340, bh = 54;
    ctx.fillStyle = '#ffe600';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#070711';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText(currentZone < 4 ? 'NEXT ZONE [ENTER]' : 'CLAIM VICTORY [ENTER]', W / 2, by + 34);
    addClickRect('next_zone', bx, by, bw, bh, () => {
      if (currentZone < 4) {
        loadZone(currentZone + 1);
        scene = 'EXPLORE';
      } else {
        scene = 'VICTORY';
      }
    });
  }

  function drawEndScreen(isWin) {
    ctx.fillStyle = '#0b0e1a';
    ctx.fillRect(0, 92, W, H - 92);
    ctx.textAlign = 'center';
    ctx.fillStyle = isWin ? '#ffe600' : '#ff007f';
    ctx.font = '24px "Press Start 2P"';
    ctx.fillText(isWin ? '🏆 PRINCESS RESCUED! GRAND VICTORY! 🏆' : '💔 SHIELD SHATTERED — TRY AGAIN!', W / 2, 230);

    ctx.fillStyle = '#00f3ff';
    ctx.font = '14px "Press Start 2P"';
    ctx.fillText(`FINAL STAR SCORE: ${hero.starPoints} ⭐ (Recorded to Hall of Fame)`, W / 2, 310);

    const bx = W / 2 - 160, by = 410, bw = 320, bh = 54;
    ctx.fillStyle = '#00f3ff';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#070711';
    ctx.font = '12px "Press Start 2P"';
    ctx.fillText('PLAY AGAIN [ENTER]', W / 2, by + 34);
    addClickRect('restart', bx, by, bw, bh, () => {
      hero.hp = hero.maxHp;
      if (isWin) {
        hero.starPoints = 0;
        zonesCleared = 0;
        loadZone(1);
      } else {
        loadZone(currentZone);
      }
      scene = 'EXPLORE';
    });
  }

  function render() {
    clickableRects = [];
    ctx.clearRect(0, 0, W, H);

    if (scene === 'TITLE') {
      drawTitle();
    } else {
      drawTopHud();
      if (scene === 'EXPLORE') drawExplore();
      else if (scene === 'COMBAT') drawCombat();
      else if (scene === 'FAIRY') drawFairyModal();
      else if (scene === 'SHOP') drawShopModal();
      else if (scene === 'AI') drawAiModal();
      else if (scene === 'CUTSCENE') drawCutscene();
      else if (scene === 'VICTORY') drawEndScreen(true);
      else if (scene === 'GAMEOVER') drawEndScreen(false);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.12;
      p.life--;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x, p.y, 5, 5);
      if (p.life <= 0) particles.splice(i, 1);
    }

    requestAnimationFrame(render);
  }

  // =========================================================================
  // INPUT LISTENERS
  // =========================================================================
  canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;
    for (let i = clickableRects.length - 1; i >= 0; i--) {
      const r = clickableRects[i];
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
        r.action();
        return;
      }
    }
  });

  window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();

    if (scene === 'TITLE' && (e.key === 'Enter' || e.key === ' ')) {
      sound.play('cutscene');
      scene = 'EXPLORE';
      return;
    }
    if (scene === 'EXPLORE') {
      if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') moveHero(-1, 0);
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') moveHero(1, 0);
      else if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') moveHero(0, -1);
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') moveHero(0, 1);
      else if (e.key === 'b' || e.key === 'B') scene = 'SHOP';
      else if (e.key === 'i' || e.key === 'I') scene = 'AI';
      else if (e.key === 'h' || e.key === 'H') scene = 'FAIRY';
      return;
    }
    if (scene === 'COMBAT') {
      if (activeMonster && activeMonster.defeated && (e.key === 'Enter' || e.key === ' ')) {
        scene = 'EXPLORE';
        activeMonster = null;
        return;
      }
      if (e.key === '1') castSpellCard(0);
      else if (e.key === '2') castSpellCard(1);
      else if (e.key === '3') castSpellCard(2);
      else if (e.key === '4') castSpellCard(3);
      else if (e.key === 'h' || e.key === 'H') { fairyTab = 'short_division'; scene = 'FAIRY'; sound.play('fairy'); }
      else if (e.key === 'ArrowLeft') selectedCard = (selectedCard + 3) % 4;
      else if (e.key === 'ArrowRight') selectedCard = (selectedCard + 1) % 4;
      else if (e.key === 'Enter' || e.key === ' ') castSpellCard(selectedCard);
      return;
    }
    if (scene === 'FAIRY' || scene === 'SHOP' || scene === 'AI') {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        scene = activeMonster && !activeMonster.defeated ? 'COMBAT' : 'EXPLORE';
      } else if (scene === 'SHOP' && ['1', '2', '3', '4', '5', '6'].includes(e.key)) {
        buyItem( Number(e.key) - 1 );
      }
      return;
    }
    if (scene === 'CUTSCENE' && (e.key === 'Enter' || e.key === ' ')) {
      if (currentZone < 4) { loadZone(currentZone + 1); scene = 'EXPLORE'; }
      else scene = 'VICTORY';
    }
  });

  // Top & Mobile Buttons
  document.getElementById('topShopBtn').onclick = () => { scene = scene === 'SHOP' ? 'EXPLORE' : 'SHOP'; };
  document.getElementById('topAiBtn').onclick = () => { scene = scene === 'AI' ? 'EXPLORE' : 'AI'; };
  document.getElementById('topFairyBtn').onclick = () => { scene = scene === 'FAIRY' ? (activeMonster ? 'COMBAT' : 'EXPLORE') : 'FAIRY'; };
  document.getElementById('topSoundBtn').onclick = (e) => {
    sound.enabled = !sound.enabled;
    e.currentTarget.textContent = `🔊 SOUND: ${sound.enabled ? 'ON' : 'OFF'}`;
  };

  document.getElementById('btnLeft').onclick = () => moveHero(-1, 0);
  document.getElementById('btnRight').onclick = () => moveHero(1, 0);
  document.getElementById('btnUp').onclick = () => moveHero(0, -1);
  document.getElementById('btnDown').onclick = () => moveHero(0, 1);
  document.getElementById('btnCard1').onclick = () => castSpellCard(0);
  document.getElementById('btnCard2').onclick = () => castSpellCard(1);
  document.getElementById('btnCard3').onclick = () => castSpellCard(2);
  document.getElementById('btnCard4').onclick = () => castSpellCard(3);
  document.getElementById('btnAction').onclick = () => {
    if (scene === 'TITLE') scene = 'EXPLORE';
    else if (scene === 'COMBAT' && activeMonster && activeMonster.defeated) { scene = 'EXPLORE'; activeMonster = null; }
    else if (scene === 'CUTSCENE') {
      if (currentZone < 4) { loadZone(currentZone + 1); scene = 'EXPLORE'; }
      else scene = 'VICTORY';
    } else if (scene === 'FAIRY' || scene === 'SHOP' || scene === 'AI') {
      scene = activeMonster && !activeMonster.defeated ? 'COMBAT' : 'EXPLORE';
    }
  };

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
