  // =========================================================================
  // 8. ENCORE SPECIAL (SCREEN-CLEARING HUNTRIX CONCERT ATTACK)
  // =========================================================================
  function triggerEncoreSpecial() {
    player.encore = 0;
    player.state = 'special';
    player.stateTimer = 1.45;
    player.invuln = 2.0;
    player.vx = 0;
    player.vy = 0;
    encoreTimer = 1.55;
    const lines = [
      "HOW IT'S DONE! DONE! DONE!",
      "HUNTRIX DON'T MISS!",
      "ENCORE FINALE!!",
    ];
    encoreBubbleText = lines[Math.floor(Math.random() * lines.length)];

    sfx.playEncoreSpecial();
    triggerShake(0.6, 5);
    hitstop = 0.06;

    // Summon the full HUNTRIX trio in V-formation around the player!
    encoreMembers = [];
    const others = HUNTERS.filter(h => h.id !== player.def.id);
    encoreMembers.push({ def: others[0], x: Math.max(camX + 36, player.x - 54), y: Math.max(FLOOR_MIN_Y + 8, player.y - 18), life: 1.45 });
    encoreMembers.push({ def: others[1], x: Math.min(camX + W - 36, player.x + 54), y: Math.min(FLOOR_MAX_Y - 8, player.y + 16), life: 1.45 });

    // Expanding Honmoon concert shockwaves!
    shockwaves.push({ x: player.x, y: player.y, r: 8, maxR: 340, color: '#5ef6ff', life: 0.75, maxLife: 0.75, friendly: true, hitWave: 1 });
    shockwaves.push({ x: player.x, y: player.y, r: 2, maxR: 340, color: '#ff42b3', life: 1.05, maxLife: 1.05, friendly: true, hitWave: 2 });
    shockwaves.push({ x: player.x, y: player.y, r: 0, maxR: 360, color: '#ffe066', life: 1.35, maxLife: 1.35, friendly: true, hitWave: 3 });

    // Music notes & sparkles across stage
    for (let i = 0; i < 24; i++) {
      spawnNote(camX + 20 + Math.random() * (W - 40), FLOOR_MIN_Y + Math.random() * 90, 10 + Math.random() * 40, i % 3 === 0 ? '#5ef6ff' : i % 3 === 1 ? '#ff42b3' : '#ffe066');
    }

    // Immediate & staggered screen-wide damage pulses!
    applyEncorePulse(46, false);
    setTimeout(() => { if (gameState === 'playing') applyEncorePulse(42, false); }, 340);
    setTimeout(() => { if (gameState === 'playing') applyEncorePulse(52, true); }, 700);
  }

  function applyEncorePulse(dmg, launch) {
    if (!player) return;
    triggerShake(0.2, 4);
    for (const e of enemies) {
      if (e.state === 'ko') continue;
      if (e.x < camX - 30 || e.x > camX + W + 30) continue;
      damageEnemy(e, dmg, launch ? 160 : 50, launch ? 165 : 60, player.x < e.x ? 1 : -1, true, false);
    }
  }

  // =========================================================================
  // 9. COMBAT RESOLUTION
  // =========================================================================
  function damageEnemy(e, dmg, kbX, kbZ, dir, heavy = false, grantEncore = true) {
    e.hp -= dmg;
    e.flash = 0.14;
    addCombo(1);
    const mult = 1 + Math.min(3, Math.floor(comboCount / 5) * 0.25);
    score += Math.round(dmg * 3 * mult);
    if (grantEncore) addEncore(heavy ? 3 : 1.5);

    spawnHitStar(e.x, e.y, e.z + 24, heavy);
    spawnParticles(e.x, e.y, e.z + 22, heavy ? '#ff45b5' : '#5ef6ff', heavy ? 12 : 6, heavy ? 125 : 85);
    addFloatText('-' + Math.round(dmg), e.x + (Math.random() - 0.5) * 10, e.y - e.z - 42, heavy ? '#ffe066' : '#ffffff', 1);

    if (e.hp <= 0) {
      e.hp = 0;
      e.state = 'ko';
      e.stateTimer = 0.65;
      e.vx = dir * Math.max(130, kbX);
      e.vz = Math.max(145, kbZ);
      enemiesDefeated++;
      score += Math.round(e.score * mult);
      persistLocalHighScore();
      if (grantEncore) addEncore(e.encoreGain);
      sfx.playKo();
      hitstop = e.type === 'boss' ? 0.16 : 0.06;
      triggerShake(e.type === 'boss' ? 0.55 : 0.18, e.type === 'boss' ? 6 : 3);
      addFloatText('+' + Math.round(e.score * mult), e.x, e.y - 52, '#5ef6ff', 1);

      // Chance to drop Gimbap or Cup Ramyeon
      if (e.type !== 'boss' && Math.random() < 0.26) {
        items.push({
          kind: Math.random() < 0.65 ? 'gimbap' : 'ramyeon',
          x: e.x, y: e.y, z: 18, vz: 110, life: 16,
        });
      }
    } else {
      // Boss has partial super-armor during slam, otherwise recoils!
      if (!(e.type === 'boss' && e.state === 'slam' && !heavy)) {
        e.state = 'hurt';
        e.stateTimer = heavy ? 0.42 : 0.25;
        e.vx = dir * (e.type === 'boss' ? kbX * 0.45 : kbX);
        if (kbZ > 0 && e.type !== 'boss') e.vz = kbZ;
      }
      sfx.playHit(heavy);
      hitstop = heavy ? 0.055 : 0.025;
      triggerShake(heavy ? 0.15 : 0.08, heavy ? 3 : 1.5);

      // Boss Phase 2 Enrage at <= 50% HP
      if (e.type === 'boss' && !e.enraged && e.hp <= e.maxHp * 0.5) {
        e.enraged = true;
        e.speed *= 1.18;
        addFloatText('ENRAGED!!', e.x, e.y - 68, '#ff3b8d', 1);
        shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: 130, color: '#ff2e93', life: 0.45, maxLife: 0.45, friendly: false, dmg: 0 });
        spawnEnemy('imp', Math.max(camX + 45, e.x - 120), 174);
        spawnEnemy('imp', Math.min(camX + W - 45, e.x + 90), 232);
      }
    }
  }

  function damagePlayer(dmg, dir) {
    if (player.invuln > 0 || player.state === 'special') return;
    player.hp = Math.max(0, player.hp - dmg);
    player.flash = 0.2;
    player.invuln = 0.85;
    player.state = 'hurt';
    player.stateTimer = 0.3;
    player.vx = dir * 110;
    comboCount = 0;
    comboTimer = 0;
    sfx.playHurt();
    triggerShake(0.2, 4);
    spawnHitStar(player.x, player.y, player.z + 24, true);
    addFloatText('-' + dmg, player.x, player.y - player.z - 46, '#ff4d6d', 1);

    if (player.hp <= 0) {
      player.lives--;
      if (player.lives > 0) {
        player.hp = player.maxHp;
        player.invuln = 2.0;
        player.vz = 150;
        addFloatText('SECOND WIND!', player.x, player.y - 54, '#5ef6ff', 1);
        sfx.playPickup();
      } else {
        gameState = 'gameover';
        sfx.stopBGM();
        recordKpopDemonHuntersScore(score);
      }
    }
  }

  // =========================================================================
  // 10. UPDATE LOOP
  // =========================================================================
  function updatePlayer(dt) {
    const p = player;
    const def = p.def;
    p.animTimer += dt;
    if (p.invuln > 0) p.invuln -= dt;
    if (p.flash > 0) p.flash -= dt;
    if (p.comboWindow > 0) {
      p.comboWindow -= dt;
      if (p.comboWindow <= 0) p.comboStep = 0;
    }

    // Encore Special trigger (highest priority when ready & not already in special)
    if (justPressed.special && p.encore >= 100 && p.state !== 'special' && p.state !== 'hurt') {
      triggerEncoreSpecial();
      return;
    }

    // Handle active states
    if (p.state === 'special') {
      p.stateTimer -= dt;
      if (p.stateTimer <= 0) {
        p.state = 'idle';
      }
      return;
    }

    if (p.state === 'hurt') {
      p.stateTimer -= dt;
      p.x += p.vx * dt;
      p.vx *= 0.86;
      if (p.z > 0 || p.vz !== 0) {
        p.z += p.vz * dt;
        p.vz -= GRAVITY * dt;
        if (p.z <= 0) { p.z = 0; p.vz = 0; }
      }
      if (p.stateTimer <= 0) p.state = 'idle';
      clampPlayerBounds();
      return;
    }

    // Melee 3-hit Combo Attack execution
    if (p.state === 'atk1' || p.state === 'atk2' || p.state === 'atk3') {
      p.stateTimer -= dt;
      if (justPressed.attack && p.state !== 'atk3') {
        p.comboQueued = true;
      }

      const step = p.state === 'atk1' ? 1 : p.state === 'atk2' ? 2 : 3;
      const dur = (step === 1 ? 0.19 : step === 2 ? 0.22 : 0.34) / def.atkSpeed;
      const elapsed = dur - p.stateTimer;
      const activeStart = dur * 0.22;
      const activeEnd = dur * 0.72;

      // Slight forward step on finisher
      if (step === 3 && elapsed < dur * 0.4) {
        p.x += p.facing * 52 * dt;
      }

      if (elapsed >= activeStart && elapsed <= activeEnd) {
        const reach = def.reach + (step === 3 ? 16 : step === 2 ? 6 : 0);
        const baseDmg = (step === 1 ? 15 : step === 2 ? 20 : 32) * def.power;
        for (const e of enemies) {
          if (e.state === 'ko' || e.state === 'spawn' || p.hitIds.has(e.id)) continue;
          const dx = (e.x - p.x) * p.facing;
          const dy = Math.abs(e.y - p.y);
          if (dx >= -8 && dx <= reach + 12 && dy <= 22 && e.z < 34) {
            p.hitIds.add(e.id);
            const kbX = step === 3 ? 165 : step === 2 ? 55 : 35;
            const kbZ = step === 3 ? 150 : 0;
            damageEnemy(e, Math.round(baseDmg), kbX, kbZ, p.facing, step === 3);
          }
        }
      }

      if (p.stateTimer <= 0) {
        if (p.comboQueued && step < 3) {
          startPlayerAttack(step + 1);
        } else {
          p.state = 'idle';
          p.comboStep = step < 3 ? step : 0;
          p.comboWindow = step < 3 ? 0.26 : 0;
        }
      }
      clampPlayerBounds();
      return;
    }

    // Free movement (Ground or Airborne)
    let ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let iy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (ix !== 0 && iy !== 0) { ix *= 0.707; iy *= 0.707; }

    const airMult = p.z > 0 ? 0.92 : 1.0;
    p.vx = ix * def.speed * airMult;
    p.vy = iy * def.speed * 0.68 * airMult;
    if (ix !== 0 && p.state !== 'jumpkick') p.facing = ix > 0 ? 1 : -1;

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Jump & Jump Kick physics
    if (p.z > 0 || p.vz > 0) {
      p.z += p.vz * dt;
      p.vz -= GRAVITY * dt;

      if (justPressed.attack && p.state !== 'jumpkick') {
        p.state = 'jumpkick';
        p.hitIds.clear();
        p.vx = p.facing * def.speed * 1.15;
        sfx.playSwing(2);
      }

      if (p.state === 'jumpkick') {
        // Active flying kick hitbox
        for (const e of enemies) {
          if (e.state === 'ko' || e.state === 'spawn' || p.hitIds.has(e.id)) continue;
          const dx = (e.x - p.x) * p.facing;
          const dy = Math.abs(e.y - p.y);
          if (dx >= -6 && dx <= 38 && dy <= 22 && Math.abs(e.z - p.z) <= 36) {
            p.hitIds.add(e.id);
            damageEnemy(e, Math.round(24 * def.power), 135, 115, p.facing, true);
          }
        }
        // Motion sparkle trail
        if (Math.random() < 0.5) {
          spawnParticles(p.x - p.facing * 8, p.y, p.z + 18, '#ff59b8', 1, 30);
        }
      }

      if (p.z <= 0) {
        p.z = 0;
        p.vz = 0;
        p.state = 'idle';
        spawnParticles(p.x, p.y, 0, '#d8c4f0', 4, 40);
      }
    } else {
      // Ground actions
      if (justPressed.jump) {
        p.vz = 248;
        p.z = 1;
        p.state = 'jump';
        sfx.playJump();
        spawnParticles(p.x, p.y, 0, '#ffffff', 5, 50);
      } else if (justPressed.attack) {
        const nextStep = p.comboWindow > 0 ? Math.min(3, p.comboStep + 1) : 1;
        startPlayerAttack(nextStep);
      } else {
        p.state = (Math.abs(ix) > 0.05 || Math.abs(iy) > 0.05) ? 'walk' : 'idle';
      }
    }

    clampPlayerBounds();
  }

  function startPlayerAttack(step) {
    const p = player;
    p.state = 'atk' + step;
    p.comboStep = step;
    p.comboQueued = false;
    p.hitIds.clear();
    const baseDur = step === 1 ? 0.19 : step === 2 ? 0.22 : 0.34;
    p.stateTimer = baseDur / p.def.atkSpeed;
    sfx.playSwing(step);
  }

  function clampPlayerBounds() {
    const minX = camX + 20;
    const maxX = Math.min(WORLD_WIDTH - 24, camX + W - 20);
    player.x = Math.max(minX, Math.min(maxX, player.x));
    player.y = Math.max(FLOOR_MIN_Y, Math.min(FLOOR_MAX_Y, player.y));
  }

  function updateEnemies(dt) {
    // Limit simultaneous active attackers to 2 for fair beat'em up pacing
    let activeAttackers = enemies.filter(e => e.state === 'windup' || e.state === 'atk' || e.state === 'slam').length;

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.animTimer += dt;
      if (e.flash > 0) e.flash -= dt;
      if (e.atkCooldown > 0) e.atkCooldown -= dt;
      if (e.type === 'boss' && e.slamCooldown > 0) e.slamCooldown -= dt;

      // Airborne physics
      if (e.z > 0 || e.vz > 0) {
        e.z += e.vz * dt;
        e.vz -= GRAVITY * dt;
        e.x += e.vx * dt;
        if (e.z <= 0) {
          e.z = 0;
          e.vz = 0;
          e.vx *= 0.4;
          spawnParticles(e.x, e.y, 0, '#bfa2db', 5, 45);
        }
      }

      if (e.state === 'spawn') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0) e.state = 'chase';
        continue;
      }

      if (e.state === 'ko') {
        e.stateTimer -= dt;
        e.x += e.vx * dt;
        e.vx *= 0.92;
        if (e.type === 'boss' && Math.random() < 0.35) {
          spawnHitStar(e.x + (Math.random() - 0.5) * 32, e.y, e.z + 20 + Math.random() * 24, true);
        }
        if (e.stateTimer <= 0) {
          spawnParticles(e.x, e.y, 16, '#ff45b5', 14, 110);
          enemies.splice(i, 1);
        }
        continue;
      }

      if (e.state === 'hurt') {
        e.stateTimer -= dt;
        if (e.z === 0) {
          e.x += e.vx * dt;
          e.vx *= 0.85;
        }
        e.x = Math.max(camX + 14, Math.min(camX + W - 14, e.x));
        if (e.stateTimer <= 0 && e.z === 0) {
          e.state = 'chase';
        }
        continue;
      }

      if (e.state === 'windup') {
        e.stateTimer -= dt;
        e.facing = player.x >= e.x ? 1 : -1;
        if (e.stateTimer <= 0) {
          e.state = 'atk';
          e.stateTimer = e.type === 'boss' ? 0.34 : 0.24;
          e.hitApplied = false;
          // Lunge forward slightly!
          e.vx = e.facing * (e.type === 'gat' || e.type === 'boss' ? 130 : 55);
          sfx.playSwing(1);
        }
        continue;
      }

      if (e.state === 'atk') {
        e.stateTimer -= dt;
        e.x += e.vx * dt;
        e.vx *= 0.88;
        if (!e.hitApplied && e.stateTimer < (e.type === 'boss' ? 0.24 : 0.16)) {
          const dx = (player.x - e.x) * e.facing;
          const dy = Math.abs(player.y - e.y);
          if (dx >= -6 && dx <= e.reach + 8 && dy <= 18 && player.z < 26) {
            e.hitApplied = true;
            damagePlayer(e.dmg, e.facing);
          }
        }
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.atkCooldown = e.type === 'boss' ? (e.enraged ? 0.85 : 1.15) : (0.95 + Math.random() * 0.65);
        }
        continue;
      }

      if (e.state === 'slam') {
        e.stateTimer -= dt;
        if (!e.hitApplied && e.stateTimer <= 0.32) {
          e.hitApplied = true;
          sfx.playHit(true);
          triggerShake(0.28, 4.5);
          // Ground shockwave ring (player can jump over it!)
          shockwaves.push({
            x: e.x, y: e.y, r: 12, maxR: 155, color: '#ff2e93',
            life: 0.68, maxLife: 0.68, friendly: false, dmg: 15, hitPlayer: false,
          });
          spawnParticles(e.x, e.y, 4, '#ff45b5', 14, 120);
        }
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.slamCooldown = e.enraged ? 3.2 : 4.6;
          e.atkCooldown = 0.8;
        }
        continue;
      }

      // CHASE & POSITION AI
      const desiredX = player.x + e.flankSide * (e.reach - 4);
      const desiredY = Math.max(FLOOR_MIN_Y + 4, Math.min(FLOOR_MAX_Y - 4, player.y + e.flankYOff * 0.25));
      const dx = desiredX - e.x;
      const dy = desiredY - e.y;
      const distPlayerX = Math.abs(player.x - e.x);
      const distPlayerY = Math.abs(player.y - e.y);

      e.facing = player.x >= e.x ? 1 : -1;

      // Boss special Rift Shockwave check
      if (e.type === 'boss' && e.slamCooldown <= 0 && distPlayerX < 135 && distPlayerY < 48) {
        e.state = 'slam';
        e.stateTimer = 0.72;
        e.hitApplied = false;
        addFloatText('RIFT SLAM!', e.x, e.y - 68, '#ff45b5', 1);
        continue;
      }

      // Melee Attack check
      if (distPlayerX <= e.reach && distPlayerY <= 16 && e.atkCooldown <= 0 && activeAttackers < 2) {
        e.state = 'windup';
        e.stateTimer = e.type === 'boss' ? 0.36 : 0.34;
        activeAttackers++;
        continue;
      }

      // Move toward flanking slot
      const len = Math.hypot(dx, dy) || 1;
      if (len > 4) {
        e.x += (dx / len) * e.speed * dt;
        e.y += (dy / len) * e.speed * 0.72 * dt;
      }
      e.x = Math.max(camX + 16, Math.min(camX + W - 16, e.x));
      e.y = Math.max(FLOOR_MIN_Y, Math.min(FLOOR_MAX_Y, e.y));
    }
  }

  function updateWaves(dt) {
    const cfg = WAVE_CONFIG[waveIndex];
    if (!cfg) return;

    if (wavePhase === 'spawn') {
      waveTimer -= dt;
      if (waveTimer <= 0) {
        const group = cfg.subWaves[waveSubIndex];
        for (const sp of group) {
          spawnEnemy(sp.type, sp.x, sp.y);
        }
        if (waveSubIndex === 0) {
          bannerText = cfg.name;
          bannerSub = cfg.subtitle;
          bannerTimer = 1.9;
        }
        wavePhase = 'fight';
      }
    } else if (wavePhase === 'fight') {
      if (enemies.length === 0) {
        waveSubIndex++;
        if (waveSubIndex < cfg.subWaves.length) {
          wavePhase = 'spawn';
          waveTimer = 0.55;
        } else {
          // Entire Wave cleared!
          if (waveIndex < WAVE_CONFIG.length - 1) {
            // Drop guaranteed Ramyeon before Mini-Boss!
            if (waveIndex === 1) {
              items.push({ kind: 'ramyeon', x: camX + W * 0.65, y: 202, z: 24, vz: 100, life: 25 });
              addFloatText('RAMYEON DROP!', camX + W * 0.65, 160, '#ffe066', 1);
            }
            waveIndex++;
            waveSubIndex = 0;
            wavePhase = 'go';
            targetCamX = WAVE_CONFIG[waveIndex].lockX;
            sfx.playConfirm();
          } else {
            // MINI-BOSS DEFEATED -> VICTORY!
            wavePhase = 'done';
            score += 2000 + player.hp * 15;
            persistLocalHighScore();
            gameState = 'victory';
            sfx.stopBGM();
            sfx.playEncoreSpecial();
            recordKpopDemonHuntersScore(score);
          }
        }
      }
    } else if (wavePhase === 'go') {
      // Allow camera to advance smoothly as player walks right
      const desiredCam = Math.max(camX, Math.min(targetCamX, player.x - 160));
      camX += (desiredCam - camX) * Math.min(1, dt * 6);
      if (camX >= targetCamX - 6) {
        camX = targetCamX;
        if (waveIndex === 2) {
          wavePhase = 'warning';
          waveTimer = 1.9;
          bannerText = 'WARNING!!';
          bannerSub = 'MINI-BOSS: SAJA OVERLORD';
          bannerTimer = 2.0;
          sfx.playBossWarning();
          sfx.startBGM('boss');
        } else {
          wavePhase = 'spawn';
          waveTimer = 0.35;
        }
      }
    } else if (wavePhase === 'warning') {
      waveTimer -= dt;
      if (waveTimer <= 0) {
        wavePhase = 'spawn';
        waveTimer = 0.1;
      }
    }
  }

  function updateWorldObjects(dt) {
    // Pickups
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.life -= dt;
      if (it.z > 0 || it.vz > 0) {
        it.z += it.vz * dt;
        it.vz -= GRAVITY * dt;
        if (it.z <= 0) { it.z = 0; it.vz = 0; }
      }
      if (Math.abs(player.x - it.x) < 24 && Math.abs(player.y - it.y) < 18 && player.z < 20) {
        const heal = it.kind === 'ramyeon' ? 45 : 28;
        player.hp = Math.min(player.maxHp, player.hp + heal);
        score += 200;
        sfx.playPickup();
        addFloatText('+' + heal + ' HP!', it.x, it.y - 26, '#5eff8f', 1);
        spawnParticles(it.x, it.y, 12, '#ffe066', 10, 80);
        items.splice(i, 1);
        continue;
      }
      if (it.life <= 0) items.splice(i, 1);
    }

    // Shockwaves (both friendly Encore rings & boss floor shockwaves)
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.life -= dt;
      const t = 1 - sw.life / sw.maxLife;
      sw.r = sw.maxR * t;
      if (!sw.friendly && sw.dmg > 0 && !sw.hitPlayer && player) {
        const dx = player.x - sw.x;
        const dy = (player.y - sw.y) * 1.9;
        const dist = Math.hypot(dx, dy);
        if (Math.abs(dist - sw.r) < 14 && player.z < 16) {
          sw.hitPlayer = true;
          damagePlayer(sw.dmg, dx >= 0 ? 1 : -1);
        }
      }
      if (sw.life <= 0) shockwaves.splice(i, 1);
    }

    // Dimensional Rifts
    for (let i = rifts.length - 1; i >= 0; i--) {
      rifts[i].life -= dt;
      if (rifts[i].life <= 0) rifts.splice(i, 1);
    }

    // Encore Member Summons
    for (let i = encoreMembers.length - 1; i >= 0; i--) {
      encoreMembers[i].life -= dt;
      if (encoreMembers[i].life <= 0) encoreMembers.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.z = Math.max(0, pt.z + pt.vz * dt);
      if (pt.type === 'pixel') pt.vz -= 260 * dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    // Floating Texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.life -= dt;
      ft.y += ft.vy * dt;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  // =========================================================================
  // 11. RENDERING (ENTITIES, DEPTH SORTING, HUD, SCREENS)
  // =========================================================================
  function getHunterSprite(p) {
    const set = SPRITES.hunters[p.def.id];
    let pose = 'idle0';
    if (p.state === 'idle') pose = Math.floor(p.animTimer * 4) % 2 === 0 ? 'idle0' : 'idle1';
    else if (p.state === 'walk') pose = 'walk' + (Math.floor(p.animTimer * 10) % 4);
    else if (p.state === 'jump') pose = 'jump';
    else if (p.state === 'jumpkick') pose = 'jumpkick';
    else if (p.state === 'atk1' || p.state === 'atk2' || p.state === 'atk3') pose = p.state;
    else if (p.state === 'special') pose = 'special';
    else if (p.state === 'hurt') pose = 'hurt';
    return p.flash > 0 ? set[pose + '_flash'] : set[pose];
  }

  function getEnemySprite(e) {
    const set = SPRITES.enemies[e.type];
    let pose = 'idle';
    if (e.state === 'hurt' || e.state === 'ko') pose = 'hurt';
    else if (e.state === 'windup') pose = 'windup';
    else if (e.state === 'atk') pose = 'atk';
    else if (e.state === 'slam') pose = 'slam';
    else if (e.state === 'chase') pose = Math.floor(e.animTimer * 7) % 2 === 0 ? 'walk0' : 'walk1';
    return e.flash > 0 ? set[pose + '_flash'] : set[pose];
  }

  function drawWorld() {
    ctx.save();
    // Apply screen shake
    if (shakeTime > 0) {
      const sx = Math.round((Math.random() - 0.5) * 2 * shakeMag);
      const sy = Math.round((Math.random() - 0.5) * 2 * shakeMag);
      ctx.translate(sx, sy);
    }

    drawBackground(camX, time, encoreTimer > 0 ? Math.min(1, encoreTimer * 1.4) : 0);

    // Draw floor Rifts
    for (const rf of rifts) {
      const sx = Math.round(rf.x - camX);
      const sy = Math.round(rf.y);
      const prog = Math.sin((rf.life / rf.maxLife) * Math.PI);
      const rad = Math.max(2, Math.round(rf.radius * prog));
      ctx.fillStyle = '#24073b';
      ctx.fillRect(sx - rad, sy - Math.round(rad * 0.35), rad * 2, Math.round(rad * 0.7));
      ctx.strokeStyle = '#ff38a8';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx - rad, sy - Math.round(rad * 0.35), rad * 2, Math.round(rad * 0.7));
    }

    // Draw floor Shockwaves (elliptical 2.5D perspective rings!)
    for (const sw of shockwaves) {
      const sx = Math.round(sw.x - camX);
      const sy = Math.round(sw.y);
      ctx.save();
      ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.friendly ? 4 : 3;
      ctx.beginPath();
      ctx.ellipse(sx, sy, Math.max(1, sw.r), Math.max(1, sw.r * 0.44), 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Depth-sorted renderables (items, enemies, summoned idols, player)
    const drawList = [];
    for (const it of items) drawList.push({ y: it.y, kind: 'item', obj: it });
    for (const e of enemies) drawList.push({ y: e.y, kind: 'enemy', obj: e });
    for (const m of encoreMembers) drawList.push({ y: m.y, kind: 'encoreMember', obj: m });
    if (player) drawList.push({ y: player.y, kind: 'player', obj: player });
    drawList.sort((a, b) => a.y - b.y);

    for (const entry of drawList) {
      if (entry.kind === 'item') {
        const it = entry.obj;
        const sx = Math.round(it.x - camX);
        const sy = Math.round(it.y);
        const bob = Math.round(Math.sin(time * 7) * 2);
        // Shadow
        ctx.fillStyle = 'rgba(25, 8, 44, 0.45)';
        ctx.fillRect(sx - 10, sy - 2, 20, 4);
        const img = SPRITES.items[it.kind];
        drawSprite(img, sx, sy - it.z + bob, 1, 0.5, 1);
      } else if (entry.kind === 'encoreMember') {
        const m = entry.obj;
        const sx = Math.round(m.x - camX);
        const sy = Math.round(m.y);
        ctx.save();
        ctx.globalAlpha = Math.min(1, m.life * 2);
        // Neon floor spotlight ring
        ctx.fillStyle = 'rgba(94, 246, 255, 0.45)';
        ctx.fillRect(sx - 18, sy - 4, 36, 8);
        const img = SPRITES.hunters[m.def.id].special;
        drawSprite(img, sx, sy + 5, player.facing, 32 / 72, 50 / 56);
        ctx.restore();
      } else if (entry.kind === 'enemy') {
        const e = entry.obj;
        const sx = Math.round(e.x - camX);
        const sy = Math.round(e.y);
        const isBoss = e.type === 'boss';
        const sw = isBoss ? 24 : 14;
        // Ground shadow
        ctx.fillStyle = 'rgba(26, 8, 48, 0.45)';
        ctx.fillRect(sx - sw, sy - 3, sw * 2, 6);
        // Boss enraged magenta aura
        if (isBoss && e.enraged) {
          ctx.fillStyle = 'rgba(255, 46, 147, 0.32)';
          ctx.fillRect(sx - 24, sy - 64 - e.z, 48, 64);
        }
        // Blink on KO
        if (e.state === 'ko' && Math.floor(time * 24) % 2 === 0) continue;
        const img = getEnemySprite(e);
        drawSprite(img, sx, sy - e.z + 4, e.facing, 0.5, isBoss ? 69 / 76 : 50 / 56);

        // Telegraph "!" indicator during windup
        if (e.state === 'windup') {
          drawText('!', sx, sy - e.z - (isBoss ? 78 : 54), '#ffe066', 2, 'center', '#d91656');
        }
        // Small enemy HP bar when damaged (non-boss)
        if (!isBoss && e.hp < e.maxHp && e.hp > 0) {
          const bw = 26;
          ctx.fillStyle = '#19082c';
          ctx.fillRect(sx - bw / 2 - 1, sy - e.z - 50, bw + 2, 5);
          ctx.fillStyle = '#ff3b6b';
          ctx.fillRect(sx - bw / 2, sy - e.z - 49, Math.max(1, Math.round(bw * (e.hp / e.maxHp))), 3);
        }
      } else if (entry.kind === 'player') {
        const p = entry.obj;
        const sx = Math.round(p.x - camX);
        const sy = Math.round(p.y);
        // Shadow scales smaller when jumping high
        const shW = Math.max(8, Math.round(15 - p.z * 0.08));
        ctx.fillStyle = 'rgba(26, 8, 48, 0.48)';
        ctx.fillRect(sx - shW, sy - 3, shW * 2, 6);

        // Encore Ready subtle cyan aura under feet
        if (p.encore >= 100 && Math.floor(time * 8) % 2 === 0) {
          ctx.strokeStyle = '#5ef6ff';
          ctx.lineWidth = 1;
          ctx.strokeRect(sx - 16, sy - 4, 32, 8);
        }

        // Invulnerability blink
        if (p.invuln > 0 && p.state !== 'special' && Math.floor(time * 18) % 2 === 0) continue;

        const img = getHunterSprite(p);
        drawSprite(img, sx, sy - p.z + 4, p.facing, 32 / 72, 50 / 56);

        // Comic speech bubble during Encore Special!
        if (encoreTimer > 0.25) {
          const bx = Math.max(86, Math.min(W - 86, sx));
          const by = Math.max(54, sy - p.z - 66);
          const bw = encoreBubbleText.length * 6 + 14;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(bx - bw / 2, by - 12, bw, 16);
          ctx.strokeStyle = '#1b092e';
          ctx.lineWidth = 2;
          ctx.strokeRect(bx - bw / 2, by - 12, bw, 16);
          drawText(encoreBubbleText, bx, by - 7, '#a81c7e', 1, 'center', null);
        }
      }
    }

    // Particles (hit starbursts, music notes, sparks)
    for (const pt of particles) {
      const sx = Math.round(pt.x - camX);
      const sy = Math.round(pt.y - pt.z);
      if (pt.type === 'star') {
        const s = Math.round(pt.size * (pt.life / pt.maxLife + 0.35));
        ctx.fillStyle = pt.color2;
        ctx.fillRect(sx - s, sy - 2, s * 2, 4);
        ctx.fillRect(sx - 2, sy - s, 4, s * 2);
        ctx.fillStyle = pt.color;
        ctx.fillRect(sx - Math.round(s * 0.6), sy - Math.round(s * 0.6), Math.round(s * 1.2), Math.round(s * 1.2));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx - 2, sy - 2, 4, 4);
      } else if (pt.type === 'note') {
        ctx.fillStyle = pt.color;
        ctx.fillRect(sx, sy, 3, 2);
        ctx.fillRect(sx + 2, sy - 5, 1, 6);
        ctx.fillRect(sx + 2, sy - 5, 3, 2);
      } else {
        ctx.fillStyle = pt.color;
        ctx.fillRect(sx, sy, pt.size, pt.size);
      }
    }

    // Floating Damage / Score Popups
    for (const ft of floatingTexts) {
      drawText(ft.text, ft.x - camX, ft.y, ft.color, ft.scale, 'center');
    }

    drawForegroundParapet(camX);
    ctx.restore();
  }

  function drawHUD() {
    const p = player;

    // 1) Top-Left Angled Arcade Character Panel (Inspired by reference image!)
    ctx.fillStyle = '#200b3d';
    ctx.fillRect(6, 5, 198, 34);
    ctx.fillStyle = '#38166b';
    ctx.fillRect(8, 7, 194, 30);
    // Neon border
    ctx.fillStyle = '#5ef6ff';
    ctx.fillRect(6, 5, 198, 2);
    ctx.fillRect(6, 37, 190, 2);
    ctx.fillRect(6, 5, 2, 34);
    ctx.fillStyle = '#ff42b3';
    ctx.fillRect(202, 5, 2, 30);

    // Portrait frame
    ctx.fillStyle = '#140626';
    ctx.fillRect(10, 9, 26, 26);
    const port = SPRITES.portraits[p.def.id];
    if (port) ctx.drawImage(port, 12, 11, 22, 22);
    ctx.strokeStyle = p.def.accent;
    ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 9.5, 25, 25);

    // Name, Lives & Score
    drawText(p.def.name, 41, 9, '#ff85d0', 1, 'left');
    drawText('X' + p.lives, 74, 9, '#ffe066', 1, 'left');
    drawText(String(score).padStart(7, '0'), 198, 9, '#ffffff', 1, 'right');

    // Health Bar (Yellow -> Orange -> Red)
    const hpPct = Math.max(0, p.hp / p.maxHp);
    ctx.fillStyle = '#120521';
    ctx.fillRect(40, 19, 158, 8);
    ctx.fillStyle = '#4a1438';
    ctx.fillRect(41, 20, 156, 6);
    const fillW = Math.round(156 * hpPct);
    ctx.fillStyle = hpPct > 0.5 ? '#ffd43b' : hpPct > 0.25 ? '#ff8833' : '#ff3355';
    ctx.fillRect(41, 20, fillW, 6);
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(41, 20, fillW, 2);

    // Segmented ENCORE Special Meter
    drawText('ENCORE', 41, 29, p.encore >= 100 ? '#ffe066' : '#5ef6ff', 1, 'left');
    const barX = 82;
    const barW = 116;
    ctx.fillStyle = '#120521';
    ctx.fillRect(barX, 29, barW, 7);
    const segs = 10;
    const segW = 10;
    const filledSegs = Math.floor((p.encore / 100) * segs);
    const readyPulse = p.encore >= 100 && Math.floor(time * 10) % 2 === 0;
    for (let s = 0; s < segs; s++) {
      const sx = barX + 2 + s * (segW + 1);
      if (s < filledSegs) {
        ctx.fillStyle = readyPulse ? '#ffe066' : (p.encore >= 100 ? '#ff42b3' : '#3ff5ff');
      } else {
        ctx.fillStyle = '#29154a';
      }
      ctx.fillRect(sx, 30, segW, 5);
    }
    if (p.encore >= 100) {
      drawText('PRESS [L/C] ENCORE!', 104, 42, readyPulse ? '#ffe066' : '#5ef6ff', 1, 'center');
    }

    // 2) Top-Center Wave Indicator
    const waveLabel = waveIndex === 2 ? 'MINI-BOSS' : `WAVE ${waveIndex + 1}/2`;
    ctx.fillStyle = '#200b3d';
    ctx.fillRect(216, 5, 114, 22);
    ctx.fillStyle = '#ff42b3';
    ctx.fillRect(216, 5, 114, 2);
    drawText(waveLabel, 273, 10, '#ffe066', 1, 'center');
    const rem = enemies.filter(e => e.state !== 'ko').length;
    drawText('DEMONS:' + rem, 273, 19, '#d8c2ff', 1, 'center');

    // 3) Top-Right Dynamic COMBO METER
    if (comboCount > 0) {
      const bounce = comboTimer > 2.45 ? -2 : 0;
      ctx.fillStyle = '#240b42';
      ctx.fillRect(352, 6 + bounce, 122, 32);
      ctx.fillStyle = '#ff42b3';
      ctx.fillRect(352, 6 + bounce, 122, 2);
      ctx.fillStyle = '#5ef6ff';
      ctx.fillRect(352, 36 + bounce, 122, 2);

      const rank = comboCount >= 18 ? 'IDOL GOD!' : comboCount >= 12 ? 'ENCORE!!' : comboCount >= 7 ? 'SLAY!!' : comboCount >= 4 ? 'GROOVE!' : 'HYPE!';
      drawText(comboCount + ' HIT!', 413, 11 + bounce, '#ffe066', 2, 'center', '#6e1152');
      drawText(rank, 413, 27 + bounce, '#5ef6ff', 1, 'center');

      // Combo decay bar
      const pct = Math.max(0, comboTimer / 2.6);
      ctx.fillStyle = '#ff42b3';
      ctx.fillRect(356, 34 + bounce, Math.round(114 * pct), 2);
    } else {
      drawText('HI ' + String(highScore).padStart(7, '0'), 472, 10, '#bfa2db', 1, 'right');
    }

    // 4) Mini-Boss Health Bar (Bottom Center)
    const boss = enemies.find(e => e.type === 'boss' && e.state !== 'ko');
    if (boss) {
      const bx = 90, by = 248, bw = 300;
      ctx.fillStyle = '#18062b';
      ctx.fillRect(bx - 2, by - 11, bw + 4, 20);
      ctx.fillStyle = '#ff2e93';
      ctx.fillRect(bx - 2, by - 11, bw + 4, 2);
      drawText('MINI-BOSS: ' + boss.name, bx + 4, by - 8, '#ff85d0', 1, 'left');
      ctx.fillStyle = '#381036';
      ctx.fillRect(bx, by + 1, bw, 6);
      const bFill = Math.round(bw * Math.max(0, boss.hp / boss.maxHp));
      ctx.fillStyle = boss.enraged ? '#ff2468' : '#b833ff';
      ctx.fillRect(bx, by + 1, bFill, 6);
      ctx.fillStyle = '#ffb8e6';
      ctx.fillRect(bx, by + 1, bFill, 2);
    }

    // 5) Classic Arcade Blinking "GO ->" Prompt Between Waves
    if (wavePhase === 'go' && Math.floor(time * 5) % 2 === 0) {
      ctx.fillStyle = '#240942';
      ctx.fillRect(398, 72, 68, 28);
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(398, 72, 68, 2);
      ctx.fillRect(398, 98, 68, 2);
      drawText('GO >>', 432, 80, '#ffe066', 2, 'center', '#d91656');
    }

    // 6) Stage / Wave / Warning Center Banner
    if (bannerTimer > 0) {
      const isWarn = bannerText.includes('WARNING');
      ctx.fillStyle = isWarn ? 'rgba(140, 12, 54, 0.85)' : 'rgba(26, 8, 52, 0.84)';
      ctx.fillRect(0, 96, W, 42);
      ctx.fillStyle = isWarn ? '#ffe066' : '#5ef6ff';
      ctx.fillRect(0, 96, W, 2);
      ctx.fillRect(0, 136, W, 2);
      drawText(bannerText, W / 2, 103, isWarn ? '#ffe066' : '#ff69c0', 2, 'center');
      drawText(bannerSub, W / 2, 122, '#ffffff', 1, 'center');
    }
  }

  function drawTitleScreen() {
    drawBackground(180 + Math.sin(time * 0.4) * 40, time, 0.25);

    // Title Banner
    drawText('HUNTRIX', W / 2, 18, '#ff45b5', 4, 'center', '#1b0736');
    drawText('HUNTRIX', W / 2, 16, '#ffe066', 4, 'center', null);
    drawText('K-POP DEMON HUNTERS  16-BIT', W / 2, 50, '#5ef6ff', 1, 'center');

    // Character Select Cards
    drawText('SELECT YOUR HUNTER  [A/D OR ARROWS]', W / 2, 68, '#ffffff', 1, 'center');

    HUNTERS.forEach((h, idx) => {
      const sel = idx === selectedHunterIdx;
      const cx = 96 + idx * 144;
      const cy = 84;
      const cw = 124;
      const ch = 122;

      ctx.fillStyle = sel ? 'rgba(64, 22, 117, 0.92)' : 'rgba(24, 10, 48, 0.82)';
      ctx.fillRect(cx - cw / 2, cy, cw, ch);
      ctx.strokeStyle = sel ? (Math.floor(time * 8) % 2 === 0 ? '#ffe066' : '#5ef6ff') : '#5d3a96';
      ctx.lineWidth = sel ? 2 : 1;
      ctx.strokeRect(cx - cw / 2, cy, cw, ch);

      // Animated sprite preview!
      const pose = sel ? (Math.floor(time * 6) % 2 === 0 ? 'atk2' : 'walk0') : 'idle0';
      const img = SPRITES.hunters[h.id][pose];
      drawSprite(img, cx, cy + 68, 1, 32 / 72, 50 / 56);

      drawText(h.name, cx, cy + 74, sel ? '#ffe066' : '#ffffff', 2, 'center');
      drawText(h.title, cx, cy + 92, h.accent, 1, 'center');

      // Mini stat bars
      const drawStat = (lbl, val, sy, col) => {
        drawText(lbl, cx - 54, sy, '#c9b5ea', 1, 'left');
        ctx.fillStyle = '#140626';
        ctx.fillRect(cx - 26, sy + 1, 76, 4);
        ctx.fillStyle = col;
        ctx.fillRect(cx - 26, sy + 1, Math.round(76 * val), 4);
      };
      drawStat('PWR', h.power / 1.2, cy + 102, '#ff59b8');
      drawStat('SPD', h.speed / 145, cy + 111, '#5ef6ff');
    });

    // Blinking Press Start Prompt
    const blink = Math.floor(time * 3) % 2 === 0;
    ctx.fillStyle = 'rgba(22, 7, 44, 0.9)';
    ctx.fillRect(54, 218, 372, 38);
    ctx.fillStyle = '#5ef6ff';
    ctx.fillRect(54, 218, 372, 2);
    drawText(blink ? 'PRESS [ENTER] OR [J] TO START' : '>>> SHOWTIME! <<<', W / 2, 226, '#ffe066', 1, 'center');
    drawText('2 WAVES + MINI-BOSS | 3-HIT COMBO | ENCORE SPECIAL', W / 2, 241, '#d8c2ff', 1, 'center');
  }

  function drawOverlayScreen(isVictory) {
    ctx.fillStyle = 'rgba(14, 5, 30, 0.8)';
    ctx.fillRect(0, 0, W, H);

    const boxX = 76, boxY = 38, boxW = 328, boxH = 194;
    ctx.fillStyle = '#230b42';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = isVictory ? '#ffe066' : '#ff3b6b';
    ctx.lineWidth = 2;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    if (isVictory) {
      drawText('STAGE CLEAR!!', W / 2, 52, '#ffe066', 3, 'center', '#991b6b');
      drawText('SEOUL IS SAFE — ENCORE COMPLETE!', W / 2, 82, '#5ef6ff', 1, 'center');

      // Show all 3 HUNTRIX idols celebrating!
      ['mira', 'rumi', 'zoey'].forEach((id, idx) => {
        const pose = Math.floor(time * 5 + idx) % 2 === 0 ? 'special' : 'idle0';
        drawSprite(SPRITES.hunters[id][pose], 168 + idx * 72, 144, 1, 32 / 72, 50 / 56);
      });

      const rank = score >= 9500 ? 'S' : score >= 6500 ? 'A' : score >= 4000 ? 'B' : 'C';
      drawText('SCORE: ' + score, 110, 158, '#ffffff', 1, 'left');
      drawText('MAX COMBO: ' + maxCombo, 110, 170, '#ff85d0', 1, 'left');
      drawText('DEMONS SLAIN: ' + enemiesDefeated, 110, 182, '#5ef6ff', 1, 'left');
      drawText('RANK', 330, 155, '#c9b5ea', 1, 'center');
      drawText(rank, 330, 168, '#ffe066', 3, 'center', '#b82575');
    } else {
      drawText('GAME OVER', W / 2, 68, '#ff3b6b', 3, 'center', '#140524');
      drawText('THE DEMONS CRASHED THE STAGE...', W / 2, 108, '#d8c2ff', 1, 'center');
      drawText('FINAL SCORE: ' + score, W / 2, 134, '#ffe066', 2, 'center');
      drawText('MAX COMBO: ' + maxCombo + '   DEMONS SLAIN: ' + enemiesDefeated, W / 2, 162, '#5ef6ff', 1, 'center');
    }

    if (scoreSyncStatus) {
      drawText(scoreSyncStatus, W / 2, 193, '#5ef6ff', 1, 'center');
    }

    const blink = Math.floor(time * 3) % 2 === 0;
    drawText(blink ? 'PRESS [ENTER] OR [J] TO PLAY AGAIN' : 'PRESS [K] FOR CHARACTER SELECT', W / 2, 209, '#ffe066', 1, 'center');
  }

  function drawPauseOverlay() {
    ctx.fillStyle = 'rgba(14, 5, 30, 0.65)';
    ctx.fillRect(0, 0, W, H);
    drawText('PAUSED', W / 2, 114, '#ffe066', 3, 'center');
    drawText('PRESS [P] OR [ESC] TO RESUME', W / 2, 148, '#5ef6ff', 1, 'center');
  }

  // =========================================================================
  // 12. MAIN GAME LOOP
  // =========================================================================
  let lastTs = 0;

  function step(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    time += dt;

    if (gameState === 'title') {
      if (justPressed.left) {
        selectedHunterIdx = (selectedHunterIdx + HUNTERS.length - 1) % HUNTERS.length;
        sfx.playSelect();
      }
      if (justPressed.right) {
        selectedHunterIdx = (selectedHunterIdx + 1) % HUNTERS.length;
        sfx.playSelect();
      }
      if (justPressed.confirm || justPressed.attack || justPressed.jump) {
        sfx.playConfirm();
        startNewGame();
      }
      drawTitleScreen();
    } else if (gameState === 'playing') {
      if (justPressed.pause) {
        gameState = 'paused';
      } else {
        if (bannerTimer > 0) bannerTimer -= dt;
        if (shakeTime > 0) shakeTime -= dt;
        if (encoreTimer > 0) encoreTimer -= dt;
        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0) comboCount = 0;
        }

        if (hitstop > 0) {
          hitstop -= dt;
        } else {
          updatePlayer(dt);
          updateEnemies(dt);
          updateWaves(dt);
          updateWorldObjects(dt);
        }
      }
      drawWorld();
      drawHUD();
    } else if (gameState === 'paused') {
      if (justPressed.pause) gameState = 'playing';
      drawWorld();
      drawHUD();
      drawPauseOverlay();
    } else if (gameState === 'victory' || gameState === 'gameover') {
      if (justPressed.confirm || justPressed.attack) {
        sfx.playConfirm();
        startNewGame();
      } else if (justPressed.jump) {
        sfx.playSelect();
        gameState = 'title';
      }
      drawWorld();
      drawHUD();
      drawOverlayScreen(gameState === 'victory');
    }

    clearJustPressed();
    requestAnimationFrame(step);
  }

  // Allow clicking directly on canvas in title screen to select hunter or start
  canvas.addEventListener('click', (e) => {
    sfx.init();
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;
    if (gameState === 'title') {
      if (my >= 80 && my <= 208) {
        const idx = Math.floor((mx - 24) / 144);
        if (idx >= 0 && idx < HUNTERS.length) {
          if (selectedHunterIdx === idx) {
            sfx.playConfirm();
            startNewGame();
          } else {
            selectedHunterIdx = idx;
            sfx.playSelect();
          }
        }
      } else if (my > 210) {
        sfx.playConfirm();
        startNewGame();
      }
    } else if (gameState === 'victory' || gameState === 'gameover') {
      sfx.playConfirm();
      startNewGame();
    }
  });

  // Boot!
  initSprites();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
