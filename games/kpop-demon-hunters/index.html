  function getCurrentStage() {
    return STAGES[stageIndex] || STAGES[0];
  }

  function createPlayer(hunterDef) {
    return {
      def: hunterDef,
      x: 110,
      y: 202,
      z: 0,
      vx: 0,
      vy: 0,
      vz: 0,
      facing: 1,
      hp: hunterDef.hp,
      maxHp: hunterDef.hp,
      lives: 3,
      encore: 20, // Start with 20% hype!
      encoreReadyNotified: false,
      state: 'idle', // 'idle','walk','jump','jumpkick','atk1','atk2','atk3','special','hurt'
      stateTimer: 0,
      animTimer: 0,
      comboStep: 0,
      comboQueued: false,
      comboWindow: 0,
      hitIds: new Set(),
      invuln: 0,
      flash: 0,
    };
  }

  function spawnEnemy(type, x, y, skyDrop = false) {
    const isBoss = isBossType(type);
    if (!skyDrop) {
      rifts.push({ x, y, life: 0.7, maxLife: 0.7, radius: isBoss ? 30 : 18 });
    }
    const stats = {
      imp:           { name: 'DOKKAEBI IMP',   hp: 46,  speed: 62,  dmg: 9,  reach: 30, score: 250,  encoreGain: 22, ranged: false, armor: false },
      banshee:       { name: 'ABYSS BANSHEE',  hp: 38,  speed: 82,  dmg: 10, reach: 28, score: 300,  encoreGain: 22, ranged: false, armor: false },
      gat:           { name: 'SAJA TRICKSTER', hp: 64,  speed: 74,  dmg: 13, reach: 34, score: 450,  encoreGain: 25, ranged: false, armor: false },
      crooner:       { name: 'PHANTOM CROONER',hp: 52,  speed: 68,  dmg: 11, reach: 30, score: 400,  encoreGain: 24, ranged: true,  armor: false },
      heavy:         { name: 'IRON DOKKAEBI',  hp: 108, speed: 52,  dmg: 16, reach: 38, score: 650,  encoreGain: 28, ranged: false, armor: true  },
      boss:          { name: 'SAJA OVERLORD',  hp: 320, speed: 68,  dmg: 18, reach: 44, score: 3000, encoreGain: 35, ranged: false, armor: false, hasSlam: true },
      boss_vanguard: { name: 'SAJA VANGUARD',  hp: 215, speed: 84,  dmg: 16, reach: 42, score: 2200, encoreGain: 30, ranged: false, armor: false, hasSlam: true },
      boss_diva:     { name: 'BANSHEE DIVA',   hp: 195, speed: 74,  dmg: 14, reach: 36, score: 2200, encoreGain: 30, ranged: true,  armor: false, hasSlam: false },
      boss_reaper:   { name: 'TRAIN REAPER',   hp: 360, speed: 82,  dmg: 18, reach: 46, score: 3800, encoreGain: 38, ranged: false, armor: true,  hasSlam: true },
      boss_king:     { name: 'GWI-MA KING',    hp: 450, speed: 76,  dmg: 20, reach: 48, score: 5000, encoreGain: 45, ranged: true,  armor: true,  hasSlam: true },
    }[type] || { name: 'DOKKAEBI IMP', hp: 46, speed: 62, dmg: 9, reach: 30, score: 250, encoreGain: 22, ranged: false, armor: false };

    enemies.push({
      id: Math.random(),
      type,
      name: stats.name,
      isBoss,
      ranged: !!stats.ranged,
      armor: !!stats.armor,
      hasSlam: !!stats.hasSlam,
      x, y, z: skyDrop ? 160 : 0,
      vx: 0, vy: 0, vz: 0,
      facing: x > (player ? player.x : 120) ? -1 : 1,
      hp: stats.hp,
      maxHp: stats.hp,
      speed: stats.speed,
      dmg: stats.dmg,
      reach: stats.reach,
      score: stats.score,
      encoreGain: stats.encoreGain,
      state: 'spawn', // 'spawn','chase','windup','atk','slam','hurt','ko'
      stateTimer: skyDrop ? 0.55 : 0.45,
      animTimer: 0,
      atkCooldown: 0.5 + Math.random() * 0.6,
      hitApplied: false,
      flash: 0,
      enraged: false,
      slamCooldown: 3.8,
      hazardCooldown: 0,
      flankSide: Math.random() < 0.5 ? -1 : 1,
      flankYOff: (Math.random() - 0.5) * 18,
    });
  }

  function spawnParticles(x, y, z, color, count = 8, speed = 90) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = speed * (0.4 + Math.random() * 0.8);
      particles.push({
        x, y, z,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.35,
        vz: 40 + Math.random() * 90,
        size: Math.random() < 0.4 ? 3 : 2,
        color,
        life: 0.28 + Math.random() * 0.24,
        maxLife: 0.52,
        type: 'pixel',
      });
    }
  }

  function spawnHitStar(x, y, z, heavy = false) {
    particles.push({
      x, y, z,
      vx: 0, vy: 0, vz: 0,
      size: heavy ? 16 : 10,
      color: heavy ? '#ffe066' : '#5ef6ff',
      color2: heavy ? '#ff3b9a' : '#ffffff',
      life: heavy ? 0.2 : 0.14,
      maxLife: heavy ? 0.2 : 0.14,
      type: 'star',
    });
  }

  function spawnNote(x, y, z, color) {
    particles.push({
      x, y, z,
      vx: (Math.random() - 0.5) * 45,
      vy: 0,
      vz: 45 + Math.random() * 45,
      size: 4,
      color,
      life: 0.9,
      maxLife: 0.9,
      type: 'note',
    });
  }

  function addFloatText(text, x, y, color = '#ffe066', scale = 1) {
    floatingTexts.push({ text, x, y, vy: -28, color, scale, life: 0.75, maxLife: 0.75 });
  }

  function addCombo(hits = 1) {
    comboCount += hits;
    if (comboCount > maxCombo) maxCombo = comboCount;
    if (comboCount > stageStats.stageMaxCombo) stageStats.stageMaxCombo = comboCount;
    comboTimer = 2.6;
  }

  function addEncore(amount) {
    const wasReady = player.encore >= 100;
    player.encore = Math.min(100, player.encore + amount);
    if (!wasReady && player.encore >= 100) {
      sfx.playEncoreReady();
      addFloatText('ENCORE READY!', player.x, player.y - player.z - 52, '#5ef6ff', 1);
    }
  }

  function triggerShake(dur = 0.14, mag = 3) {
    shakeTime = Math.max(shakeTime, dur);
    shakeMag = Math.max(shakeMag, mag);
  }

  function loadStage(idx, resetPlayerFull = false) {
    stageIndex = Math.max(0, Math.min(STAGES.length - 1, idx));
    const st = getCurrentStage();
    currentWorldWidth = st.worldWidth;

    if (resetPlayerFull || !player) {
      player = createPlayer(HUNTERS[selectedHunterIdx]);
    } else {
      // Carry over player between stages with +50% HP recovery!
      player.x = 110;
      player.y = 202;
      player.z = 0;
      player.vx = 0;
      player.vy = 0;
      player.vz = 0;
      player.facing = 1;
      player.state = 'idle';
      player.stateTimer = 0;
      player.invuln = 1.0;
      player.hp = Math.min(player.maxHp, Math.round(player.hp + player.maxHp * 0.5));
    }

    enemies = [];
    items = [];
    projectiles = [];
    laneDrones = [];
    laneDroneTimer = 3.2;
    particles = [];
    shockwaves = [];
    rifts = [];
    floatingTexts = [];
    encoreMembers = [];

    // Clone interactive stage props & two-way hazards
    props = (st.props || []).map((p, i) => ({
      id: 'prop_' + stageIndex + '_' + i,
      kind: p.kind,
      x: p.x,
      y: p.y,
      hp: p.hp,
      maxHp: p.hp,
      drop: p.drop || null,
      flash: 0,
    }));

    hazards = (st.hazards || []).map((h, i) => ({
      id: 'haz_' + stageIndex + '_' + i,
      kind: h.kind,
      x: h.x,
      y: h.y,
      timer: h.phase || 0,
      state: 'idle', // steam: idle/telegraph/active; plank: idle/armed/snap/cooldown
      cooldown: 0,
    }));

    stageStats = {
      hazardHits: 0,
      propsSmashed: 0,
      stageMaxCombo: 0,
      clearBonus: 0,
      hpBonus: 0,
      challenges: [],
    };

    camX = 0;
    targetCamX = 0;
    hitstop = 0;
    shakeTime = 0;
    comboCount = 0;
    comboTimer = 0;

    waveIndex = 0;
    waveSubIndex = 0;
    wavePhase = 'spawn';
    waveTimer = 0.5;
    encoreTimer = 0;

    bannerText = st.name;
    bannerSub = st.subtitle;
    bannerTimer = 2.2;

    gameState = 'playing';
    sfx.startBGM(st.bgm || 'stage0');
  }

  function startNewGame() {
    sfx.init();
    score = 0;
    scoreSubmittedThisRun = false;
    scoreSyncStatus = '';
    maxCombo = 0;
    enemiesDefeated = 0;
    loadStage(selectedStageIdx, true);
  }

  // =========================================================================
  // 8. ENCORE SPECIAL (SCREEN-CLEARING HUNTRIX CONCERT ATTACK)
  // =========================================================================
  function triggerEncoreSpecial() {
    player.encore = 0;
    player.state = 'special';
    player.stateTimer = 1.45;
    player.invuln = 2.0;
    player.vx = 0;
    player.vy = 0;
    encoreTimer = 1.55;
    const lines = [
      "HOW IT'S DONE! DONE! DONE!",
      "HUNTRIX DON'T MISS!",
      "ENCORE FINALE!!",
    ];
    encoreBubbleText = lines[Math.floor(Math.random() * lines.length)];

    sfx.playEncoreSpecial();
    triggerShake(0.6, 5);
    hitstop = 0.06;

    // Summon the full HUNTRIX trio in V-formation around the player!
    encoreMembers = [];
    const others = HUNTERS.filter(h => h.id !== player.def.id);
    encoreMembers.push({ def: others[0], x: Math.max(camX + 36, player.x - 54), y: Math.max(FLOOR_MIN_Y + 8, player.y - 18), life: 1.45 });
    encoreMembers.push({ def: others[1], x: Math.min(camX + W - 36, player.x + 54), y: Math.min(FLOOR_MAX_Y - 8, player.y + 16), life: 1.45 });

    // Expanding Honmoon concert shockwaves!
    shockwaves.push({ x: player.x, y: player.y, r: 8, maxR: 340, color: '#5ef6ff', life: 0.75, maxLife: 0.75, friendly: true, hitWave: 1 });
    shockwaves.push({ x: player.x, y: player.y, r: 2, maxR: 340, color: '#ff42b3', life: 1.05, maxLife: 1.05, friendly: true, hitWave: 2 });
    shockwaves.push({ x: player.x, y: player.y, r: 0, maxR: 360, color: '#ffe066', life: 1.35, maxLife: 1.35, friendly: true, hitWave: 3 });

    // Music notes & sparkles across stage
    for (let i = 0; i < 24; i++) {
      spawnNote(camX + 20 + Math.random() * (W - 40), FLOOR_MIN_Y + Math.random() * 90, 10 + Math.random() * 40, i % 3 === 0 ? '#5ef6ff' : i % 3 === 1 ? '#ff42b3' : '#ffe066');
    }

    // Immediate & staggered screen-wide damage pulses!
    applyEncorePulse(46, false);
    setTimeout(() => { if (gameState === 'playing') applyEncorePulse(42, false); }, 340);
    setTimeout(() => { if (gameState === 'playing') applyEncorePulse(52, true); }, 700);
  }

  function applyEncorePulse(dmg, launch) {
    if (!player) return;
    triggerShake(0.2, 4);
    for (const e of enemies) {
      if (e.state === 'ko') continue;
      if (e.x < camX - 30 || e.x > camX + W + 30) continue;
      damageEnemy(e, dmg, launch ? 160 : 50, launch ? 165 : 60, player.x < e.x ? 1 : -1, true, false);
    }
  }

  // =========================================================================
  // 9. COMBAT RESOLUTION
  // =========================================================================
  function damageProp(pr, dmg) {
    pr.hp -= dmg;
    pr.flash = 0.14;
    sfx.playHit(false);
    spawnParticles(pr.x, pr.y, 12, '#ffe066', 6, 75);
    if (pr.hp <= 0) {
      stageStats.propsSmashed++;
      score += 150;
      persistLocalHighScore();
      const idx = props.indexOf(pr);
      if (idx !== -1) props.splice(idx, 1);

      if (pr.kind === 'hydrant') {
        // Explosive two-way Neon Hydrant AOE blast!
        sfx.playExplosion();
        triggerShake(0.35, 5);
        addFloatText('BOOM!!', pr.x, pr.y - 34, '#ffe066', 2);
        shockwaves.push({ x: pr.x, y: pr.y, r: 8, maxR: 115, color: '#5ef6ff', life: 0.45, maxLife: 0.45, friendly: true });
        spawnParticles(pr.x, pr.y, 16, '#5ef6ff', 18, 145);
        spawnParticles(pr.x, pr.y, 16, '#ff45b5', 14, 130);
        for (const e of enemies) {
          if (e.state === 'ko' || e.state === 'spawn') continue;
          const dist = Math.hypot(e.x - pr.x, (e.y - pr.y) * 1.6);
          if (dist <= 115) {
            damageEnemy(e, 42, 165, 160, e.x >= pr.x ? 1 : -1, true, true);
          }
        }
      } else {
        sfx.playPickup();
        spawnParticles(pr.x, pr.y, 14, '#ff69c0', 12, 100);
        if (pr.drop) {
          items.push({ kind: pr.drop, x: pr.x, y: pr.y, z: 16, vz: 130, life: 22 });
          const label = pr.drop === 'ramyeon' ? 'RAMYEON!' : pr.drop === 'star' ? 'ENCORE STAR!' : 'GIMBAP!';
          addFloatText(label, pr.x, pr.y - 32, '#ffe066', 1);
        }
      }
    }
  }

  function damageEnemy(e, dmg, kbX, kbZ, dir, heavy = false, grantEncore = true) {
    e.hp -= dmg;
    e.flash = 0.14;
    addCombo(1);
    const mult = 1 + Math.min(3, Math.floor(comboCount / 5) * 0.25);
    score += Math.round(dmg * 3 * mult);
    if (grantEncore) addEncore(heavy ? 3 : 1.5);

    spawnHitStar(e.x, e.y, e.z + 24, heavy);
    spawnParticles(e.x, e.y, e.z + 22, heavy ? '#ff45b5' : '#5ef6ff', heavy ? 12 : 6, heavy ? 125 : 85);
    addFloatText('-' + Math.round(dmg), e.x + (Math.random() - 0.5) * 10, e.y - e.z - 42, heavy ? '#ffe066' : '#ffffff', 1);

    if (e.hp <= 0) {
      e.hp = 0;
      e.state = 'ko';
      e.stateTimer = 0.65;
      e.vx = dir * Math.max(130, kbX);
      e.vz = Math.max(145, kbZ);
      enemiesDefeated++;
      score += Math.round(e.score * mult);
      persistLocalHighScore();
      if (grantEncore) addEncore(e.encoreGain);
      sfx.playKo();
      hitstop = e.isBoss ? 0.16 : 0.06;
      triggerShake(e.isBoss ? 0.55 : 0.18, e.isBoss ? 6 : 3);
      addFloatText('+' + Math.round(e.score * mult), e.x, e.y - 52, '#5ef6ff', 1);

      // Chance to drop Gimbap, Ramyeon, or Encore Star
      if (!e.isBoss && Math.random() < 0.24) {
        const roll = Math.random();
        items.push({
          kind: roll < 0.55 ? 'gimbap' : roll < 0.8 ? 'ramyeon' : 'star',
          x: e.x, y: e.y, z: 18, vz: 110, life: 16,
        });
      }
    } else {
      // Heavy & Boss enemies resist light hitstun during windup/slam; heavy finishers always stagger!
      const resistStun = (e.isBoss && e.state === 'slam' && !heavy) || (e.armor && !heavy && (e.state === 'windup' || e.state === 'atk'));
      if (!resistStun) {
        e.state = 'hurt';
        e.stateTimer = heavy ? 0.42 : 0.24;
        e.vx = dir * (e.isBoss ? kbX * 0.42 : e.armor ? kbX * 0.6 : kbX);
        if (kbZ > 0 && !e.isBoss) e.vz = e.armor ? kbZ * 0.65 : kbZ;
      }
      sfx.playHit(heavy);
      hitstop = heavy ? 0.055 : 0.025;
      triggerShake(heavy ? 0.15 : 0.08, heavy ? 3 : 1.5);

      // Boss Phase 2 Enrage at <= 50% HP
      if (e.isBoss && !e.enraged && e.hp <= e.maxHp * 0.5) {
        e.enraged = true;
        e.speed *= 1.18;
        addFloatText(e.type === 'boss_king' ? 'CRIMSON ECLIPSE!!' : 'ENRAGED!!', e.x, e.y - 68, '#ff3b8d', 1);
        shockwaves.push({ x: e.x, y: e.y, r: 10, maxR: 135, color: '#ff2e93', life: 0.45, maxLife: 0.45, friendly: false, dmg: 0 });
        if (e.type === 'boss' || e.type === 'boss_king') {
          spawnEnemy('imp', Math.max(camX + 45, e.x - 120), 174);
          spawnEnemy('imp', Math.min(camX + W - 45, e.x + 90), 232);
        }
      }
    }
  }

  function damagePlayer(dmg, dir, fromHazard = false) {
    if (player.invuln > 0 || player.state === 'special') return;
    if (fromHazard) stageStats.hazardHits++;
    player.hp = Math.max(0, player.hp - dmg);
    player.flash = 0.2;
    player.invuln = 0.85;
    player.state = 'hurt';
    player.stateTimer = 0.3;
    player.vx = dir * 110;
    comboCount = 0;
    comboTimer = 0;
    sfx.playHurt();
    triggerShake(0.2, 4);
    spawnHitStar(player.x, player.y, player.z + 24, true);
    addFloatText('-' + dmg, player.x, player.y - player.z - 46, '#ff4d6d', 1);

    if (player.hp <= 0) {
      player.lives--;
      if (player.lives > 0) {
        player.hp = player.maxHp;
        player.invuln = 2.0;
        player.vz = 150;
        addFloatText('SECOND WIND!', player.x, player.y - 54, '#5ef6ff', 1);
        sfx.playPickup();
      } else {
        gameState = 'gameover';
        sfx.stopBGM();
        recordKpopDemonHuntersScore(score);
      }
    }
  }

  // =========================================================================
  // 10. UPDATE LOOP
  // =========================================================================
  function updatePlayer(dt) {
    const p = player;
    const def = p.def;
    p.animTimer += dt;
    if (p.invuln > 0) p.invuln -= dt;
    if (p.flash > 0) p.flash -= dt;
    if (p.comboWindow > 0) {
      p.comboWindow -= dt;
      if (p.comboWindow <= 0) p.comboStep = 0;
    }

    // Encore Special trigger (highest priority when ready & not already in special)
    if (justPressed.special && p.encore >= 100 && p.state !== 'special' && p.state !== 'hurt') {
      triggerEncoreSpecial();
      return;
    }

    // Handle active states
    if (p.state === 'special') {
      p.stateTimer -= dt;
      if (p.stateTimer <= 0) {
        p.state = 'idle';
      }
      return;
    }

    if (p.state === 'hurt') {
      p.stateTimer -= dt;
      p.x += p.vx * dt;
      p.vx *= 0.86;
      if (p.z > 0 || p.vz !== 0) {
        p.z += p.vz * dt;
        p.vz -= GRAVITY * dt;
        if (p.z <= 0) { p.z = 0; p.vz = 0; }
      }
      if (p.stateTimer <= 0) p.state = 'idle';
      clampPlayerBounds();
      return;
    }

    // Melee 3-hit Combo Attack execution
    if (p.state === 'atk1' || p.state === 'atk2' || p.state === 'atk3') {
      p.stateTimer -= dt;
      if (justPressed.attack && p.state !== 'atk3') {
        p.comboQueued = true;
      }

      const step = p.state === 'atk1' ? 1 : p.state === 'atk2' ? 2 : 3;
      const dur = (step === 1 ? 0.19 : step === 2 ? 0.22 : 0.34) / def.atkSpeed;
      const elapsed = dur - p.stateTimer;
      const activeStart = dur * 0.22;
      const activeEnd = dur * 0.72;

      // Slight forward step on finisher
      if (step === 3 && elapsed < dur * 0.4) {
        p.x += p.facing * 52 * dt;
      }

      if (elapsed >= activeStart && elapsed <= activeEnd) {
        const reach = def.reach + (step === 3 ? 16 : step === 2 ? 6 : 0);
        const baseDmg = (step === 1 ? 15 : step === 2 ? 20 : 32) * def.power;
        for (const e of enemies) {
          if (e.state === 'ko' || e.state === 'spawn' || p.hitIds.has(e.id)) continue;
          const dx = (e.x - p.x) * p.facing;
          const dy = Math.abs(e.y - p.y);
          if (dx >= -8 && dx <= reach + 12 && dy <= 22 && e.z < 34) {
            p.hitIds.add(e.id);
            const kbX = step === 3 ? 165 : step === 2 ? 55 : 35;
            const kbZ = step === 3 ? 150 : 0;
            damageEnemy(e, Math.round(baseDmg), kbX, kbZ, p.facing, step === 3);
          }
        }
        // Hit interactive props (crates, ramen carts, explosive hydrants)
        for (let pi = props.length - 1; pi >= 0; pi--) {
          const pr = props[pi];
          if (p.hitIds.has(pr.id)) continue;
          const dx = (pr.x - p.x) * p.facing;
          const dy = Math.abs(pr.y - p.y);
          if (dx >= -8 && dx <= reach + 10 && dy <= 22) {
            p.hitIds.add(pr.id);
            damageProp(pr, Math.round(baseDmg));
          }
        }
      }

      if (p.stateTimer <= 0) {
        if (p.comboQueued && step < 3) {
          startPlayerAttack(step + 1);
        } else {
          p.state = 'idle';
          p.comboStep = step < 3 ? step : 0;
          p.comboWindow = step < 3 ? 0.26 : 0;
        }
      }
      clampPlayerBounds();
      return;
    }

    // Free movement (Ground or Airborne)
    let ix = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    let iy = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
    if (ix !== 0 && iy !== 0) { ix *= 0.707; iy *= 0.707; }

    const airMult = p.z > 0 ? 0.92 : 1.0;
    p.vx = ix * def.speed * airMult;
    p.vy = iy * def.speed * 0.68 * airMult;
    if (ix !== 0 && p.state !== 'jumpkick') p.facing = ix > 0 ? 1 : -1;

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Jump & Jump Kick physics
    if (p.z > 0 || p.vz > 0) {
      p.z += p.vz * dt;
      p.vz -= GRAVITY * dt;

      if (justPressed.attack && p.state !== 'jumpkick') {
        p.state = 'jumpkick';
        p.hitIds.clear();
        p.vx = p.facing * def.speed * 1.15;
        sfx.playSwing(2);
      }

      if (p.state === 'jumpkick') {
        // Active flying kick hitbox
        for (const e of enemies) {
          if (e.state === 'ko' || e.state === 'spawn' || p.hitIds.has(e.id)) continue;
          const dx = (e.x - p.x) * p.facing;
          const dy = Math.abs(e.y - p.y);
          if (dx >= -6 && dx <= 38 && dy <= 22 && Math.abs(e.z - p.z) <= 36) {
            p.hitIds.add(e.id);
            damageEnemy(e, Math.round(24 * def.power), 135, 115, p.facing, true);
          }
        }
        for (let pi = props.length - 1; pi >= 0; pi--) {
          const pr = props[pi];
          if (p.hitIds.has(pr.id)) continue;
          const dx = (pr.x - p.x) * p.facing;
          const dy = Math.abs(pr.y - p.y);
          if (dx >= -6 && dx <= 38 && dy <= 22 && p.z <= 28) {
            p.hitIds.add(pr.id);
            damageProp(pr, Math.round(24 * def.power));
          }
        }
        // Motion sparkle trail
        if (Math.random() < 0.5) {
          spawnParticles(p.x - p.facing * 8, p.y, p.z + 18, '#ff59b8', 1, 30);
        }
      }

      if (p.z <= 0) {
        p.z = 0;
        p.vz = 0;
        p.state = 'idle';
        spawnParticles(p.x, p.y, 0, '#d8c4f0', 4, 40);
      }
    } else {
      // Ground actions
      if (justPressed.jump) {
        p.vz = 248;
        p.z = 1;
        p.state = 'jump';
        sfx.playJump();
        spawnParticles(p.x, p.y, 0, '#ffffff', 5, 50);
      } else if (justPressed.attack) {
        const nextStep = p.comboWindow > 0 ? Math.min(3, p.comboStep + 1) : 1;
        startPlayerAttack(nextStep);
      } else {
        p.state = (Math.abs(ix) > 0.05 || Math.abs(iy) > 0.05) ? 'walk' : 'idle';
      }
    }

    clampPlayerBounds();
  }

  function startPlayerAttack(step) {
    const p = player;
    p.state = 'atk' + step;
    p.comboStep = step;
    p.comboQueued = false;
    p.hitIds.clear();
    const baseDur = step === 1 ? 0.19 : step === 2 ? 0.22 : 0.34;
    p.stateTimer = baseDur / p.def.atkSpeed;
    sfx.playSwing(step);
  }

  function clampPlayerBounds() {
    const minX = camX + 20;
    const maxX = Math.min(currentWorldWidth - 24, camX + W - 20);
    player.x = Math.max(minX, Math.min(maxX, player.x));
    player.y = Math.max(FLOOR_MIN_Y, Math.min(FLOOR_MAX_Y, player.y));
  }

  function fireEnemyProjectile(e, vyOff = 0) {
    projectiles.push({
      x: e.x + e.facing * 18,
      y: e.y,
      z: 22,
      vx: e.facing * (e.isBoss ? 175 : 145),
      vy: vyOff,
      dmg: e.dmg,
      color: e.type === 'boss_king' ? '#ffe066' : '#ff45b5',
      life: 2.6,
    });
    sfx.playSwing(2);
  }

  function updateEnemies(dt) {
    // Limit simultaneous active attackers to 2 (3 in Stage 4) for fair beat'em up pacing
    const maxAttackers = stageIndex >= 3 ? 3 : 2;
    let activeAttackers = enemies.filter(e => e.state === 'windup' || e.state === 'atk' || e.state === 'slam').length;

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.animTimer += dt;
      if (e.flash > 0) e.flash -= dt;
      if (e.atkCooldown > 0) e.atkCooldown -= dt;
      if (e.hazardCooldown > 0) e.hazardCooldown -= dt;
      if (e.hasSlam && e.slamCooldown > 0) e.slamCooldown -= dt;

      // Airborne physics
      if (e.z > 0 || e.vz > 0) {
        e.z += e.vz * dt;
        e.vz -= GRAVITY * dt;
        e.x += e.vx * dt;
        if (e.z <= 0) {
          e.z = 0;
          e.vz = 0;
          e.vx *= 0.4;
          spawnParticles(e.x, e.y, 0, '#bfa2db', 5, 45);
        }
      }

      if (e.state === 'spawn') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0 && e.z === 0) e.state = 'chase';
        continue;
      }

      if (e.state === 'ko') {
        e.stateTimer -= dt;
        e.x += e.vx * dt;
        e.vx *= 0.92;
        if (e.isBoss && Math.random() < 0.35) {
          spawnHitStar(e.x + (Math.random() - 0.5) * 32, e.y, e.z + 20 + Math.random() * 24, true);
        }
        if (e.stateTimer <= 0) {
          spawnParticles(e.x, e.y, 16, '#ff45b5', 14, 110);
          enemies.splice(i, 1);
        }
        continue;
      }

      if (e.state === 'hurt') {
        e.stateTimer -= dt;
        if (e.z === 0) {
          e.x += e.vx * dt;
          e.vx *= 0.85;
        }
        e.x = Math.max(camX + 14, Math.min(camX + W - 14, e.x));
        if (e.stateTimer <= 0 && e.z === 0) {
          e.state = 'chase';
        }
        continue;
      }

      if (e.state === 'windup') {
        e.stateTimer -= dt;
        e.facing = player.x >= e.x ? 1 : -1;
        if (e.stateTimer <= 0) {
          e.state = 'atk';
          e.stateTimer = e.isBoss ? 0.34 : 0.24;
          e.hitApplied = false;
          if (e.ranged && Math.abs(player.x - e.x) > 58) {
            // Ranged cursed music orb attack!
            e.hitApplied = true;
            e.vx = 0;
            fireEnemyProjectile(e, 0);
            if (e.type === 'boss_king' && e.enraged) {
              fireEnemyProjectile(e, -28);
              fireEnemyProjectile(e, 28);
            }
          } else {
            // Lunge forward slightly (Train Reaper & Bosses dash faster!)
            const lunge = e.type === 'boss_reaper' ? 210 : (e.type === 'gat' || e.isBoss ? 135 : 58);
            e.vx = e.facing * lunge;
            sfx.playSwing(1);
          }
        }
        continue;
      }

      if (e.state === 'atk') {
        e.stateTimer -= dt;
        e.x += e.vx * dt;
        e.vx *= 0.88;
        e.x = Math.max(camX + 14, Math.min(camX + W - 14, e.x));
        if (!e.hitApplied && e.stateTimer < (e.isBoss ? 0.24 : 0.16)) {
          const dx = (player.x - e.x) * e.facing;
          const dy = Math.abs(player.y - e.y);
          if (dx >= -6 && dx <= e.reach + 8 && dy <= 18 && player.z < 26) {
            e.hitApplied = true;
            damagePlayer(e.dmg, e.facing);
          }
        }
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.atkCooldown = e.isBoss ? (e.enraged ? 0.78 : 1.08) : (e.ranged ? 1.55 : 0.95 + Math.random() * 0.65);
        }
        continue;
      }

      if (e.state === 'slam') {
        e.stateTimer -= dt;
        if (!e.hitApplied && e.stateTimer <= 0.32) {
          e.hitApplied = true;
          sfx.playHit(true);
          triggerShake(0.28, 4.5);
          shockwaves.push({
            x: e.x, y: e.y, r: 12, maxR: e.type === 'boss_king' ? 185 : 155, color: e.type === 'boss_king' ? '#ffe066' : '#ff2e93',
            life: 0.68, maxLife: 0.68, friendly: false, dmg: 15, hitPlayer: false,
          });
          if (e.type === 'boss_king' && e.enraged) {
            shockwaves.push({
              x: e.x, y: e.y, r: 2, maxR: 205, color: '#ff2e93',
              life: 0.92, maxLife: 0.92, friendly: false, dmg: 15, hitPlayer: false,
            });
          }
          spawnParticles(e.x, e.y, 4, '#ff45b5', 14, 120);
        }
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.slamCooldown = e.enraged ? 3.0 : 4.4;
          e.atkCooldown = 0.75;
        }
        continue;
      }

      // CHASE & POSITION AI
      const keepDist = e.ranged ? 128 : (e.reach - 4);
      const desiredX = Math.max(camX + 26, Math.min(camX + W - 26, player.x + e.flankSide * keepDist));
      const desiredY = Math.max(FLOOR_MIN_Y + 4, Math.min(FLOOR_MAX_Y - 4, player.y + (e.ranged ? 0 : e.flankYOff * 0.25)));
      const dx = desiredX - e.x;
      const dy = desiredY - e.y;
      const distPlayerX = Math.abs(player.x - e.x);
      const distPlayerY = Math.abs(player.y - e.y);

      e.facing = player.x >= e.x ? 1 : -1;

      // Boss special Rift Shockwave check
      if (e.hasSlam && e.slamCooldown <= 0 && distPlayerX < 145 && distPlayerY < 50) {
        e.state = 'slam';
        e.stateTimer = 0.72;
        e.hitApplied = false;
        addFloatText(e.type === 'boss_king' ? 'ECLIPSE SLAM!' : 'RIFT SLAM!', e.x, e.y - 68, '#ff45b5', 1);
        continue;
      }

      // Ranged Attack check (Crooner, Banshee Diva, Gwi-Ma King)
      if (e.ranged && distPlayerX >= 64 && distPlayerX <= 210 && distPlayerY <= 18 && e.atkCooldown <= 0 && activeAttackers < maxAttackers) {
        e.state = 'windup';
        e.stateTimer = 0.44;
        activeAttackers++;
        continue;
      }

      // Melee Attack check
      if (distPlayerX <= e.reach && distPlayerY <= 16 && e.atkCooldown <= 0 && activeAttackers < maxAttackers) {
        e.state = 'windup';
        e.stateTimer = e.isBoss ? 0.36 : 0.34;
        activeAttackers++;
        continue;
      }

      // Move toward flanking/zoning slot
      const len = Math.hypot(dx, dy) || 1;
      if (len > 4) {
        e.x += (dx / len) * e.speed * dt;
        e.y += (dy / len) * e.speed * 0.72 * dt;
      }
      e.x = Math.max(camX + 16, Math.min(camX + W - 16, e.x));
      e.y = Math.max(FLOOR_MIN_Y, Math.min(FLOOR_MAX_Y, e.y));
    }
  }

  function finishCurrentStage() {
    const st = getCurrentStage();
    wavePhase = 'done';
    const clearBonus = 1500 + stageIndex * 500;
    const hpBonus = Math.round(player.hp * 15);
    const challenges = [];
    if (stageStats.hazardHits === 0) challenges.push({ label: 'NO HAZARD DAMAGE', bonus: 750 });
    if (stageStats.stageMaxCombo >= 10) challenges.push({ label: '10+ HIT IDOL COMBO', bonus: 750 });
    if (stageStats.propsSmashed >= 2) challenges.push({ label: 'PROP SMASHER', bonus: 500 });

    const chalTotal = challenges.reduce((acc, c) => acc + c.bonus, 0);
    stageStats.clearBonus = clearBonus;
    stageStats.hpBonus = hpBonus;
    stageStats.challenges = challenges;

    score += clearBonus + hpBonus + chalTotal;
    persistLocalHighScore();
    sfx.stopBGM();

    if (stageIndex < STAGES.length - 1) {
      gameState = 'stageclear';
      sfx.playStageClear();
    } else {
      gameState = 'victory';
      sfx.playEncoreSpecial();
      recordKpopDemonHuntersScore(score);
    }
  }

  function updateWaves(dt) {
    const st = getCurrentStage();
    const zones = st.zones;
    const cfg = zones[waveIndex];
    if (!cfg) return;

    if (wavePhase === 'spawn') {
      waveTimer -= dt;
      if (waveTimer <= 0) {
        const group = cfg.subWaves[waveSubIndex];
        for (const sp of group) {
          spawnEnemy(sp.type, sp.x, sp.y, !!sp.skyDrop);
        }
        if (waveSubIndex === 0) {
          bannerText = cfg.name;
          bannerSub = cfg.subtitle;
          bannerTimer = 1.9;
        }
        wavePhase = 'fight';
      }
    } else if (wavePhase === 'fight') {
      if (enemies.length === 0) {
        waveSubIndex++;
        if (waveSubIndex < cfg.subWaves.length) {
          wavePhase = 'spawn';
          waveTimer = 0.55;
        } else {
          if (waveIndex < zones.length - 1) {
            const nextZone = zones[waveIndex + 1];
            if (nextZone.isBossZone && props.filter(p => p.kind === 'cart').length === 0) {
              items.push({ kind: 'ramyeon', x: camX + W * 0.65, y: 202, z: 24, vz: 100, life: 25 });
              addFloatText('RAMYEON DROP!', camX + W * 0.65, 160, '#ffe066', 1);
            }
            waveIndex++;
            waveSubIndex = 0;
            wavePhase = 'go';
            targetCamX = zones[waveIndex].lockX;
            sfx.playConfirm();
          } else {
            finishCurrentStage();
          }
        }
      }
    } else if (wavePhase === 'go') {
      const desiredCam = Math.max(camX, Math.min(targetCamX, player.x - 160));
      camX += (desiredCam - camX) * Math.min(1, dt * 6);
      if (camX >= targetCamX - 6) {
        camX = targetCamX;
        const nextCfg = zones[waveIndex];
        if (nextCfg && nextCfg.isBossZone) {
          wavePhase = 'warning';
          waveTimer = 1.9;
          bannerText = 'WARNING!!';
          bannerSub = nextCfg.warningSub || nextCfg.subtitle;
          bannerTimer = 2.0;
          sfx.playBossWarning();
          sfx.startBGM('boss');
        } else {
          wavePhase = 'spawn';
          waveTimer = 0.35;
        }
      }
    } else if (wavePhase === 'warning') {
      waveTimer -= dt;
      if (waveTimer <= 0) {
        wavePhase = 'spawn';
        waveTimer = 0.1;
      }
    }
  }

  function updateWorldObjects(dt) {
    const st = getCurrentStage();
    if (st.autoScrollSpeed > 0) {
      stageScrollOffset += st.autoScrollSpeed * dt;
    }

    // Props flash decay
    for (const pr of props) {
      if (pr.flash > 0) pr.flash -= dt;
    }

    // Two-Way Environmental Hazards (Steam Vents / Rift Lasers & Snap Electric Grates)
    for (const hz of hazards) {
      if (hz.kind === 'steam') {
        hz.timer = (hz.timer + dt) % 3.9; // 2.0s off -> 0.6s telegraph -> 1.3s active
        if (hz.timer < 2.0) hz.state = 'idle';
        else if (hz.timer < 2.6) hz.state = 'telegraph';
        else hz.state = 'active';

        if (hz.state === 'active') {
          if (Math.random() < 0.45) {
            spawnParticles(hz.x + (Math.random() - 0.5) * 14, hz.y, 10, st.theme === 'throne' ? '#ff42b3' : '#d6f5ff', 1, 70);
          }
          if (player && Math.abs(player.x - hz.x) < 18 && Math.abs(player.y - hz.y) < 15 && player.z < 20) {
            damagePlayer(12, player.x >= hz.x ? 1 : -1, true);
          }
          // Two-way: also hurts enemies knocked into the vent/laser!
          for (const e of enemies) {
            if (e.state === 'ko' || e.state === 'spawn' || e.hazardCooldown > 0) continue;
            if (Math.abs(e.x - hz.x) < 18 && Math.abs(e.y - hz.y) < 15 && e.z < 20) {
              e.hazardCooldown = 0.85;
              damageEnemy(e, 22, 95, 110, e.x >= hz.x ? 1 : -1, true, false);
            }
          }
        }
      } else if (hz.kind === 'plank') {
        if (hz.state === 'idle') {
          let triggered = false;
          if (player && Math.abs(player.x - hz.x) < 16 && Math.abs(player.y - hz.y) < 12 && player.z < 6) triggered = true;
          for (const e of enemies) {
            if (e.state !== 'ko' && Math.abs(e.x - hz.x) < 16 && Math.abs(e.y - hz.y) < 12 && e.z < 6) triggered = true;
          }
          if (triggered) {
            hz.state = 'armed';
            hz.timer = 0.42;
            sfx.playSelect();
          }
        } else if (hz.state === 'armed') {
          hz.timer -= dt;
          if (hz.timer <= 0) {
            hz.state = 'snap';
            hz.timer = 0.25;
            sfx.playZap();
            spawnParticles(hz.x, hz.y, 8, '#ffe066', 10, 100);
            if (player && Math.abs(player.x - hz.x) < 20 && Math.abs(player.y - hz.y) < 15 && player.z < 16) {
              player.vz = 155;
              damagePlayer(14, player.x >= hz.x ? 1 : -1, true);
            }
            for (const e of enemies) {
              if (e.state === 'ko' || e.state === 'spawn') continue;
              if (Math.abs(e.x - hz.x) < 20 && Math.abs(e.y - hz.y) < 15 && e.z < 16) {
                damageEnemy(e, 28, 110, 150, e.x >= hz.x ? 1 : -1, true, false);
              }
            }
          }
        } else if (hz.state === 'snap') {
          hz.timer -= dt;
          if (hz.timer <= 0) {
            hz.state = 'cooldown';
            hz.timer = 1.6;
          }
        } else if (hz.state === 'cooldown') {
          hz.timer -= dt;
          if (hz.timer <= 0) hz.state = 'idle';
        }
      }
    }

    // Stage 3 Sky-Express: Telegraphed High-Speed Hover-Drone Lane Hazards
    if (st.hasLaneDrones && wavePhase === 'fight') {
      laneDroneTimer -= dt;
      if (laneDroneTimer <= 0) {
        laneDroneTimer = 4.4;
        const laneY = Math.max(FLOOR_MIN_Y + 10, Math.min(FLOOR_MAX_Y - 10, player ? player.y : 200));
        laneDrones.push({
          x: camX + W + 34,
          y: laneY,
          vx: -310,
          warnTimer: 0.85,
          active: false,
          hitPlayer: false,
          hitEnemyIds: new Set(),
        });
        sfx.playSelect();
      }
    }
    for (let i = laneDrones.length - 1; i >= 0; i--) {
      const dr = laneDrones[i];
      if (!dr.active) {
        dr.warnTimer -= dt;
        dr.x = camX + W + 34;
        if (dr.warnTimer <= 0) {
          dr.active = true;
          sfx.playSwing(3);
        }
      } else {
        dr.x += dr.vx * dt;
        if (Math.random() < 0.5) spawnParticles(dr.x + 12, dr.y, 16, '#ff45b5', 1, 45);
        if (!dr.hitPlayer && player && Math.abs(player.x - dr.x) < 20 && Math.abs(player.y - dr.y) < 14 && player.z < 20) {
          dr.hitPlayer = true;
          damagePlayer(14, -1, true);
        }
        // Two-way: speeding drones also bowl over enemies!
        for (const e of enemies) {
          if (e.state === 'ko' || e.state === 'spawn' || dr.hitEnemyIds.has(e.id)) continue;
          if (Math.abs(e.x - dr.x) < 22 && Math.abs(e.y - dr.y) < 15 && e.z < 22) {
            dr.hitEnemyIds.add(e.id);
            damageEnemy(e, 24, 130, 120, -1, true, false);
          }
        }
        if (dr.x < camX - 48) laneDrones.splice(i, 1);
      }
    }

    // Enemy Cursed Music Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const pj = projectiles[i];
      pj.life -= dt;
      pj.x += pj.vx * dt;
      pj.y += pj.vy * dt;
      if (player && Math.abs(player.x - pj.x) < 16 && Math.abs(player.y - pj.y) < 14 && Math.abs(player.z - (pj.z - 14)) < 22) {
        damagePlayer(pj.dmg, pj.vx >= 0 ? 1 : -1);
        spawnParticles(pj.x, pj.y, pj.z, pj.color, 8, 85);
        projectiles.splice(i, 1);
        continue;
      }
      if (pj.life <= 0 || pj.x < camX - 30 || pj.x > camX + W + 30) {
        projectiles.splice(i, 1);
      }
    }

    // Pickups (Gimbap, Ramyeon, Encore Lightstick Star)
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.life -= dt;
      if (it.z > 0 || it.vz > 0) {
        it.z += it.vz * dt;
        it.vz -= GRAVITY * dt;
        if (it.z <= 0) { it.z = 0; it.vz = 0; }
      }
      if (Math.abs(player.x - it.x) < 24 && Math.abs(player.y - it.y) < 18 && player.z < 20) {
        if (it.kind === 'star') {
          addEncore(35);
          score += 350;
          sfx.playPickup();
          addFloatText('+35 ENCORE!', it.x, it.y - 26, '#5ef6ff', 1);
        } else {
          const heal = it.kind === 'ramyeon' ? 50 : 28;
          player.hp = Math.min(player.maxHp, player.hp + heal);
          score += 200;
          sfx.playPickup();
          addFloatText('+' + heal + ' HP!', it.x, it.y - 26, '#5eff8f', 1);
        }
        persistLocalHighScore();
        spawnParticles(it.x, it.y, 12, '#ffe066', 10, 80);
        items.splice(i, 1);
        continue;
      }
      if (it.life <= 0) items.splice(i, 1);
    }

    // Shockwaves (both friendly Encore rings & boss floor shockwaves)
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      sw.life -= dt;
      const t = 1 - sw.life / sw.maxLife;
      sw.r = sw.maxR * t;
      if (!sw.friendly && sw.dmg > 0 && !sw.hitPlayer && player) {
        const dx = player.x - sw.x;
        const dy = (player.y - sw.y) * 1.9;
        const dist = Math.hypot(dx, dy);
        if (Math.abs(dist - sw.r) < 14 && player.z < 16) {
          sw.hitPlayer = true;
          damagePlayer(sw.dmg, dx >= 0 ? 1 : -1);
        }
      }
      if (sw.life <= 0) shockwaves.splice(i, 1);
    }

    // Dimensional Rifts
    for (let i = rifts.length - 1; i >= 0; i--) {
      rifts[i].life -= dt;
      if (rifts[i].life <= 0) rifts.splice(i, 1);
    }

    // Encore Member Summons
    for (let i = encoreMembers.length - 1; i >= 0; i--) {
      encoreMembers[i].life -= dt;
      if (encoreMembers[i].life <= 0) encoreMembers.splice(i, 1);
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.life -= dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.z = Math.max(0, pt.z + pt.vz * dt);
      if (pt.type === 'pixel') pt.vz -= 260 * dt;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    // Floating Texts
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.life -= dt;
      ft.y += ft.vy * dt;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  // =========================================================================
  // 11. RENDERING (ENTITIES, DEPTH SORTING, HUD, SCREENS)
  // =========================================================================
  function getHunterSprite(p) {
    const set = SPRITES.hunters[p.def.id];
    let pose = 'idle0';
    if (p.state === 'idle') pose = Math.floor(p.animTimer * 4) % 2 === 0 ? 'idle0' : 'idle1';
    else if (p.state === 'walk') pose = 'walk' + (Math.floor(p.animTimer * 10) % 4);
    else if (p.state === 'jump') pose = 'jump';
    else if (p.state === 'jumpkick') pose = 'jumpkick';
    else if (p.state === 'atk1' || p.state === 'atk2' || p.state === 'atk3') pose = p.state;
    else if (p.state === 'special') pose = 'special';
    else if (p.state === 'hurt') pose = 'hurt';
    return p.flash > 0 ? set[pose + '_flash'] : set[pose];
  }

  function getEnemySprite(e) {
    const set = SPRITES.enemies[e.type];
    let pose = 'idle';
    if (e.state === 'hurt' || e.state === 'ko') pose = 'hurt';
    else if (e.state === 'windup') pose = 'windup';
    else if (e.state === 'atk') pose = 'atk';
    else if (e.state === 'slam') pose = 'slam';
    else if (e.state === 'chase') pose = Math.floor(e.animTimer * 7) % 2 === 0 ? 'walk0' : 'walk1';
    return e.flash > 0 ? set[pose + '_flash'] : set[pose];
  }

  function drawWorld() {
    const st = getCurrentStage();
    ctx.save();
    // Apply screen shake
    if (shakeTime > 0) {
      const sx = Math.round((Math.random() - 0.5) * 2 * shakeMag);
      const sy = Math.round((Math.random() - 0.5) * 2 * shakeMag);
      ctx.translate(sx, sy);
    }

    drawBackground(camX, time, encoreTimer > 0 ? Math.min(1, encoreTimer * 1.4) : 0, st.theme);

    // Draw Floor Hazards (Steam Vents / Rift Lasers & Snap Electric Grates)
    for (const hz of hazards) {
      const sx = Math.round(hz.x - camX);
      const sy = Math.round(hz.y);
      if (sx < -40 || sx > W + 40) continue;
      if (hz.kind === 'steam') {
        ctx.fillStyle = '#180a2b';
        ctx.fillRect(sx - 14, sy - 6, 28, 12);
        ctx.strokeStyle = hz.state === 'active' ? '#ff3b6b' : hz.state === 'telegraph' ? '#ffe066' : '#5e4799';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - 14, sy - 6, 28, 12);
        // Vent bars
        ctx.fillStyle = '#381e66';
        for (let bx = -10; bx <= 10; bx += 5) ctx.fillRect(sx + bx, sy - 4, 2, 8);
        if (hz.state === 'telegraph' && Math.floor(time * 16) % 2 === 0) {
          drawText('!', sx, sy - 20, '#ffe066', 1, 'center');
          ctx.fillStyle = 'rgba(255, 224, 102, 0.5)';
          ctx.fillRect(sx - 12, sy - 10, 24, 10);
        } else if (hz.state === 'active') {
          const isThrone = st.theme === 'throne';
          ctx.fillStyle = isThrone ? 'rgba(255, 51, 102, 0.72)' : 'rgba(210, 248, 255, 0.75)';
          ctx.fillRect(sx - 10, sy - 38, 20, 38);
          ctx.fillStyle = isThrone ? '#ffe066' : '#ffffff';
          ctx.fillRect(sx - 4, sy - 36, 8, 36);
        }
      } else if (hz.kind === 'plank') {
        ctx.fillStyle = hz.state === 'armed' ? '#ffe066' : hz.state === 'snap' ? '#ff3b6b' : '#4a2b78';
        ctx.fillRect(sx - 15, sy - 6, 30, 12);
        ctx.strokeStyle = '#5ef6ff';
        ctx.lineWidth = 1;
        ctx.strokeRect(sx - 15, sy - 6, 30, 12);
        // Cracked caution stripes
        ctx.fillStyle = '#18082b';
        ctx.fillRect(sx - 9, sy - 5, 4, 10);
        ctx.fillRect(sx + 5, sy - 5, 4, 10);
        if (hz.state === 'snap') {
          ctx.fillStyle = '#5ef6ff';
          ctx.fillRect(sx - 14, sy - 26, 28, 22);
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(sx - 6, sy - 24, 12, 18);
        }
      }
    }

    // Draw floor Rifts
    for (const rf of rifts) {
      const sx = Math.round(rf.x - camX);
      const sy = Math.round(rf.y);
      const prog = Math.sin((rf.life / rf.maxLife) * Math.PI);
      const rad = Math.max(2, Math.round(rf.radius * prog));
      ctx.fillStyle = '#24073b';
      ctx.fillRect(sx - rad, sy - Math.round(rad * 0.35), rad * 2, Math.round(rad * 0.7));
      ctx.strokeStyle = '#ff38a8';
      ctx.lineWidth = 2;
      ctx.strokeRect(sx - rad, sy - Math.round(rad * 0.35), rad * 2, Math.round(rad * 0.7));
    }

    // Draw floor Shockwaves (elliptical 2.5D perspective rings!)
    for (const sw of shockwaves) {
      const sx = Math.round(sw.x - camX);
      const sy = Math.round(sw.y);
      ctx.save();
      ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife);
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = sw.friendly ? 4 : 3;
      ctx.beginPath();
      ctx.ellipse(sx, sy, Math.max(1, sw.r), Math.max(1, sw.r * 0.44), 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Depth-sorted renderables (props, items, enemies, drones, projectiles, summoned idols, player)
    const drawList = [];
    for (const pr of props) drawList.push({ y: pr.y, kind: 'prop', obj: pr });
    for (const it of items) drawList.push({ y: it.y, kind: 'item', obj: it });
    for (const e of enemies) drawList.push({ y: e.y, kind: 'enemy', obj: e });
    for (const dr of laneDrones) if (dr.active) drawList.push({ y: dr.y, kind: 'drone', obj: dr });
    for (const pj of projectiles) drawList.push({ y: pj.y, kind: 'proj', obj: pj });
    for (const m of encoreMembers) drawList.push({ y: m.y, kind: 'encoreMember', obj: m });
    if (player) drawList.push({ y: player.y, kind: 'player', obj: player });
    drawList.sort((a, b) => a.y - b.y);

    for (const entry of drawList) {
      if (entry.kind === 'prop') {
        const pr = entry.obj;
        const sx = Math.round(pr.x - camX);
        const sy = Math.round(pr.y);
        if (sx < -40 || sx > W + 40) continue;
        ctx.fillStyle = 'rgba(20, 6, 38, 0.5)';
        ctx.fillRect(sx - 12, sy - 3, 24, 6);
        const img = SPRITES.props[pr.kind];
        if (img) {
          drawSprite(img, sx + (pr.flash > 0 ? 1 : 0), sy + 2, 1, 0.5, 1);
        }
        if (pr.kind === 'hydrant') {
          drawText('BOOM', sx, sy - 28, Math.floor(time * 6) % 2 === 0 ? '#ffe066' : '#ff45b5', 1, 'center');
        }
      } else if (entry.kind === 'drone') {
        const dr = entry.obj;
        const sx = Math.round(dr.x - camX);
        const sy = Math.round(dr.y);
        ctx.fillStyle = 'rgba(20, 6, 38, 0.45)';
        ctx.fillRect(sx - 14, sy - 3, 28, 6);
        // Speeding Neon Demon Hover-Drone
        ctx.fillStyle = '#240b42';
        ctx.fillRect(sx - 14, sy - 22, 28, 12);
        ctx.fillStyle = '#ff3b6b';
        ctx.fillRect(sx - 12, sy - 20, 24, 8);
        ctx.fillStyle = '#ffe066';
        ctx.fillRect(sx - 14, sy - 18, 6, 4);
        ctx.fillStyle = '#5ef6ff';
        ctx.fillRect(sx + 10, sy - 19, 10, 6);
      } else if (entry.kind === 'proj') {
        const pj = entry.obj;
        const sx = Math.round(pj.x - camX);
        const sy = Math.round(pj.y);
        ctx.fillStyle = 'rgba(20, 6, 38, 0.4)';
        ctx.fillRect(sx - 5, sy - 2, 10, 4);
        // Glowing Cursed Music Orb
        ctx.fillStyle = pj.color;
        ctx.fillRect(sx - 6, sy - pj.z - 6, 12, 12);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx - 3, sy - pj.z - 3, 6, 6);
      } else if (entry.kind === 'item') {
        const it = entry.obj;
        const sx = Math.round(it.x - camX);
        const sy = Math.round(it.y);
        const bob = Math.round(Math.sin(time * 7) * 2);
        ctx.fillStyle = 'rgba(25, 8, 44, 0.45)';
        ctx.fillRect(sx - 10, sy - 2, 20, 4);
        const img = SPRITES.items[it.kind];
        drawSprite(img, sx, sy - it.z + bob, 1, 0.5, 1);
      } else if (entry.kind === 'encoreMember') {
        const m = entry.obj;
        const sx = Math.round(m.x - camX);
        const sy = Math.round(m.y);
        ctx.save();
        ctx.globalAlpha = Math.min(1, m.life * 2);
        ctx.fillStyle = 'rgba(94, 246, 255, 0.45)';
        ctx.fillRect(sx - 18, sy - 4, 36, 8);
        const img = SPRITES.hunters[m.def.id].special;
        drawSprite(img, sx, sy + 5, player.facing, 32 / 72, 50 / 56);
        ctx.restore();
      } else if (entry.kind === 'enemy') {
        const e = entry.obj;
        const sx = Math.round(e.x - camX);
        const sy = Math.round(e.y);
        const sw = e.isBoss ? 24 : e.type === 'heavy' ? 18 : 14;
        ctx.fillStyle = 'rgba(26, 8, 48, 0.45)';
        ctx.fillRect(sx - sw, sy - 3, sw * 2, 6);
        if (e.isBoss && e.enraged) {
          ctx.fillStyle = 'rgba(255, 46, 147, 0.32)';
          ctx.fillRect(sx - 24, sy - 64 - e.z, 48, 64);
        }
        if (e.state === 'ko' && Math.floor(time * 24) % 2 === 0) continue;
        const img = getEnemySprite(e);
        drawSprite(img, sx, sy - e.z + 4, e.facing, 0.5, e.isBoss ? 69 / 76 : 50 / 56);

        if (e.state === 'windup') {
          drawText('!', sx, sy - e.z - (e.isBoss ? 78 : 54), '#ffe066', 2, 'center', '#d91656');
        }
        if (!e.isBoss && e.hp < e.maxHp && e.hp > 0) {
          const bw = e.type === 'heavy' ? 32 : 26;
          ctx.fillStyle = '#19082c';
          ctx.fillRect(sx - bw / 2 - 1, sy - e.z - 52, bw + 2, 5);
          ctx.fillStyle = e.type === 'heavy' ? '#ff8833' : '#ff3b6b';
          ctx.fillRect(sx - bw / 2, sy - e.z - 51, Math.max(1, Math.round(bw * (e.hp / e.maxHp))), 3);
        }
      } else if (entry.kind === 'player') {
        const p = entry.obj;
        const sx = Math.round(p.x - camX);
        const sy = Math.round(p.y);
        const shW = Math.max(8, Math.round(15 - p.z * 0.08));
        ctx.fillStyle = 'rgba(26, 8, 48, 0.48)';
        ctx.fillRect(sx - shW, sy - 3, shW * 2, 6);

        if (p.encore >= 100 && Math.floor(time * 8) % 2 === 0) {
          ctx.strokeStyle = '#5ef6ff';
          ctx.lineWidth = 1;
          ctx.strokeRect(sx - 16, sy - 4, 32, 8);
        }

        if (p.invuln > 0 && p.state !== 'special' && Math.floor(time * 18) % 2 === 0) continue;

        const img = getHunterSprite(p);
        drawSprite(img, sx, sy - p.z + 4, p.facing, 32 / 72, 50 / 56);

        if (encoreTimer > 0.25) {
          const bx = Math.max(86, Math.min(W - 86, sx));
          const by = Math.max(54, sy - p.z - 66);
          const bw = encoreBubbleText.length * 6 + 14;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(bx - bw / 2, by - 12, bw, 16);
          ctx.strokeStyle = '#1b092e';
          ctx.lineWidth = 2;
          ctx.strokeRect(bx - bw / 2, by - 12, bw, 16);
          drawText(encoreBubbleText, bx, by - 7, '#a81c7e', 1, 'center', null);
        }
      }
    }

    // Stage 3 Lane Drone Right-Edge Warning Markers
    for (const dr of laneDrones) {
      if (!dr.active && Math.floor(time * 14) % 2 === 0) {
        ctx.fillStyle = 'rgba(217, 22, 86, 0.85)';
        ctx.fillRect(W - 44, Math.round(dr.y) - 12, 38, 18);
        ctx.strokeStyle = '#ffe066';
        ctx.lineWidth = 1;
        ctx.strokeRect(W - 44, Math.round(dr.y) - 12, 38, 18);
        drawText('<!>', W - 25, Math.round(dr.y) - 6, '#ffe066', 1, 'center');
      }
    }

    // Particles (hit starbursts, music notes, sparks)
    for (const pt of particles) {
      const sx = Math.round(pt.x - camX);
      const sy = Math.round(pt.y - pt.z);
      if (pt.type === 'star') {
        const s = Math.round(pt.size * (pt.life / pt.maxLife + 0.35));
        ctx.fillStyle = pt.color2;
        ctx.fillRect(sx - s, sy - 2, s * 2, 4);
        ctx.fillRect(sx - 2, sy - s, 4, s * 2);
        ctx.fillStyle = pt.color;
        ctx.fillRect(sx - Math.round(s * 0.6), sy - Math.round(s * 0.6), Math.round(s * 1.2), Math.round(s * 1.2));
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(sx - 2, sy - 2, 4, 4);
      } else if (pt.type === 'note') {
        ctx.fillStyle = pt.color;
        ctx.fillRect(sx, sy, 3, 2);
        ctx.fillRect(sx + 2, sy - 5, 1, 6);
        ctx.fillRect(sx + 2, sy - 5, 3, 2);
      } else {
        ctx.fillStyle = pt.color;
        ctx.fillRect(sx, sy, pt.size, pt.size);
      }
    }

    // Floating Damage / Score Popups
    for (const ft of floatingTexts) {
      drawText(ft.text, ft.x - camX, ft.y, ft.color, ft.scale, 'center');
    }

    drawForegroundParapet(camX, st.theme);
    ctx.restore();
  }

  function drawHUD() {
    const p = player;

    // 1) Top-Left Angled Arcade Character Panel (Inspired by reference image!)
    ctx.fillStyle = '#200b3d';
    ctx.fillRect(6, 5, 198, 34);
    ctx.fillStyle = '#38166b';
    ctx.fillRect(8, 7, 194, 30);
    // Neon border
    ctx.fillStyle = '#5ef6ff';
    ctx.fillRect(6, 5, 198, 2);
    ctx.fillRect(6, 37, 190, 2);
    ctx.fillRect(6, 5, 2, 34);
    ctx.fillStyle = '#ff42b3';
    ctx.fillRect(202, 5, 2, 30);

    // Portrait frame
    ctx.fillStyle = '#140626';
    ctx.fillRect(10, 9, 26, 26);
    const port = SPRITES.portraits[p.def.id];
    if (port) ctx.drawImage(port, 12, 11, 22, 22);
    ctx.strokeStyle = p.def.accent;
    ctx.lineWidth = 1;
    ctx.strokeRect(10.5, 9.5, 25, 25);

    // Name, Lives & Score
    drawText(p.def.name, 41, 9, '#ff85d0', 1, 'left');
    drawText('X' + p.lives, 74, 9, '#ffe066', 1, 'left');
    drawText(String(score).padStart(7, '0'), 198, 9, '#ffffff', 1, 'right');

    // Health Bar (Yellow -> Orange -> Red)
    const hpPct = Math.max(0, p.hp / p.maxHp);
    ctx.fillStyle = '#120521';
    ctx.fillRect(40, 19, 158, 8);
    ctx.fillStyle = '#4a1438';
    ctx.fillRect(41, 20, 156, 6);
    const fillW = Math.round(156 * hpPct);
    ctx.fillStyle = hpPct > 0.5 ? '#ffd43b' : hpPct > 0.25 ? '#ff8833' : '#ff3355';
    ctx.fillRect(41, 20, fillW, 6);
    ctx.fillStyle = '#fff3b0';
    ctx.fillRect(41, 20, fillW, 2);

    // Segmented ENCORE Special Meter
    drawText('ENCORE', 41, 29, p.encore >= 100 ? '#ffe066' : '#5ef6ff', 1, 'left');
    const barX = 82;
    const barW = 116;
    ctx.fillStyle = '#120521';
    ctx.fillRect(barX, 29, barW, 7);
    const segs = 10;
    const segW = 10;
    const filledSegs = Math.floor((p.encore / 100) * segs);
    const readyPulse = p.encore >= 100 && Math.floor(time * 10) % 2 === 0;
    for (let s = 0; s < segs; s++) {
      const sx = barX + 2 + s * (segW + 1);
      if (s < filledSegs) {
        ctx.fillStyle = readyPulse ? '#ffe066' : (p.encore >= 100 ? '#ff42b3' : '#3ff5ff');
      } else {
        ctx.fillStyle = '#29154a';
      }
      ctx.fillRect(sx, 30, segW, 5);
    }
    if (p.encore >= 100) {
      drawText('PRESS [L/C] ENCORE!', 104, 42, readyPulse ? '#ffe066' : '#5ef6ff', 1, 'center');
    }

    // 2) Top-Center Stage & Wave Indicator
    const st = getCurrentStage();
    const curZone = st.zones[waveIndex] || st.zones[0];
    const waveLabel = `STG ${stageIndex + 1}/4 ${curZone.isBossZone ? 'BOSS' : 'W' + (waveIndex + 1)}`;
    ctx.fillStyle = '#200b3d';
    ctx.fillRect(212, 5, 126, 22);
    ctx.fillStyle = '#ff42b3';
    ctx.fillRect(212, 5, 126, 2);
    drawText(waveLabel, 275, 10, '#ffe066', 1, 'center');
    const rem = enemies.filter(e => e.state !== 'ko').length;
    drawText('DEMONS:' + rem, 275, 19, '#d8c2ff', 1, 'center');

    // 3) Top-Right Dynamic COMBO METER
    if (comboCount > 0) {
      const bounce = comboTimer > 2.45 ? -2 : 0;
      ctx.fillStyle = '#240b42';
      ctx.fillRect(352, 6 + bounce, 122, 32);
      ctx.fillStyle = '#ff42b3';
      ctx.fillRect(352, 6 + bounce, 122, 2);
      ctx.fillStyle = '#5ef6ff';
      ctx.fillRect(352, 36 + bounce, 122, 2);

      const rank = comboCount >= 18 ? 'IDOL GOD!' : comboCount >= 12 ? 'ENCORE!!' : comboCount >= 7 ? 'SLAY!!' : comboCount >= 4 ? 'GROOVE!' : 'HYPE!';
      drawText(comboCount + ' HIT!', 413, 11 + bounce, '#ffe066', 2, 'center', '#6e1152');
      drawText(rank, 413, 27 + bounce, '#5ef6ff', 1, 'center');

      const pct = Math.max(0, comboTimer / 2.6);
      ctx.fillStyle = '#ff42b3';
      ctx.fillRect(356, 34 + bounce, Math.round(114 * pct), 2);
    } else {
      drawText('HI ' + String(highScore).padStart(7, '0'), 472, 10, '#bfa2db', 1, 'right');
    }

    // 4) Boss Health Bars (Supports Single Boss & Stage 2 Duo Boss!)
    const activeBosses = enemies.filter(e => e.isBoss && e.state !== 'ko');
    if (activeBosses.length === 1) {
      const boss = activeBosses[0];
      const bx = 90, by = 248, bw = 300;
      ctx.fillStyle = '#18062b';
      ctx.fillRect(bx - 2, by - 11, bw + 4, 20);
      ctx.fillStyle = '#ff2e93';
      ctx.fillRect(bx - 2, by - 11, bw + 4, 2);
      drawText('BOSS: ' + boss.name, bx + 4, by - 8, '#ff85d0', 1, 'left');
      ctx.fillStyle = '#381036';
      ctx.fillRect(bx, by + 1, bw, 6);
      const bFill = Math.round(bw * Math.max(0, boss.hp / boss.maxHp));
      ctx.fillStyle = boss.enraged ? '#ff2468' : '#b833ff';
      ctx.fillRect(bx, by + 1, bFill, 6);
      ctx.fillStyle = '#ffb8e6';
      ctx.fillRect(bx, by + 1, bFill, 2);
    } else if (activeBosses.length >= 2) {
      activeBosses.slice(0, 2).forEach((boss, idx) => {
        const bw = 204;
        const bx = idx === 0 ? 28 : 248;
        const by = 248;
        ctx.fillStyle = '#18062b';
        ctx.fillRect(bx - 2, by - 11, bw + 4, 20);
        ctx.fillStyle = idx === 0 ? '#5ef6ff' : '#ff2e93';
        ctx.fillRect(bx - 2, by - 11, bw + 4, 2);
        drawText(boss.name, bx + 4, by - 8, idx === 0 ? '#5ef6ff' : '#ff85d0', 1, 'left');
        ctx.fillStyle = '#381036';
        ctx.fillRect(bx, by + 1, bw, 6);
        const bFill = Math.round(bw * Math.max(0, boss.hp / boss.maxHp));
        ctx.fillStyle = boss.enraged ? '#ff2468' : (idx === 0 ? '#38bdf8' : '#d946ef');
        ctx.fillRect(bx, by + 1, bFill, 6);
      });
    }

    // 5) Classic Arcade Blinking "GO ->" Prompt Between Waves
    if (wavePhase === 'go' && Math.floor(time * 5) % 2 === 0) {
      ctx.fillStyle = '#240942';
      ctx.fillRect(398, 72, 68, 28);
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(398, 72, 68, 2);
      ctx.fillRect(398, 98, 68, 2);
      drawText('GO >>', 432, 80, '#ffe066', 2, 'center', '#d91656');
    }

    // 6) Stage / Wave / Warning Center Banner
    if (bannerTimer > 0) {
      const isWarn = bannerText.includes('WARNING');
      ctx.fillStyle = isWarn ? 'rgba(140, 12, 54, 0.85)' : 'rgba(26, 8, 52, 0.84)';
      ctx.fillRect(0, 96, W, 42);
      ctx.fillStyle = isWarn ? '#ffe066' : '#5ef6ff';
      ctx.fillRect(0, 96, W, 2);
      ctx.fillRect(0, 136, W, 2);
      drawText(bannerText, W / 2, 103, isWarn ? '#ffe066' : '#ff69c0', 2, 'center');
      drawText(bannerSub, W / 2, 122, '#ffffff', 1, 'center');
    }
  }

  function drawTitleScreen() {
    const previewStage = STAGES[selectedStageIdx] || STAGES[0];
    if (previewStage.autoScrollSpeed > 0) stageScrollOffset += 85 * 0.016;
    drawBackground(180 + Math.sin(time * 0.4) * 40, time, 0.25, previewStage.theme);

    // Title Banner
    drawText('HUNTRIX', W / 2, 12, '#ff45b5', 4, 'center', '#1b0736');
    drawText('HUNTRIX', W / 2, 10, '#ffe066', 4, 'center', null);
    drawText('K-POP DEMON HUNTERS  -  4-STAGE ARCADE EDITION', W / 2, 43, '#5ef6ff', 1, 'center');

    // Character Select Cards
    drawText('HUNTER [A/D]   |   START STAGE [W/S]', W / 2, 56, '#ffffff', 1, 'center');

    HUNTERS.forEach((h, idx) => {
      const sel = idx === selectedHunterIdx;
      const cx = 96 + idx * 144;
      const cy = 69;
      const cw = 124;
      const ch = 114;

      ctx.fillStyle = sel ? 'rgba(64, 22, 117, 0.92)' : 'rgba(24, 10, 48, 0.82)';
      ctx.fillRect(cx - cw / 2, cy, cw, ch);
      ctx.strokeStyle = sel ? (Math.floor(time * 8) % 2 === 0 ? '#ffe066' : '#5ef6ff') : '#5d3a96';
      ctx.lineWidth = sel ? 2 : 1;
      ctx.strokeRect(cx - cw / 2, cy, cw, ch);

      const pose = sel ? (Math.floor(time * 6) % 2 === 0 ? 'atk2' : 'walk0') : 'idle0';
      const img = SPRITES.hunters[h.id][pose];
      drawSprite(img, cx, cy + 62, 1, 32 / 72, 50 / 56);

      drawText(h.name, cx, cy + 68, sel ? '#ffe066' : '#ffffff', 2, 'center');
      drawText(h.title, cx, cy + 85, h.accent, 1, 'center');

      const drawStat = (lbl, val, sy, col) => {
        drawText(lbl, cx - 54, sy, '#c9b5ea', 1, 'left');
        ctx.fillStyle = '#140626';
        ctx.fillRect(cx - 26, sy + 1, 76, 4);
        ctx.fillStyle = col;
        ctx.fillRect(cx - 26, sy + 1, Math.round(76 * val), 4);
      };
      drawStat('PWR', h.power / 1.2, cy + 95, '#ff59b8');
      drawStat('SPD', h.speed / 145, cy + 104, '#5ef6ff');
    });

    // 4-Stage Selector Bar (Click or UP/DOWN)
    STAGES.forEach((st, idx) => {
      const sx = 34 + idx * 105;
      const sy = 191;
      const sw = 98;
      const sh = 20;
      const active = idx === selectedStageIdx;
      ctx.fillStyle = active ? '#4a1b7a' : 'rgba(20, 8, 42, 0.88)';
      ctx.fillRect(sx, sy, sw, sh);
      ctx.strokeStyle = active ? '#ffe066' : '#5d3a96';
      ctx.lineWidth = active ? 2 : 1;
      ctx.strokeRect(sx, sy, sw, sh);
      drawText(st.shortName, sx + sw / 2, sy + 7, active ? '#ffe066' : '#c9b5ea', 1, 'center');
    });

    // Blinking Press Start Prompt
    const blink = Math.floor(time * 3) % 2 === 0;
    ctx.fillStyle = 'rgba(22, 7, 44, 0.92)';
    ctx.fillRect(34, 218, 412, 38);
    ctx.fillStyle = '#5ef6ff';
    ctx.fillRect(34, 218, 412, 2);
    drawText(blink ? 'PRESS [ENTER] OR [J] TO START' : '>>> SHOWTIME! <<<', W / 2, 226, '#ffe066', 1, 'center');
    drawText('ROOFTOP | HONGDAE | SKY-EXPRESS | HONMOON THRONE', W / 2, 241, '#d8c2ff', 1, 'center');
  }

  function drawStageClearScreen() {
    ctx.fillStyle = 'rgba(14, 5, 30, 0.82)';
    ctx.fillRect(0, 0, W, H);

    const boxX = 64, boxY = 30, boxW = 352, boxH = 208;
    ctx.fillStyle = '#230b42';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = '#5ef6ff';
    ctx.lineWidth = 2;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    const st = getCurrentStage();
    const nextSt = STAGES[stageIndex + 1];
    drawText('STAGE ' + (stageIndex + 1) + ' CLEAR!', W / 2, 42, '#ffe066', 3, 'center', '#991b6b');
    drawText(st.name, W / 2, 70, '#5ef6ff', 1, 'center');

    drawText('CLEAR BONUS: +' + stageStats.clearBonus, 94, 92, '#ffffff', 1, 'left');
    drawText('HP BONUS:    +' + stageStats.hpBonus, 94, 105, '#5eff8f', 1, 'left');
    drawText('TOTAL SCORE: ' + score, 94, 118, '#ffe066', 1, 'left');

    // Stage Challenges Earned
    drawText('STAGE CHALLENGES:', 94, 136, '#ff85d0', 1, 'left');
    if (stageStats.challenges.length === 0) {
      drawText('- NONE THIS STAGE', 102, 149, '#bfa2db', 1, 'left');
    } else {
      stageStats.challenges.forEach((ch, idx) => {
        drawText('+ ' + ch.label + ' [+' + ch.bonus + ']', 102, 149 + idx * 12, '#5ef6ff', 1, 'left');
      });
    }

    if (nextSt) {
      drawText('NEXT: ' + nextSt.name, W / 2, 194, '#ff69c0', 1, 'center');
    }
    const blink = Math.floor(time * 3) % 2 === 0;
    drawText(blink ? 'PRESS [ENTER] OR [J] FOR NEXT STAGE' : '>>> +50% HP RESTORED <<<', W / 2, 212, '#ffe066', 1, 'center');
  }

  function drawOverlayScreen(isVictory) {
    ctx.fillStyle = 'rgba(14, 5, 30, 0.8)';
    ctx.fillRect(0, 0, W, H);

    const boxX = 72, boxY = 34, boxW = 336, boxH = 200;
    ctx.fillStyle = '#230b42';
    ctx.fillRect(boxX, boxY, boxW, boxH);
    ctx.strokeStyle = isVictory ? '#ffe066' : '#ff3b6b';
    ctx.lineWidth = 2;
    ctx.strokeRect(boxX, boxY, boxW, boxH);

    if (isVictory) {
      drawText('ALL STAGES CLEAR!', W / 2, 46, '#ffe066', 2, 'center', '#991b6b');
      drawText('SEOUL IS SAFE - HONMOON SEAL RESTORED!', W / 2, 70, '#5ef6ff', 1, 'center');

      // Show all 3 HUNTRIX idols celebrating!
      ['mira', 'rumi', 'zoey'].forEach((id, idx) => {
        const pose = Math.floor(time * 5 + idx) % 2 === 0 ? 'special' : 'idle0';
        drawSprite(SPRITES.hunters[id][pose], 168 + idx * 72, 136, 1, 32 / 72, 50 / 56);
      });

      const rank = score >= 32000 ? 'S' : score >= 20000 ? 'A' : score >= 11000 ? 'B' : 'C';
      drawText('SCORE: ' + score, 106, 152, '#ffffff', 1, 'left');
      drawText('MAX COMBO: ' + maxCombo, 106, 164, '#ff85d0', 1, 'left');
      drawText('DEMONS SLAIN: ' + enemiesDefeated, 106, 176, '#5ef6ff', 1, 'left');
      drawText('RANK', 330, 150, '#c9b5ea', 1, 'center');
      drawText(rank, 330, 164, '#ffe066', 3, 'center', '#b82575');
    } else {
      drawText('GAME OVER', W / 2, 62, '#ff3b6b', 3, 'center', '#140524');
      drawText('STOPPED ON ' + getCurrentStage().name, W / 2, 100, '#d8c2ff', 1, 'center');
      drawText('FINAL SCORE: ' + score, W / 2, 126, '#ffe066', 2, 'center');
      drawText('MAX COMBO: ' + maxCombo + '   DEMONS SLAIN: ' + enemiesDefeated, W / 2, 156, '#5ef6ff', 1, 'center');
    }

    if (scoreSyncStatus) {
      drawText(scoreSyncStatus, W / 2, 194, '#5ef6ff', 1, 'center');
    }

    const blink = Math.floor(time * 3) % 2 === 0;
    drawText(blink ? 'PRESS [ENTER] OR [J] TO PLAY AGAIN' : 'PRESS [K] FOR CHARACTER SELECT', W / 2, 212, '#ffe066', 1, 'center');
  }

  function drawPauseOverlay() {
    ctx.fillStyle = 'rgba(14, 5, 30, 0.65)';
    ctx.fillRect(0, 0, W, H);
    drawText('PAUSED', W / 2, 114, '#ffe066', 3, 'center');
    drawText('PRESS [P] OR [ESC] TO RESUME', W / 2, 148, '#5ef6ff', 1, 'center');
  }

  // =========================================================================
  // 12. MAIN GAME LOOP
  // =========================================================================
  let lastTs = 0;

  function step(ts) {
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    time += dt;

    if (gameState === 'title') {
      if (justPressed.left) {
        selectedHunterIdx = (selectedHunterIdx + HUNTERS.length - 1) % HUNTERS.length;
        sfx.playSelect();
      }
      if (justPressed.right) {
        selectedHunterIdx = (selectedHunterIdx + 1) % HUNTERS.length;
        sfx.playSelect();
      }
      if (justPressed.up) {
        selectedStageIdx = (selectedStageIdx + STAGES.length - 1) % STAGES.length;
        sfx.playSelect();
      }
      if (justPressed.down) {
        selectedStageIdx = (selectedStageIdx + 1) % STAGES.length;
        sfx.playSelect();
      }
      if (justPressed.confirm || justPressed.attack || justPressed.jump) {
        sfx.playConfirm();
        startNewGame();
      }
      drawTitleScreen();
    } else if (gameState === 'playing') {
      if (justPressed.pause) {
        gameState = 'paused';
      } else {
        if (bannerTimer > 0) bannerTimer -= dt;
        if (shakeTime > 0) shakeTime -= dt;
        if (encoreTimer > 0) encoreTimer -= dt;
        if (comboTimer > 0) {
          comboTimer -= dt;
          if (comboTimer <= 0) comboCount = 0;
        }

        if (hitstop > 0) {
          hitstop -= dt;
        } else {
          updatePlayer(dt);
          updateEnemies(dt);
          updateWaves(dt);
          updateWorldObjects(dt);
        }
      }
      drawWorld();
      drawHUD();
    } else if (gameState === 'paused') {
      if (justPressed.pause) gameState = 'playing';
      drawWorld();
      drawHUD();
      drawPauseOverlay();
    } else if (gameState === 'stageclear') {
      if (justPressed.confirm || justPressed.attack || justPressed.jump) {
        sfx.playConfirm();
        loadStage(stageIndex + 1, false);
      }
      drawWorld();
      drawHUD();
      drawStageClearScreen();
    } else if (gameState === 'victory' || gameState === 'gameover') {
      if (justPressed.confirm || justPressed.attack) {
        sfx.playConfirm();
        startNewGame();
      } else if (justPressed.jump) {
        sfx.playSelect();
        gameState = 'title';
      }
      drawWorld();
      drawHUD();
      drawOverlayScreen(gameState === 'victory');
    }

    clearJustPressed();
    requestAnimationFrame(step);
  }

  // Allow clicking directly on canvas in title / stageclear / end screens
  canvas.addEventListener('click', (e) => {
    sfx.init();
    const rect = canvas.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    const my = ((e.clientY - rect.top) / rect.height) * H;
    if (gameState === 'title') {
      if (my >= 68 && my <= 184) {
        const idx = Math.floor((mx - 24) / 144);
        if (idx >= 0 && idx < HUNTERS.length) {
          if (selectedHunterIdx === idx) {
            sfx.playConfirm();
            startNewGame();
          } else {
            selectedHunterIdx = idx;
            sfx.playSelect();
          }
        }
      } else if (my >= 188 && my <= 214) {
        const sIdx = Math.floor((mx - 34) / 105);
        if (sIdx >= 0 && sIdx < STAGES.length) {
          selectedStageIdx = sIdx;
          sfx.playSelect();
        }
      } else if (my > 215) {
        sfx.playConfirm();
        startNewGame();
      }
    } else if (gameState === 'stageclear') {
      sfx.playConfirm();
      loadStage(stageIndex + 1, false);
    } else if (gameState === 'victory' || gameState === 'gameover') {
      sfx.playConfirm();
      startNewGame();
    }
  });

  // Boot!
  initSprites();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
