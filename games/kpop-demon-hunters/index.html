<html lang="en">

<title>HUNTRIX: K-Pop Demon Hunters // 16-Bit Beat 'Em Up - RetroGames4.net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  html, body {
    width: 100%;
    min-height: 100%;
    background: #0d0618;
    color: #fff;
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }
  .top-nav {
    width: min(96vw, calc(82vh * 16 / 9));
    max-width: 1040px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    padding: 6px 12px;
    background: rgba(18, 12, 37, 0.92);
    border: 2px solid rgba(94, 246, 255, 0.45);
    border-radius: 8px;
    box-shadow: 0 0 14px rgba(255, 63, 164, 0.22), 0 0 12px rgba(94, 246, 255, 0.18);
    z-index: 20;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #5ef6ff;
    background: rgba(94, 246, 255, 0.14);
    border: 1px solid #5ef6ff;
    padding: 7px 11px;
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 0 8px rgba(94, 246, 255, 0.22);
    white-space: nowrap;
  }
  .back-btn:hover, .back-btn:active {
    background: #5ef6ff;
    color: #0c0517;
    box-shadow: 0 0 14px #5ef6ff;
    transform: scale(1.03);
  }
  .nav-title {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    color: #ffe066;
    text-shadow: 0 0 8px rgba(255, 224, 102, 0.65), 2px 2px #ff3fa4;
    letter-spacing: 0.8px;
    text-align: center;
  }
  .nav-actions {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #cabinet {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    width: 100%;
    min-height: 100vh;
    padding: 10px 8px 18px;
    background:
      radial-gradient(circle at 50% 25%, rgba(162, 46, 196, 0.25), transparent 60%),
      radial-gradient(circle at 50% 80%, rgba(45, 226, 230, 0.12), transparent 55%),
      #0c0517;
  }
  #cabinet.is-fullscreen {
    position: fixed;
    inset: 0;
    z-index: 9999;
    justify-content: center;
    padding: 8px;
    overflow: hidden;
  }
  #cabinet.is-fullscreen #screen-frame {
    width: min(98vw, calc(88vh * 16 / 9));
  }
  #screen-frame {
    position: relative;
    width: min(96vw, calc(80vh * 16 / 9));
    max-width: 1040px;
    aspect-ratio: 16 / 9;
    border: 3px solid #482078;
    box-shadow:
      0 0 0 2px #190930,
      0 0 28px rgba(255, 63, 164, 0.35),
      0 0 60px rgba(63, 245, 255, 0.16);
    background: #140826;
    overflow: hidden;
    border-radius: 4px;
  }
  canvas#game {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    background: #140826;
  }
  /* Subtle retro CRT scanline toggleable overlay */
  #crt-overlay {
    pointer-events: none;
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0, 0, 0, 0) 0px,
      rgba(0, 0, 0, 0) 2px,
      rgba(10, 0, 24, 0.16) 3px,
      rgba(10, 0, 24, 0.16) 4px
    );
    mix-blend-mode: multiply;
  }
  #controls-bar {
    margin-top: 8px;
    width: min(96vw, calc(82vh * 16 / 9));
    max-width: 1040px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 14px;
    font-size: 12px;
    color: #c9b5ea;
    letter-spacing: 0.4px;
    text-shadow: 0 1px 0 #090312;
  }
  .key {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid #7f4fd1;
    border-bottom-width: 2px;
    border-radius: 3px;
    background: #241046;
    color: #5ef6ff;
    font-weight: bold;
    font-size: 11px;
  }
  .key.pink { color: #ff69c0; border-color: #b83d8a; }
  .key.gold { color: #ffe066; border-color: #c79a26; }
  .bar-btn {
    cursor: pointer;
    background: #28124d;
    color: #f4e8ff;
    border: 1px solid #7f4fd1;
    border-radius: 3px;
    padding: 4px 9px;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;

  .bar-btn:hover { background: #3b1c70; border-color: #5ef6ff; color: #5ef6ff; }
  .mobile-controls {
    width: min(96vw, calc(82vh * 16 / 9));
    max-width: 1040px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    gap: 10px;
    flex-wrap: wrap;
  }
  .touch-group {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  .touch-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    min-width: 44px;
    min-height: 44px;
    padding: 8px 10px;
    background: rgba(24, 10, 48, 0.95);
    border: 2px solid #5ef6ff;
    color: #5ef6ff;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 8px rgba(94, 246, 255, 0.25);

  .touch-btn.action-jump { border-color: #5ef6ff; color: #5ef6ff; }
  .touch-btn.action-encore { border-color: #ffe066; color: #ffe066; box-shadow: 0 0 8px rgba(255, 224, 102, 0.28); }
  .touch-btn.action-pause { border-color: #9d6bff; color: #d8c2ff; }
  .touch-btn:active, .touch-btn.pressed {

<body>
<div id="cabinet">

      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> BACK TO VAULT

    </div>

</div>

<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. CONSTANTS & CANVAS SETUP (16-Bit Native 480x270)
  // =========================================================================
  const W = 480;
  const H = 270;
  const FLOOR_MIN_Y = 152;
  const FLOOR_MAX_Y = 248;
  const WORLD_WIDTH = 1200;
  const GRAVITY = 780;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;

  // UI toggles & fullscreen handler
  let crtEnabled = true;
  const cabinetEl = document.getElementById('cabinet');
  const crtEl = document.getElementById('crt-overlay');
  const btnCrt = document.getElementById('btn-crt');
  const btnMute = document.getElementById('btn-mute');
  const btnFullscreen = document.getElementById('btn-fullscreen');
  btnCrt.addEventListener('click', () => {
    crtEnabled = !crtEnabled;
    crtEl.style.display = crtEnabled ? 'block' : 'none';
    btnCrt.textContent = crtEnabled ? 'CRT: ON' : 'CRT: OFF';
  });

  function updateFullscreenIcon() {
    if (!btnFullscreen) return;
    const isFs = Boolean(document.fullscreenElement || cabinetEl.classList.contains('is-fullscreen'));
    btnFullscreen.innerHTML = isFs
      ? '<i class="fa-solid fa-compress" aria-hidden="true"></i>'
      : '<i class="fa-solid fa-expand" aria-hidden="true"></i>';
  }
  if (btnFullscreen) {
    btnFullscreen.addEventListener('click', () => {
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {
          cabinetEl.classList.remove('is-fullscreen');
          updateFullscreenIcon();
        });
      } else if (cabinetEl.requestFullscreen) {
        cabinetEl.requestFullscreen().catch(() => {
          cabinetEl.classList.toggle('is-fullscreen');
          updateFullscreenIcon();
        });
      } else {
        cabinetEl.classList.toggle('is-fullscreen');
        updateFullscreenIcon();
      }
    });
    document.addEventListener('fullscreenchange', updateFullscreenIcon);
  }

  // =========================================================================
  // 2. RETRO 16-BIT BITMAP PIXEL FONT (5x7 CRISP GLYPHS)
  // =========================================================================
  const FONT_5X7 = {
    'A': ['01110','10001','10001','11111','10001','10001','10001'],
    'B': ['11110','10001','10001','11110','10001','10001','11110'],
    'C': ['01110','10001','10000','10000','10000','10001','01110'],
    'D': ['11100','10010','10001','10001','10001','10010','11100'],
    'E': ['11111','10000','10000','11110','10000','10000','11111'],
    'F': ['11111','10000','10000','11110','10000','10000','10000'],
    'G': ['01110','10001','10000','10111','10001','10001','01110'],
    'H': ['10001','10001','10001','11111','10001','10001','10001'],
    'I': ['01110','00100','00100','00100','00100','00100','01110'],
    'J': ['00111','00010','00010','00010','10010','10010','01100'],
    'K': ['10001','10010','10100','11000','10100','10010','10001'],
    'L': ['10000','10000','10000','10000','10000','10000','11111'],
    'M': ['10001','11011','10101','10101','10001','10001','10001'],
    'N': ['10001','11001','10101','10011','10001','10001','10001'],
    'O': ['01110','10001','10001','10001','10001','10001','01110'],
    'P': ['11110','10001','10001','11110','10000','10000','10000'],
    'Q': ['01110','10001','10001','10001','10101','10010','01101'],
    'R': ['11110','10001','10001','11110','10100','10010','10001'],
    'S': ['01111','10000','10000','01110','00001','00001','11110'],
    'T': ['11111','00100','00100','00100','00100','00100','00100'],
    'U': ['10001','10001','10001','10001','10001','10001','01110'],
    'V': ['10001','10001','10001','10001','10001','01010','00100'],
    'W': ['10001','10001','10001','10101','10101','11011','10001'],
    'X': ['10001','10001','01010','00100','01010','10001','10001'],
    'Y': ['10001','10001','01010','00100','00100','00100','00100'],
    'Z': ['11111','00001','00010','00100','01000','10000','11111'],
    '0': ['01110','10011','10101','10101','11001','10001','01110'],
    '1': ['00100','01100','00100','00100','00100','00100','01110'],
    '2': ['01110','10001','00001','00110','01000','10000','11111'],
    '3': ['11110','00001','00001','01110','00001','00001','11110'],
    '4': ['00010','00110','01010','10010','11111','00010','00010'],
    '5': ['11111','10000','11110','00001','00001','10001','01110'],
    '6': ['01110','10000','11110','10001','10001','10001','01110'],
    '7': ['11111','00001','00010','00100','01000','01000','01000'],
    '8': ['01110','10001','10001','01110','10001','10001','01110'],
    '9': ['01110','10001','10001','01111','00001','00001','01110'],
    '!': ['00100','00100','00100','00100','00100','00000','00100'],
    '?': ['01110','10001','00010','00100','00100','00000','00100'],
    ':': ['00000','00100','00100','00000','00100','00100','00000'],
    '.': ['00000','00000','00000','00000','00000','01100','01100'],
    ',': ['00000','00000','00000','00000','00100','00100','01000'],
    '-': ['00000','00000','00000','11111','00000','00000','00000'],
    '+': ['00000','00100','00100','11111','00100','00100','00000'],
    '/': ['00001','00010','00010','00100','01000','01000','10000'],
    '\'': ['00100','00100','01000','00000','00000','00000','00000'],
    '[': ['01110','01000','01000','01000','01000','01000','01110'],
    ']': ['01110','00010','00010','00010','00010','00010','01110'],
    '>': ['10000','01000','00100','00010','00100','01000','10000'],
    '<': ['00001','00010','00100','01000','00100','00010','00001'],
    '%': ['11001','11010','00010','00100','01000','01011','10011'],
    '|': ['00100','00100','00100','00100','00100','00100','00100'],
    ' ': ['00000','00000','00000','00000','00000','00000','00000'],
  };

  function drawText(text, x, y, color = '#ffffff', scale = 1, align = 'left', shadow = '#18082a') {
    const str = String(text).toUpperCase();
    const charW = 6 * scale;
    const totalW = str.length * charW - scale;
    let startX = Math.round(x);
    if (align === 'center') startX = Math.round(x - totalW / 2);
    else if (align === 'right') startX = Math.round(x - totalW);
    const startY = Math.round(y);

    const drawPass = (ox, oy, col) => {
      ctx.fillStyle = col;
      for (let i = 0; i < str.length; i++) {
        const glyph = FONT_5X7[str[i]] || FONT_5X7[' '];
        const gx = startX + i * charW + ox;
        for (let r = 0; r < 7; r++) {
          const row = glyph[r];
          for (let c = 0; c < 5; c++) {
            if (row[c] === '1') {
              ctx.fillRect(gx + c * scale, startY + r * scale + oy, scale, scale);
            }
          }
        }
      }
    };
    if (shadow) drawPass(scale, scale, shadow);
    drawPass(0, 0, color);
  }

  // =========================================================================
  // 3. 16-BIT WEB AUDIO CHIPTUNE SYNTH & SFX ENGINE
  // =========================================================================
  class RetroAudio {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.bgmTimer = null;
      this.bgmStep = 0;
      this.mode = 'none'; // 'stage', 'boss', 'victory'
    }
    init() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      } catch (e) {}
    }
    toggleMute() {
      this.muted = !this.muted;
      btnMute.textContent = this.muted ? 'SFX: OFF [M]' : 'SFX: ON [M]';
    }
    tone(freq, dur, type = 'square', vol = 0.08, slideTo = null, delay = 0) {
      if (this.muted || !this.ctx) return;
      try {
        const t0 = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.01);
      } catch (e) {}
    }
    noise(dur, vol = 0.09, delay = 0, hp = 500) {
      if (this.muted || !this.ctx) return;
      try {
        const t0 = this.ctx.currentTime + delay;
        const bufSize = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'highpass';
        filter.frequency.value = hp;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, t0);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
        src.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        src.start(t0);
      } catch (e) {}
    }
    playSwing(step) {
      const f = step === 3 ? 520 : step === 2 ? 440 : 360;
      this.tone(f, 0.09, 'triangle', 0.09, 130);
      this.noise(0.06, 0.05, 0, 1400);
    }
    playHit(heavy = false) {
      this.noise(heavy ? 0.14 : 0.08, heavy ? 0.14 : 0.09, 0, heavy ? 220 : 600);
      this.tone(heavy ? 180 : 250, heavy ? 0.14 : 0.07, 'square', heavy ? 0.11 : 0.07, 55);
      if (heavy) this.tone(420, 0.11, 'sawtooth', 0.07, 110, 0.02);
    }
    playJump() {
      this.tone(240, 0.12, 'square', 0.06, 560);
    }
    playHurt() {
      this.tone(190, 0.16, 'sawtooth', 0.1, 70);
      this.noise(0.12, 0.1, 0, 300);
    }
    playPickup() {
      this.tone(523, 0.07, 'square', 0.08, null, 0);
      this.tone(659, 0.07, 'square', 0.08, null, 0.07);
      this.tone(784, 0.09, 'square', 0.08, null, 0.14);
      this.tone(1046, 0.14, 'square', 0.09, null, 0.21);
    }
    playEncoreReady() {
      const notes = [523, 659, 784, 1046];
      notes.forEach((n, i) => this.tone(n, 0.1, 'triangle', 0.08, null, i * 0.05));
    }
    playEncoreSpecial() {
      // K-pop synth fanfare + massive Honmoon blast
      const arp = [523, 659, 784, 987, 1046, 1318, 1568];
      arp.forEach((n, i) => this.tone(n, 0.14, 'square', 0.08, null, i * 0.045));
      this.noise(0.45, 0.15, 0.3, 180);
      this.tone(160, 0.5, 'sawtooth', 0.12, 42, 0.3);
      this.tone(880, 0.3, 'triangle', 0.09, 220, 0.65);
      this.noise(0.35, 0.13, 0.72, 240);
    }
    playBossWarning() {
      for (let i = 0; i < 3; i++) {
        this.tone(620, 0.16, 'sawtooth', 0.08, 360, i * 0.28);
      }
    }
    playSelect() {
      this.tone(660, 0.06, 'square', 0.07);
    }
    playConfirm() {
      this.tone(523, 0.07, 'square', 0.08);
      this.tone(784, 0.12, 'square', 0.09, null, 0.07);
    }
    playKo() {
      this.noise(0.2, 0.12, 0, 200);
      this.tone(300, 0.22, 'sawtooth', 0.09, 55);
    }
    startBGM(mode) {
      if (this.mode === mode && this.bgmTimer) return;
      this.stopBGM();
      this.mode = mode;
      this.bgmStep = 0;
      const bpm = mode === 'boss' ? 148 : 132;
      const stepMs = (60 / bpm / 2) * 1000;

      // Upbeat K-pop electro-arcade synth lines (Hz)
      const stageBass = [110, 110, 220, 110, 130.8, 130.8, 146.8, 164.8, 110, 110, 220, 110, 174.6, 164.8, 146.8, 130.8];
      const stageLead = [440, 0, 523, 587, 659, 0, 587, 523, 440, 0, 659, 784, 880, 784, 659, 587];
      const bossBass  = [98, 98, 196, 98, 116.5, 98, 130.8, 146.8, 98, 98, 196, 146.8, 130.8, 116.5, 110, 98];
      const bossLead  = [392, 466, 587, 466, 622, 587, 466, 392, 784, 0, 698, 622, 587, 466, 523, 466];

      this.bgmTimer = setInterval(() => {
        if (this.muted || !this.ctx || this.ctx.state !== 'running') return;
        const s = this.bgmStep % 16;
        const bass = mode === 'boss' ? bossBass[s] : stageBass[s];
        const lead = mode === 'boss' ? bossLead[s] : stageLead[s];
        this.tone(bass, 0.11, 'triangle', 0.055);
        if (lead > 0) this.tone(lead, 0.09, 'square', 0.028);
        if (s % 4 === 0) this.tone(95, 0.07, 'sine', 0.07, 36); // Kick
        if (s % 4 === 2) this.noise(0.05, 0.032, 0, 2200);       // Snare/hat
        this.bgmStep++;
      }, stepMs);
    }
    stopBGM() {
      if (this.bgmTimer) {
        clearInterval(this.bgmTimer);
        this.bgmTimer = null;
      }
      this.mode = 'none';
    }

  // =========================================================================
  // 4. PROCEDURAL 16-BIT PIXEL ART SPRITE ENGINE (WITH 1PX OUTLINE BAKER)
  // =========================================================================
  function createOffscreen(w, h) {
    const c = document.createElement('canvas');
    c.width = w;
    c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    return { c, g };
  }

  // Adds authentic 1px dark 16-bit outline around non-transparent pixels
  function applyOutline(srcCanvas, outlineColor = '#1a0a2e') {
    const w = srcCanvas.width;
    const h = srcCanvas.height;
    const { c, g } = createOffscreen(w, h);
    const sctx = srcCanvas.getContext('2d');
    const img = sctx.getImageData(0, 0, w, h).data;
    g.fillStyle = outlineColor;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const a = img[(y * w + x) * 4 + 3];
        if (a > 20) continue;
        // Check 4 cardinal neighbors
        const n1 = y > 0     && img[((y - 1) * w + x) * 4 + 3] > 20;
        const n2 = y < h - 1 && img[((y + 1) * w + x) * 4 + 3] > 20;
        const n3 = x > 0     && img[(y * w + (x - 1)) * 4 + 3] > 20;
        const n4 = x < w - 1 && img[(y * w + (x + 1)) * 4 + 3] > 20;
        if (n1 || n2 || n3 || n4) g.fillRect(x, y, 1, 1);
      }
    }
    g.drawImage(srcCanvas, 0, 0);
    return c;
  }

  function makeFlashVersion(srcCanvas, tint = '#ffffff') {
    const { c, g } = createOffscreen(srcCanvas.width, srcCanvas.height);
    g.drawImage(srcCanvas, 0, 0);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = tint;
    g.fillRect(0, 0, c.width, c.height);
    return c;
  }

  function bakePixelGrid(rows, palette, scale = 1, outline = null) {
    const h = rows.length * scale;
    const w = rows[0].length * scale;
    const { c, g } = createOffscreen(w + (outline ? 2 : 0), h + (outline ? 2 : 0));
    const pad = outline ? 1 : 0;
    for (let y = 0; y < rows.length; y++) {
      for (let x = 0; x < rows[y].length; x++) {
        const ch = rows[y][x];
        if (ch !== '.' && palette[ch]) {
          g.fillStyle = palette[ch];
          g.fillRect(pad + x * scale, pad + y * scale, scale, scale);
        }
      }
    }
    return outline ? applyOutline(c, outline) : c;
  }

  // Draw crisp pixel line on offscreen sprite context
  function pxLine(g, x0, y0, x1, y1, color, thick = 1) {
    g.fillStyle = color;
    x0 = Math.round(x0); y0 = Math.round(y0);
    x1 = Math.round(x1); y1 = Math.round(y1);
    const dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
    const dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
    let err = dx + dy;
    while (true) {
      g.fillRect(x0, y0, thick, thick);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 >= dy) { err += dy; x0 += sx; }
      if (e2 <= dx) { err += dx; y0 += sy; }
    }
  }

      r(bx - 8 + sOff, by + 40, 6, 11, '#180a2b');
      r(bx + 3 - sOff, by + 40, 6, 11, '#180a2b');
      // Broad shoulders & rib chest armor
      r(bx - 10, by + 13, 21, 14, p.cloth);
      r(bx - 6, by + 15, 13, 10, p.skin);
      r(bx - 4, by + 17, 9, 2, p.accent);
      r(bx - 3, by + 21, 7, 2, p.accent);
      // Head
      r(bx - 5, by + 2, 11, 11, p.skin);
      r(bx - 5, by + 10, 11, 3, p.shade);
      // Glowing crimson eyes + fanged grin
      r(bx + 0, by + 6, 2, 2, p.eye);
      r(bx + 4, by + 6, 2, 2, p.eye);
      r(bx + 0, by + 10, 5, 2, '#1a0624');
      r(bx + 1, by + 10, 1, 1, '#ffffff');
      r(bx + 4, by + 10, 1, 1, '#ffffff');
      // Iconic Traditional Korean Wide-Brimmed GAT Hat (with glowing trim!)
      r(bx - 15, by + 1, 31, 3, p.horn);
      r(bx - 14, by + 2, 29, 1, p.accent);
      r(bx - 6, by - 9, 13, 11, p.horn);
      r(bx - 5, by - 7, 11, 2, p.cloth2);
      // Demon horns poking through hat
      pxLine(g, bx - 4, by - 7, bx - 9, by - 14, '#ff4588', 2);
      pxLine(g, bx + 5, by - 7, bx + 10, by - 14, '#ff4588', 2);

      // Arms & Attack Claw/Spirit Blade
      if (pose === 'windup') {
        pxLine(g, bx - 6, by + 16, bx - 18, by + 8, p.skin, 4);
        pxLine(g, bx + 6, by + 16, bx - 2, by + 6, p.skin, 4);
        r(bx - 20, by + 4, 6, 6, '#ff42b3');
      } else if (pose === 'atk') {
        pxLine(g, bx + 7, by + 17, bx + 28, by + 20, p.skin, 4);
        pxLine(g, bx + 20, by + 8, bx + 36, by + 22, '#ff2e93', 4);
        pxLine(g, bx + 36, by + 22, bx + 22, by + 36, '#ff2e93', 4);
        pxLine(g, bx + 23, by + 11, bx + 33, by + 22, '#ffe066', 2);
      } else if (pose === 'slam') {
        pxLine(g, bx - 8, by + 16, bx - 16, by + 32, p.skin, 4);
        pxLine(g, bx + 8, by + 16, bx + 18, by + 32, p.skin, 4);
        r(bx - 18, by + 32, 38, 4, '#ff3399');
      } else {
        pxLine(g, bx - 8, by + 17, bx - 14, by + 29, p.skin, 3);
        pxLine(g, bx + 8, by + 17, bx + 18, by + 25, p.skin, 4);
        r(bx + 17, by + 24, 5, 4, p.accent);
      }
      return applyOutline(c, '#120521');
    }

    // Standard Demons (Anchor feet at 32, 50)
    const bx = pose === 'atk' ? 35 : pose === 'hurt' ? 27 : 31;
    const by = 18 + bob;
    const stride = pose === 'walk0' ? 5 : pose === 'walk1' ? -5 : 0;

    // Legs
    pxLine(g, bx - 3, by + 21, bx - 6 + stride, 49, p.shade, 3);
    pxLine(g, bx + 3, by + 21, bx + 5 - stride, 49, p.skin, 3);

    // Torso
    r(bx - 5, by + 10, 11, 13, p.cloth);
    r(bx - 4, by + 12, 9, 8, p.cloth2);
    // Glowing demonic sigil on chest
    r(bx - 1, by + 14, 4, 3, p.accent);

    // Head
    r(bx - 4, by, 10, 10, p.skin);
    r(bx - 4, by + 7, 10, 3, p.shade);
    // Glowing eyes
    r(bx + 1, by + 3, 2, 2, p.eye);
    r(bx + 4, by + 3, 2, 2, p.eye);
    // Open fanged mouth
    r(bx + 1, by + 7, 5, 2, '#1f072e');
    r(bx + 2, by + 7, 1, 1, '#ffffff');
    r(bx + 5, by + 7, 1, 1, '#ffffff');

    // Type-specific headgear / features
    if (type === 'imp') {
      pxLine(g, bx - 2, by, bx - 5, by - 5, p.horn, 2);
      pxLine(g, bx + 3, by, bx + 6, by - 5, p.horn, 2);
    } else if (type === 'banshee') {
      // Wild electric-blue hair
      r(bx - 8, by - 1, 6, 12, '#1a2f7a');
      r(bx - 10, by + 3, 6, 10, '#2a56ba');
      r(bx - 5, by - 2, 9, 3, '#3875e0');
    } else if (type === 'gat') {
      // Traditional Korean Gat hat!
      r(bx - 10, by - 1, 22, 2, '#190b2e');
      r(bx - 9, by, 20, 1, p.accent);
      r(bx - 4, by - 7, 10, 6, '#190b2e');
    }

    // Arms & Claws
    if (pose === 'windup') {
      pxLine(g, bx - 2, by + 12, bx - 11, by + 5, p.skin, 3);
      r(bx - 13, by + 3, 4, 4, p.eye);
    } else if (pose === 'atk') {
      pxLine(g, bx + 4, by + 12, bx + 20, by + 12, p.skin, 3);
      pxLine(g, bx + 16, by + 6, bx + 25, by + 14, p.accent, 3);
      pxLine(g, bx + 18, by + 8, bx + 24, by + 14, '#ffffff', 1);
    } else if (pose === 'hurt') {
      pxLine(g, bx - 4, by + 12, bx - 10, by + 7, p.skin, 3);
      pxLine(g, bx + 4, by + 12, bx + 10, by + 8, p.skin, 3);
    } else {
      pxLine(g, bx - 4, by + 12, bx - 8, by + 20, p.shade, 3);
      pxLine(g, bx + 4, by + 12, bx + 13, by + 15, p.skin, 3);
      r(bx + 12, by + 14, 3, 3, p.accent);
    }

    return applyOutline(c, '#160726');
  }

  function initSprites() {
    const hunterPoses = ['idle0','idle1','walk0','walk1','walk2','walk3','jump','jumpkick','atk1','atk2','atk3','special','hurt'];
    for (const h of HUNTERS) {
      SPRITES.hunters[h.id] = {};
      for (const pose of hunterPoses) {
        const sp = bakeHunterPose(h, pose);
        SPRITES.hunters[h.id][pose] = sp;
        SPRITES.hunters[h.id][pose + '_flash'] = makeFlashVersion(sp, '#ffffff');
      }
      SPRITES.portraits[h.id] = bakePortrait(h);

    const enemyTypes = ['imp', 'banshee', 'gat', 'boss'];

      for (const p of poses) {
        const sp = bakeEnemyPose(t, p);
        SPRITES.enemies[t][p] = sp;
        SPRITES.enemies[t][p + '_flash'] = makeFlashVersion(sp, '#ffffff');

      'kwwwwwwwwwwk',
      'kpyyyyyyyypk',

    ], { k: '#1e1633', w: '#ffffff', o: '#ff8a3d', r: '#ff3b6b', g: '#4ee674', y: '#ffe066', p: '#ffd24c' }, 2, '#18082b');

    SPRITES.items.ramyeon = bakePixelGrid([

  function drawSprite(img, x, y, facing = 1, anchorX = 0.5, anchorY = 1) {
    const drawX = Math.round(x);
    const drawY = Math.round(y);
    ctx.save();
    ctx.translate(drawX, drawY);
    if (facing < 0) ctx.scale(-1, 1);
    ctx.drawImage(img, -Math.round(img.width * anchorX), -Math.round(img.height * anchorY));
    ctx.restore();
  }

  // =========================================================================
  // 5. BACKGROUND RENDERER (SUNSET SEOUL ROOFTOP + HUNTRIX BILLBOARD)
  // =========================================================================
  // Pre-generate deterministic stars & skyline buildings
  const STARS = Array.from({ length: 42 }, (_, i) => ({
    x: (i * 73 + 17) % W,
    y: (i * 29 + 11) % 72,
    phase: i * 0.7,
    big: i % 7 === 0,
  }));
  const SKYLINE_FAR = Array.from({ length: 28 }, (_, i) => ({
    x: i * 32,
    w: 22 + (i * 13) % 18,
    h: 22 + (i * 19) % 42,
    neon: i % 5 === 0 ? '#ff59b8' : i % 4 === 0 ? '#5ef6ff' : null,
  }));
  const SKYLINE_NEAR = Array.from({ length: 24 }, (_, i) => ({
    x: i * 48,
    w: 32 + (i * 11) % 22,
    h: 28 + (i * 23) % 40,
    winColor: i % 3 === 0 ? '#ffe066' : i % 3 === 1 ? '#5ef6ff' : '#ff7acc',
  }));

  function drawBackground(camX, time, encoreIntensity) {
    // 1) 16-bit Banded Sunset Sky
    const bands = [
      { y: 0,   h: 26, c: '#23124d' },
      { y: 26,  h: 22, c: '#3f1c73' },
      { y: 48,  h: 20, c: '#6e288c' },
      { y: 68,  h: 18, c: '#ad3a91' },
      { y: 86,  h: 16, c: '#e35b8e' },
      { y: 102, h: 16, c: '#ff9075' },
      { y: 118, h: 16, c: '#ffd180' },
    ];
    for (const b of bands) {
      ctx.fillStyle = b.c;
      ctx.fillRect(0, b.y, W, b.h);
      // 16-bit checkerboard dither seam
      ctx.fillStyle = b.c;
      for (let x = 0; x < W; x += 4) {
        ctx.fillRect(x, b.y - 2, 2, 2);
      }
    }

    // 2) Twinkling Stars & Crescent Moon
    for (const s of STARS) {
      const blink = Math.sin(time * 3 + s.phase) > 0.2;
      ctx.fillStyle = blink ? '#fff5c2' : '#d6a8ff';
      ctx.fillRect(s.x, s.y, s.big ? 2 : 1, s.big ? 2 : 1);
      if (s.big && blink) {
        ctx.fillRect(s.x - 1, s.y, 4, 1);
        ctx.fillRect(s.x, s.y - 1, 1, 4);
      }
    }
    // Crescent moon (crisp pixel crescent, top right)
    const moonRows = [
      '....1111..',
      '..11111...',
      '.1111.....',
      '1111......',
      '1111......',
      '1111......',
      '.1111.....',
      '..11111...',
      '....1111..',
    ];
    ctx.fillStyle = '#fff1b8';
    for (let mr = 0; mr < moonRows.length; mr++) {
      for (let mc = 0; mc < moonRows[mr].length; mc++) {
        if (moonRows[mr][mc] === '1') ctx.fillRect(432 + mc * 2, 46 + mr * 2, 2, 2);
      }
    }

    // 3) Far Parallax: Namsan Mountain + Seoul Tower
    const farX = Math.round(camX * 0.16);
    ctx.fillStyle = '#572275';
    for (let x = -40; x < W + 40; x += 4) {
      const ridge = Math.sin((x + farX) * 0.015) * 12 + Math.cos((x + farX) * 0.032) * 5;
      ctx.fillRect(x, Math.round(112 + ridge), 4, 30);
    }
    // Namsan Seoul Tower silhouette
    const tx = Math.round(410 - camX * 0.14);
    ctx.fillStyle = '#471b6b';
    ctx.fillRect(tx - 2, 74, 4, 48);
    ctx.fillRect(tx - 7, 82, 14, 7);
    ctx.fillRect(tx - 5, 80, 10, 2);
    ctx.fillRect(tx - 1, 58, 2, 18);
    // Tower neon beacon
    ctx.fillStyle = Math.sin(time * 6) > 0 ? '#ff3b8d' : '#ff99cc';
    ctx.fillRect(tx - 1, 56, 2, 2);
    ctx.fillStyle = '#5ef6ff';
    ctx.fillRect(tx - 6, 85, 12, 1);

    // 4) Mid Parallax: Seoul Neon Skyline
    const midX = Math.round(camX * 0.35);
    for (const b of SKYLINE_FAR) {
      const sx = Math.round(b.x - midX);
      if (sx + b.w < 0 || sx > W) continue;
      const sy = 132 - b.h;
      ctx.fillStyle = '#36185e';
      ctx.fillRect(sx, sy, b.w, b.h);
      ctx.fillStyle = '#4a237d';
      ctx.fillRect(sx, sy, b.w, 2);
      if (b.neon) {
        ctx.fillStyle = b.neon;
        ctx.fillRect(sx + 3, sy + 4, b.w - 6, 2);
      }
    }
    const nearX = Math.round(camX * 0.55);
    for (const b of SKYLINE_NEAR) {
      const sx = Math.round(b.x - nearX);
      if (sx + b.w < 0 || sx > W) continue;
      const sy = 136 - b.h;
      ctx.fillStyle = '#241145';
      ctx.fillRect(sx, sy, b.w, b.h);
      ctx.fillStyle = b.winColor;
      for (let wy = sy + 5; wy < 128; wy += 6) {
        for (let wx = sx + 4; wx < sx + b.w - 4; wx += 6) {
          if (((wx + wy) % 3) !== 0) ctx.fillRect(wx, wy, 3, 3);
        }
      }
    }

    // 5) World-Space Rooftop Setpieces (1:1 Scroll)
    const wx = (worldX) => Math.round(worldX - camX);

    // Zone 1 Prop: Neon "K-BEAT" Rooftop Sign
    const s1 = wx(140);
    if (s1 > -120 && s1 < W + 40) {
      ctx.fillStyle = '#1b0b33';
      ctx.fillRect(s1 + 8, 96, 4, 38);
      ctx.fillRect(s1 + 78, 96, 4, 38);
      ctx.fillStyle = '#2b1252';
      ctx.fillRect(s1, 66, 90, 34);
      ctx.fillStyle = '#5ef6ff';
      ctx.fillRect(s1, 66, 90, 2);
      ctx.fillRect(s1, 98, 90, 2);
      ctx.fillRect(s1, 66, 2, 34);
      ctx.fillRect(s1 + 88, 66, 2, 34);
      drawText('SEOUL', s1 + 45, 73, '#ff61c3', 1, 'center');
      drawText('LIVE STAGE', s1 + 45, 85, '#ffe066', 1, 'center');
    }

    // Zone 2 Prop: Giant Concert Speaker Stacks & Light Rig
    const s2 = wx(520);
    if (s2 > -140 && s2 < W + 40) {
      // Left & right speaker towers
      for (const ox of [0, 128]) {
        const px = s2 + ox;
        ctx.fillStyle = '#1c0d36';
        ctx.fillRect(px, 76, 30, 58);
        ctx.fillStyle = '#381e66';
        ctx.fillRect(px + 2, 78, 26, 54);
        // Woofer cones pulsing to beat!
        const pulse = Math.sin(time * 14) > 0.3 ? 1 : 0;
        for (const cy of [92, 114]) {
          ctx.fillStyle = '#120724';
          ctx.fillRect(px + 6 - pulse, cy - 8 - pulse, 18 + pulse * 2, 16 + pulse * 2);
          ctx.fillStyle = '#ff4da6';
          ctx.fillRect(px + 10, cy - 4, 10, 8);
          ctx.fillStyle = '#5ef6ff';
          ctx.fillRect(px + 13, cy - 1, 4, 2);
        }
      }
      // Overhead light truss
      ctx.fillStyle = '#3b2466';
      ctx.fillRect(s2 + 24, 72, 110, 6);
      for (let i = 0; i < 5; i++) {
        const lx = s2 + 34 + i * 22;
        const col = (Math.floor(time * 4) + i) % 2 === 0 ? '#5ef6ff' : '#ff4da6';
        ctx.fillStyle = col;
        ctx.fillRect(lx, 78, 6, 4);
      }
    }

    // Zone 3 Prop (Mini-Boss Stage): GIANT HUNTRIX BILLBOARD!
    const sb = wx(890);
    if (sb > -170 && sb < W + 40) {
      // Support struts
      ctx.fillStyle = '#1d0d36';
      ctx.fillRect(sb + 14, 114, 6, 22);
      ctx.fillRect(sb + 124, 114, 6, 22);
      // Billboard frame
      ctx.fillStyle = '#32145c';
      ctx.fillRect(sb, 48, 144, 70);
      ctx.fillStyle = '#e8c4ff';
      ctx.fillRect(sb + 4, 52, 136, 62);
      ctx.fillStyle = '#ffd9f5';
      ctx.fillRect(sb + 4, 52, 136, 24);
      // Animated marquee bulbs
      for (let i = 0; i < 18; i++) {
        const on = (i + Math.floor(time * 8)) % 2 === 0;
        ctx.fillStyle = on ? '#5ef6ff' : '#ff45b5';
        ctx.fillRect(sb + 2 + i * 8, 49, 4, 2);
        ctx.fillRect(sb + 2 + i * 8, 115, 4, 2);
      }
      drawText('HUNTRIX', sb + 72, 56, '#7a1fa2', 2, 'center', '#ffffff');
      // Mini portraits of all 3 HUNTRIX idols on the billboard!
      const order = ['mira', 'rumi', 'zoey'];
      order.forEach((id, idx) => {
        const pImg = SPRITES.portraits[id];
        if (pImg) {
          ctx.drawImage(pImg, sb + 18 + idx * 42, 78, 28, 28);
          ctx.strokeStyle = '#ff4da6';
          ctx.strokeRect(sb + 17.5 + idx * 42, 77.5, 29, 29);
        }
      });
    }

    // 6) Rooftop Parapet & Safety Railing (y = 126..148)
    ctx.fillStyle = '#392866';
    ctx.fillRect(0, 134, W, 14);
    ctx.fillStyle = '#5a4396';
    ctx.fillRect(0, 134, W, 2);
    ctx.fillStyle = '#241747';
    ctx.fillRect(0, 145, W, 3);
    // Railing posts & top bar
    ctx.fillStyle = '#6f59ad';
    ctx.fillRect(0, 126, W, 2);
    ctx.fillStyle = '#4c3880';
    ctx.fillRect(0, 130, W, 1);
    const railOffset = -(Math.round(camX) % 32);
    for (let rx = railOffset; rx < W + 32; rx += 32) {
      ctx.fillStyle = '#5e4799';
      ctx.fillRect(rx, 126, 3, 18);
      ctx.fillStyle = '#8b75c9';
      ctx.fillRect(rx, 126, 1, 18);
    }

    // 7) Playable 2.5D Rooftop Concrete Floor (y = 148..258)
    ctx.fillStyle = '#cbb2e3';
    ctx.fillRect(0, 148, W, 110);
    // Subtle 16-bit depth gradient bands on floor
    ctx.fillStyle = '#bfa2db';
    ctx.fillRect(0, 148, W, 18);
    ctx.fillStyle = '#d4bfe8';
    ctx.fillRect(0, 186, W, 36);
    ctx.fillStyle = '#b99cd4';
    ctx.fillRect(0, 222, W, 36);

    // Concrete tile seam lines (scrolling perspective)
    ctx.fillStyle = '#a483c4';
    ctx.fillRect(0, 174, W, 1);
    ctx.fillRect(0, 206, W, 1);
    ctx.fillRect(0, 238, W, 1);
    const tileOff = -(Math.round(camX) % 64);
    for (let tx2 = tileOff; tx2 < W + 64; tx2 += 64) {
      ctx.fillStyle = '#a483c4';
      ctx.fillRect(tx2, 148, 1, 110);
      // Decorative neon stage tape chevron every 128px
      if (Math.floor((tx2 + Math.round(camX)) / 64) % 2 === 0) {
        ctx.fillStyle = '#ff85c8';
        ctx.fillRect(tx2 + 24, 198, 12, 2);
        ctx.fillStyle = '#5ef6ff';
        ctx.fillRect(tx2 + 26, 201, 12, 2);
      }
    }

    // Glowing Honmoon protective seal waves during high combo or Encore!
    if (encoreIntensity > 0.01) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.65, encoreIntensity);
      ctx.fillStyle = '#180533';
      ctx.fillRect(0, 0, W, H);
      // Concert spotlight beams!
      for (let i = 0; i < 4; i++) {
        const bx = 60 + i * 120 + Math.sin(time * 5 + i) * 30;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(94,246,255,0.22)' : 'rgba(255,69,181,0.22)';
        ctx.beginPath();
        ctx.moveTo(bx, 0);
        ctx.lineTo(bx - 55, H);
        ctx.lineTo(bx + 55, H);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawForegroundParapet(camX) {

    for (let fx = fgOff; fx < W + 160; fx += 160) {
      ctx.fillStyle = '#1a0c33';
      ctx.fillRect(fx + 20, 248, 52, 22);
      ctx.fillStyle = '#331d59';
      ctx.fillRect(fx + 22, 250, 48, 2);
      ctx.fillStyle = '#110621';
      ctx.fillRect(fx + 28, 254, 18, 12);
      ctx.fillRect(fx + 52, 254, 12, 12);
    }
  }

  // =========================================================================
  // 6. INPUT MANAGER
  // =========================================================================
  const keys = {};
  const justPressed = {};

  function mapKey(code) {
    switch (code) {
      case 'ArrowLeft':  case 'KeyA': return 'left';
      case 'ArrowRight': case 'KeyD': return 'right';
      case 'ArrowUp':    case 'KeyW': return 'up';
      case 'ArrowDown':  case 'KeyS': return 'down';
      case 'KeyJ':       case 'KeyZ': return 'attack';
      case 'KeyK':       case 'KeyX': case 'Space': return 'jump';
      case 'KeyL':       case 'KeyC': case 'KeyE': case 'ShiftLeft': case 'ShiftRight': return 'special';
      case 'Enter': return 'confirm';
      case 'KeyP':  case 'Escape': return 'pause';
      case 'KeyM':  return 'mute';
      default: return null;
    }
  }

  window.addEventListener('keydown', (e) => {
    const act = mapKey(e.code);
    if (!act) return;
    e.preventDefault();
    sfx.init();
    if (act === 'mute') { sfx.toggleMute(); return; }
    if (!keys[act]) justPressed[act] = true;
    keys[act] = true;
  });
  window.addEventListener('keyup', (e) => {
    const act = mapKey(e.code);
    if (!act) return;
    keys[act] = false;
  });
  window.addEventListener('blur', () => {
    for (const k in keys) keys[k] = false;
  });

  // Bind mobile/touch arcade buttons directly to action inputs
  function bindTouchAction(btnId, act) {
    const el = document.getElementById(btnId);
    if (!el) return;
    const press = (e) => {
      e.preventDefault();
      sfx.init();
      el.classList.add('pressed');
      if (!keys[act]) justPressed[act] = true;
      keys[act] = true;
    };
    const release = (e) => {
      if (e) e.preventDefault();
      el.classList.remove('pressed');
      keys[act] = false;
    };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release);
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  }
  bindTouchAction('touchLeft', 'left');
  bindTouchAction('touchRight', 'right');
  bindTouchAction('touchUp', 'up');
  bindTouchAction('touchDown', 'down');
  bindTouchAction('touchAtk', 'attack');
  bindTouchAction('touchJump', 'jump');
  bindTouchAction('touchEncore', 'special');
  bindTouchAction('touchPause', 'pause');

  function clearJustPressed() {
    for (const k in justPressed) justPressed[k] = false;
  }

  // =========================================================================

  function persistLocalHighScore() {
    if (score > highScore) {
      highScore = score;
      try { localStorage.setItem(HI_SCORE_KEY, String(highScore)); } catch (e) {}
    }
  }

  function recordKpopDemonHuntersScore(finalScore) {
    if (scoreSubmittedThisRun || !finalScore || finalScore <= 0) return;
    scoreSubmittedThisRun = true;
    persistLocalHighScore();
    try {
      const storedUser = localStorage.getItem('retrogames4User');
      if (!storedUser) {
        scoreSyncStatus = 'LOGIN AT VAULT TO POST SCORE';
        return;
      }
      const user = JSON.parse(storedUser);
      const userId = user.id || user.userId || user._id;
      if (!userId) {
        scoreSyncStatus = 'LOGIN AT VAULT TO POST SCORE';
        return;
      }

      scoreSyncStatus = 'SYNCING SCORE...';
      const API_BASE_URL = window.API_BASE_URL || 'https://retrogames-service.onrender.com';
      const cacheLocal = (recordId) => {
        try {
          const cachedKey = `retrogames4_scores_${userId}`;
          let cached = [];
          try { cached = JSON.parse(localStorage.getItem(cachedKey) || '[]'); } catch (e) { cached = []; }
          cached.unshift({
            id: recordId || Date.now(),
            user_id: userId,
            userId: userId,
            game_id: GAME_ID,
            gameId: GAME_ID,
            score: Number(finalScore),
            created_at: new Date().toISOString()
          });
          localStorage.setItem(cachedKey, JSON.stringify(cached));
        } catch (e) {}
      };

      fetch(`${API_BASE_URL}/scores`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_id: userId,
          userId: userId,
          game_id: GAME_ID,
          gameId: GAME_ID,
          score: Number(finalScore),
          email: user.email || ''
        })
      }).then(res => {
        if (!res.ok) throw new Error('Score submit failed');
        return res.json();
      }).then(data => {
        cacheLocal(data && data.id);
        scoreSyncStatus = 'SCORE RECORDED TO HALL OF FAME!';
      }).catch(err => {
        console.warn('Could not record K-Pop Demon Hunters score online:', err);
        cacheLocal(Date.now());
        scoreSyncStatus = 'SCORE CACHED OFFLINE!';
      });
    } catch (e) {
      console.warn('Error in recordKpopDemonHuntersScore:', e);
    }
  }

  function spawnEnemy(type, x, y) {
    // Open a magenta dimensional rift first!
    rifts.push({ x, y, life: 0.7, maxLife: 0.7, radius: type === 'boss' ? 30 : 18 });
    const stats = {
      imp:     { name: 'DOKKAEBI IMP',   hp: 46,  speed: 62,  dmg: 9,  reach: 30, score: 250, encoreGain: 22, w: 22 },
      banshee: { name: 'ABYSS BANSHEE',  hp: 38,  speed: 82,  dmg: 10, reach: 28, score: 300, encoreGain: 22, w: 20 },
      gat:     { name: 'SAJA TRICKSTER', hp: 64,  speed: 74,  dmg: 13, reach: 34, score: 450, encoreGain: 25, w: 22 },
      boss:    { name: 'SAJA OVERLORD',  hp: 340, speed: 68,  dmg: 18, reach: 44, score: 3000, encoreGain: 35, w: 32 },
    }[type];

    enemies.push({
      id: Math.random(),
      type,
      name: stats.name,
      x, y, z: 0,
      vx: 0, vy: 0, vz: 0,
      facing: x > (player ? player.x : 120) ? -1 : 1,
      hp: stats.hp,
      maxHp: stats.hp,
      speed: stats.speed,
      dmg: stats.dmg,
      reach: stats.reach,
      score: stats.score,
      encoreGain: stats.encoreGain,
      state: 'spawn', // 'spawn','chase','windup','atk','slam','hurt','ko'
      stateTimer: 0.45,
      animTimer: 0,
      atkCooldown: 0.5 + Math.random() * 0.6,
      hitApplied: false,
      flash: 0,
      enraged: false,
      slamCooldown: 4.0,
      flankSide: Math.random() < 0.5 ? -1 : 1,
      flankYOff: (Math.random() - 0.5) * 18,
    });

  function spawnParticles(x, y, z, color, count = 8, speed = 90) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = speed * (0.4 + Math.random() * 0.8);
      particles.push({
        x, y, z,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp * 0.35,
        vz: 40 + Math.random() * 90,
        size: Math.random() < 0.4 ? 3 : 2,
        color,
        life: 0.28 + Math.random() * 0.24,
        maxLife: 0.52,
        type: 'pixel',
      });
    }

  function addCombo(hits = 1) {

  function addEncore(amount) {
    const wasReady = player.encore >= 100;
    player.encore = Math.min(100, player.encore + amount);

      addFloatText('ENCORE READY!', player.x, player.y - player.z - 52, '#5ef6ff', 1);

  function triggerShake(dur = 0.14, mag = 3) {
